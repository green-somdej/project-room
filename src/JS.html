/* ===== รายงานรายเดือนแยกหน่วยงาน (กราฟ + เมทริกซ์ + PDF A4 แนวนอน) ===== */
const DMX = { key:null, data:null, month:-1, printing:false };
const DMX_COLORS = ['#1f6f3c','#c9a24a','#2f80b7','#d9822b','#7a4fa3','#2aa198','#c0485a','#6b8e23'];
const DMX_MON = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function dmxFmt(v){ v = Number(v) || 0; return Number.isInteger(v) ? v.toLocaleString() : v.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }
function dmxNiceMax(v){ if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; }
/** แยกหน่วยงาน Top N + "อื่นๆ" สำหรับกราฟแท่งซ้อน */
function dmxSeries(d, topN){
  const top = d.rows.slice(0, topN);
  const rest = d.rows.slice(topN);
  const series = top.map((r, i) => ({ name: r.name, monthly: r.monthly, color: DMX_COLORS[i % DMX_COLORS.length] }));
  if (rest.length){
    series.push({ name: 'อื่นๆ (' + rest.length + ' หน่วยงาน)', monthly: d.monthTotals.map((_, m) => rest.reduce((s, r) => s + r.monthly[m], 0)), color: '#b9b4a3' });
  }
  return series;
}
function dmxChartSvg(d, W, H, fs){
  const series = dmxSeries(d, 7);
  const L = 54, R = 10, T = 14, B = 26, iw = W - L - R, ih = H - T - B;
  const max = dmxNiceMax(Math.max(0, ...d.monthTotals));
  const bw = iw / 12 * 0.62;
  let g = '';
  for (let i = 0; i <= 4; i++){
    const y = T + ih - ih * i / 4, v = max * i / 4;
    g += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="#e7e2d3" stroke-width="1"/><text x="${L - 6}" y="${y + 3}" font-size="${fs}" text-anchor="end" fill="#7b7766">${dmxFmt(v)}</text>`;
  }
  for (let m = 0; m < 12; m++){
    const cx = L + iw / 12 * (m + 0.5);
    let acc = 0;
    series.forEach(s => {
      const v = s.monthly[m] || 0; if (v <= 0) return;
      const h = ih * v / max, y = T + ih - ih * (acc + v) / max; acc += v;
      g += `<rect x="${cx - bw / 2}" y="${y}" width="${bw}" height="${Math.max(0.5, h)}" fill="${s.color}"><title>${escapeHtml(s.name)} • ${DMX_MON[m]}: ${dmxFmt(v)} ${d.unit}</title></rect>`;
    });
    if (acc > 0) g += `<text x="${cx}" y="${T + ih - ih * acc / max - 3}" font-size="${fs}" text-anchor="middle" fill="#3b3a30" font-weight="700">${dmxFmt(acc)}</text>`;
    const sel = (typeof DMX !== 'undefined' && DMX.month === m && !DMX.printing);
    g += `<text x="${cx}" y="${H - 8}" font-size="${fs}" text-anchor="middle" fill="${sel ? '#1f6f3c' : '#5d5a4b'}" font-weight="${sel ? 700 : 400}">${DMX_MON[m]}</text>`;
    if (!DMX.printing) g = `${sel ? `<rect x="${cx - iw / 24}" y="${T}" width="${iw / 12}" height="${ih}" fill="#c9a24a" opacity=".13" rx="4"/>` : ''}` + g + `<rect class="dmx-hit" data-m="${m}" x="${cx - iw / 24}" y="${T}" width="${iw / 12}" height="${ih + B}" fill="transparent" style="cursor:pointer"><title>คลิกเพื่อดูอันดับเดือน${PL_MONTH_NAMES_FALLBACK[m]}</title></rect>`;
  }
  const legend = series.map(s => `<span class="dmx-leg"><i style="background:${s.color}"></i>${escapeHtml(s.name)}</span>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="กราฟรายเดือนแยกหน่วยงาน" style="display:block;">${g}</svg><div class="dmx-legend">${legend}</div>`;
}
function dmxTopBars(d, n){
  const list = d.rows.slice(0, n), max = Math.max(1, ...list.map(r => r.total));
  return list.map((r, i) => `<div class="dmx-bar-row"><span class="dmx-bar-no">${r.rank}</span><span class="dmx-bar-name" title="${escapeHtml(r.name)}">${escapeHtml(r.name)}</span><span class="dmx-bar-track"><span class="dmx-bar-fill" style="width:${Math.round(r.total / max * 100)}%;"></span></span><span class="dmx-bar-val">${dmxFmt(r.total)}</span></div>`).join('') || '<p class="muted">ยังไม่มีข้อมูลในปีนี้</p>';
}

/** อันดับหน่วยงานของเดือน m (0-11) หรือทั้งปี (m = -1) */
function dmxRankOf(d, m){
  return d.rows.map(r => ({ name: r.name, v: m < 0 ? r.total : (r.monthly[m] || 0) }))
    .filter(x => x.v > 0)
    .sort((a, b) => b.v - a.v || a.name.localeCompare(b.name, 'th'))
    .map((x, i) => Object.assign(x, { rank: i + 1 }));
}
/** ลูกศรเปลี่ยนอันดับเทียบเดือนก่อนหน้า */
function dmxMove(d, m, name, rank){
  if (m <= 0) return '';
  let pm = m - 1; while (pm >= 0 && !(d.monthTotals[pm] > 0)) pm--;
  if (pm < 0) return '<span class="dmx-mv dmx-new" title="ไม่มีข้อมูลเดือนก่อนหน้า">ใหม่</span>';
  const prev = dmxRankOf(d, pm).find(x => x.name === name);
  if (!prev) return `<span class="dmx-mv dmx-new" title="ไม่มียอดใน${PL_MONTH_NAMES_FALLBACK[pm]}">ใหม่</span>`;
  const diff = prev.rank - rank;
  if (diff > 0) return `<span class="dmx-mv dmx-up" title="${PL_MONTH_NAMES_FALLBACK[pm]} อันดับ ${prev.rank}">▲${diff}</span>`;
  if (diff < 0) return `<span class="dmx-mv dmx-down" title="${PL_MONTH_NAMES_FALLBACK[pm]} อันดับ ${prev.rank}">▼${-diff}</span>`;
  return '<span class="dmx-mv dmx-same" title="อันดับเท่าเดิม">＝</span>';
}
const DMX_MEDAL = ['🥇','🥈','🥉'];
/** กราฟแท่งแนวนอน Top 10 ของเดือนที่เลือก */
function dmxMonthTop(d, m, n, compact){
  const list = dmxRankOf(d, m), top = list.slice(0, n);
  const sum = m < 0 ? d.grandTotal : d.monthTotals[m];
  if (!top.length) return '<p class="muted dmx-empty">ไม่มีการส่งในเดือนนี้</p>';
  const max = Math.max(1, top[0].v);
  return `<div class="dmx-mtop${compact ? ' dmx-mtop-compact' : ''}">` + top.map(x => `
    <div class="dmx-mrow${x.rank <= 3 ? ' dmx-podium' : ''}">
      <span class="dmx-mrank">${x.rank <= 3 ? DMX_MEDAL[x.rank - 1] : x.rank}</span>
      <span class="dmx-mname" title="${escapeHtml(x.name)}">${escapeHtml(x.name)}</span>
      ${compact ? '' : `<span class="dmx-bar-track"><span class="dmx-bar-fill" style="width:${Math.round(x.v / max * 100)}%;"></span></span>`}
      <span class="dmx-mval">${dmxFmt(x.v)}${compact ? '' : ` <small>(${sum > 0 ? Math.round(x.v / sum * 100) : 0}%)</small>`}</span>
      ${compact || m < 0 ? '' : dmxMove(d, m, x.name, x.rank)}
    </div>`).join('') + `</div>` + (list.length > n ? `<p class="muted dmx-more">และอีก ${list.length - n} หน่วยงาน</p>` : '');
}
function dmxMonthChips(d){
  const chip = (m, label) => `<button type="button" class="dmx-chip${DMX.month === m ? ' active' : ''}${m >= 0 && !(d.monthTotals[m] > 0) ? ' empty' : ''}" data-m="${m}">${label}</button>`;
  return `<div class="dmx-chips">${chip(-1, 'ทั้งปี')}${DMX_MON.map((n, m) => chip(m, n)).join('')}</div>`;
}
/** การ์ดเล็ก 1 เดือน (ใช้ทั้งเว็บและ PDF) */
function dmxMonthCard(d, m, n){
  const tot = d.monthTotals[m];
  return `<div class="dmx-mcard${tot > 0 ? '' : ' is-empty'}" data-m="${m}">
    <div class="dmx-mcard-h"><b>${PL_MONTH_NAMES_FALLBACK[m]}</b><span>${tot > 0 ? dmxFmt(tot) + ' ' + d.unit : '–'}</span></div>
    ${dmxMonthTop(d, m, n, true)}
  </div>`;
}
function dmxMonthLabel(m){ return m < 0 ? 'ทั้งปี' : 'เดือน' + PL_MONTH_NAMES_FALLBACK[m]; }
function dmxMatrixRows(d, rows, max, withRank){
  return rows.map(r => `<tr><td class="dmx-c-no">${r.rank}</td><td class="dmx-c-name" title="${escapeHtml(r.name)}">${escapeHtml(r.name)}</td>${r.monthly.map(v => {
    const a = v > 0 ? (0.12 + 0.55 * v / max).toFixed(2) : 0;
    return `<td class="dmx-c-num" style="${v > 0 ? 'background:rgba(31,111,60,' + a + ');' + (a > 0.45 ? 'color:#fff;' : '') : 'color:#b5b09c;'}">${v > 0 ? dmxFmt(v) : '–'}</td>`;
  }).join('')}<td class="dmx-c-num dmx-c-total">${dmxFmt(r.total)}</td></tr>`).join('');
}
function dmxMatrixHead(){ return `<thead><tr><th class="dmx-c-no">#</th><th class="dmx-c-name">หน่วยงาน</th>${DMX_MON.map(m => `<th class="dmx-c-num">${m}</th>`).join('')}<th class="dmx-c-num">รวม</th></tr></thead>`; }
function dmxTotalRow(d){ return `<tr class="dmx-sum"><td></td><td class="dmx-c-name">รวมทุกหน่วยงาน</td>${d.monthTotals.map(v => `<td class="dmx-c-num">${v > 0 ? dmxFmt(v) : '–'}</td>`).join('')}<td class="dmx-c-num dmx-c-total">${dmxFmt(d.grandTotal)}</td></tr>`; }
function dmxMaxCell(d){ return Math.max(1, ...d.rows.map(r => Math.max(...r.monthly))); }
function dmxKpis(d){
  const active = d.monthTotals.filter(v => v > 0).length;
  const peakV = Math.max(...d.monthTotals), peakM = d.monthTotals.indexOf(peakV);
  return `<div class="dmx-kpis">
    <div><b>${dmxFmt(d.grandTotal)}</b><small>${escapeHtml(d.label)} (${d.unit}) ปี ${d.year + 543}</small></div>
    <div><b>${d.rows.length}</b><small>หน่วยงานที่มีการส่ง</small></div>
    <div><b>${active}/12</b><small>เดือนที่มีการส่ง</small></div>
    <div><b>${peakV > 0 ? DMX_MON[peakM] : '–'}</b><small>เดือนสูงสุด ${peakV > 0 ? '(' + dmxFmt(peakV) + ' ' + d.unit + ')' : ''}</small></div>
  </div>`;
}
function dmxRender(){
  const d = DMX.data, body = document.getElementById('dmxBody');
  if (!d){ body.innerHTML = '<p class="muted">กำลังโหลด...</p>'; return; }
  if (!d.rows.length){ body.innerHTML = `${dmxKpis(d)}<p class="muted" style="padding:18px 0;">ยังไม่มีข้อมูลของโครงการนี้ในปี พ.ศ. ${d.year + 543}</p>`; return; }
  const max = dmxMaxCell(d), m = DMX.month;
  const msum = m < 0 ? d.grandTotal : d.monthTotals[m];

  body.innerHTML = `
    ${dmxKpis(d)}

    <div class="dmx-card dmx-rankcard">

        <span class="dmx-rank-sum">ยอดรวม <b>${dmxFmt(msum)}</b> ${d.unit} • ${mcnt} หน่วยงาน</span>
      </div>
      ${dmxMonthChips(d)}
      ${dmxMonthTop(d, m, 10, false)}
      ${m > 0 ? '<p class="muted dmx-note">▲▼ = อันดับขึ้น/ลงเมื่อเทียบกับเดือนก่อนหน้าที่มีข้อมูล</p>' : ''}
    </div>
    <div class="dmx-card">
      <h4>🗓️ Top 10 ของทุกเดือน <small class="muted">— คลิกการ์ดเพื่อดูรายละเอียด</small></h4>
      <div class="dmx-mgrid">${DMX_MON.map((_, i) => dmxMonthCard(d, i, 10)).join('')}</div>

      <div class="dmx-scroll"><table class="dmx-table">${dmxMatrixHead()}<tbody>${dmxMatrixRows(d, d.rows, max)}${dmxTotalRow(d)}</tbody></table></div>
    </div>`;
  const pick = mm => { DMX.month = mm; dmxRender(); const rc = body.querySelector('.dmx-rankcard'); if (rc && rc.scrollIntoView) rc.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); };

}

/** หน้า PDF: A4 แนวนอน — หน้า 1 กราฟ+อันดับ, หน้าต่อไปตารางรายเดือน (แบ่งหน้าอัตโนมัติ ไม่ล้น) */
function dmxPrintPages(d){
  DMX.printing = true;
  const sub = `ปี พ.ศ. ${d.year + 543} • หน่วย: ${d.unit}`;
  const title = '📈 รายงานรายเดือนแยกหน่วยงาน — ' + d.title;
  const pages = [`
    ${rpHeader(title, sub)}
    ${dmxKpis(d)}
    <div class="dmx-grid dmx-print-grid">
      <div class="dmx-card"><h4>ภาพรวมยอดรายเดือน แยกตามหน่วยงาน</h4>${dmxChartSvg(d, 640, 235, 11)}</div>
      <div class="dmx-card"><h4>อันดับหน่วยงาน 1–10 (รวมทั้งปี)</h4>${dmxMonthTop(d, -1, 10, false)}</div>
    </div>`];
  [[0, 6], [6, 12]].forEach(([a, b], i) => {
    pages.push(`${rpHeader('🏆 อันดับหน่วยงาน 1–10 รายเดือน — ' + d.title, `${sub} • ${DMX_MON[a]} – ${DMX_MON[b - 1]} (ส่วนที่ ${i + 1}/2)`)}
      <div class="dmx-mgrid dmx-mgrid-print">${DMX_MON.slice(a, b).map((_, k) => dmxMonthCard(d, a + k, 10)).join('')}</div>`);
  });
  DMX.printing = false;
  const PER = 12, max = dmxMaxCell(d);
  const chunks = chunkArray(d.rows, PER);
  chunks.forEach((c, i) => {
    const last = i === chunks.length - 1;
    pages.push(`${rpHeader('🗓️ ตารางรายเดือนแยกหน่วยงาน — ' + d.title, `${sub} • ส่วนที่ ${i + 1}/${chunks.length}`)}
      <table class="dmx-table dmx-print-table">${dmxMatrixHead()}<tbody>${dmxMatrixRows(d, c, max)}${last ? dmxTotalRow(d) : ''}</tbody></table>`);
  });
  return pages;
}

  const er = document.getElementById('rqrError'); er.classList.add('hidden');
  if (!q){
    const code = document.getElementById('rqrCode').value.trim().toUpperCase(), contact = document.getElementById('rqrContact').value.trim();
    if (!code || !contact) return emShowErr('rqrError', 'กรุณากรอกรหัสคำขอ และ E-mail / เบอร์โทร / รหัสเจ้าหน้าที่');
    q = { code: code, contact: contact };
  }
  const btn = document.getElementById('rqrFind'); btn.disabled = true;
  google.script.run.withSuccessHandler(r => { btn.disabled = false; RQ.recv = r; rqRenderInfo(r); })
    .withFailureHandler(e => { btn.disabled = false; document.getElementById('rqrLookup').classList.remove('hidden'); emShowErr('rqrError', (e && e.message) || e); })
    .getProductRequestForReceive(q);
}
function rqConfirmReceived(){
  if (!RQ.recv) return;
  const btn = document.getElementById('rqrConfirm'); btn.disabled = true; btn.textContent = 'กำลังบันทึก...';
  google.script.run.withSuccessHandler(r => {
    btn.disabled = false; btn.textContent = '✅ ยืนยันว่าได้รับแล้ว';
    RQ.recv = Object.assign(RQ.recv, r); rqRenderInfo(RQ.recv);
    document.getElementById('rqrInfo').insertAdjacentHTML('beforeend', '<p class="rq-thanks">🙏 ขอบคุณค่ะ — ผู้ดูแลโครงการจะยืนยันอีกครั้ง และแจ้งผลทาง E-mail ที่ลงทะเบียนไว้</p>');
    if (state.session) loadRq(RQ.project);
  }).withFailureHandler(e => { btn.disabled = false; btn.textContent = '✅ ยืนยันว่าได้รับแล้ว'; emShowErr('rqrError', (e && e.message) || e); })
    .confirmProductReceived(RQ.recv.RequestID, RQ.recv.token);
}

/* ---------- ผู้ดูแลระบบ: รายการคำขอ ---------- */
function loadRq(project){
  const panel = document.getElementById('rqPanel-' + project);
  if (!panel) return;
  if (!state.session){ panel.classList.add('hidden'); return; }
  google.script.run.withSuccessHandler(rows => { RQ.rows[project] = rows || []; renderRqPanel(project); })
    .withFailureHandler(() => panel.classList.add('hidden'))
    .getProductRequests(state.session.departmentId, state.session.pin, project);
}
function renderRqPanel(project){
  const panel = document.getElementById('rqPanel-' + project), all = RQ.rows[project] || [], c = RQ_CFG[project];
  panel.classList.toggle('hidden', !state.session); if (!state.session) return;
  const f = RQ.filter[project];
  const cnt = k => all.filter(r => k === 'open' ? (r.Status === RQ_ST.wait || r.Status === RQ_ST.recv) : k === 'all' ? true : r.Status === k).length;
  const rows = all.filter(r => f === 'open' ? (r.Status === RQ_ST.wait || r.Status === RQ_ST.recv) : f === 'all' ? true : r.Status === f);
  const tabs = [['open', 'ค้างดำเนินการ'], [RQ_ST.recv, 'ผู้ขอรับแล้ว'], [RQ_ST.done, 'เสร็จสิ้น'], [RQ_ST.cancel, 'ยกเลิก'], ['all', 'ทั้งหมด']]
    .map(([k, l]) => `<button class="rq-tab${f === k ? ' on' : ''}" data-rqf="${k}">${l} <i>${cnt(k)}</i></button>`).join('');
  const body = rows.length ? rows.map(r => `<tr class="${r.Status === RQ_ST.recv ? 'rq-hl' : ''}">
      <td><b>${escapeHtml(r.RequestCode)}</b><br><small class="muted">${r.CreatedAt ? fmtDate(r.CreatedAt.slice(0, 10)) : ''}</small></td>
      <td><b>${escapeHtml(r.Who)}</b><br><small class="muted">${escapeHtml(r.RequesterType)}${r.StaffCode ? ' • ' + escapeHtml(r.StaffCode) : ''}</small></td>
      <td><small>${r.Phone ? '📞 ' + escapeHtml(r.Phone) + '<br>' : ''}📧 ${escapeHtml(r.Email)}</small></td>
      <td class="num"><b>${emN(r.ConfirmedQty || r.Quantity)}</b> ${escapeHtml(r.Unit)}</td>
      <td>${escapeHtml(r.Purpose)}${r.Place ? '<br><small class="muted">📍 ' + escapeHtml(r.Place) + '</small>' : ''}${r.WantedDate ? '<br><small class="muted">ต้องการรับ ' + fmtDate(r.WantedDate) + '</small>' : ''}</td>
      <td>${rqStatusBadge(r.Status)}${r.Status === RQ_ST.done ? `<br><small class="muted">${escapeHtml(r.AdminBy)}${r.EmailSentAt ? ' • 📧 ส่งอีเมลแล้ว' : ' • ⚠️ ยังไม่ได้ส่งอีเมล'}</small>` : ''}${r.CancelReason ? '<br><small class="muted">' + escapeHtml(r.CancelReason) + '</small>' : ''}</td>
      <td class="vf-act">${(r.Status === RQ_ST.wait || r.Status === RQ_ST.recv) ? `<button class="btn btn-primary btn-sm" data-rqok="${escapeHtml(r.RequestID)}">✓ ยืนยันส่งมอบ</button><button class="btn btn-outline btn-sm vf-no" data-rqno="${escapeHtml(r.RequestID)}">✕</button>` : ''}</td>
    </tr>`).join('') : `<tr><td colspan="7" class="muted" style="text-align:center;padding:18px">ไม่มีรายการ</td></tr>`;
  panel.innerHTML = `<div class="vf-head"><h4>🙋 คำขอรับ${c.label} — ค้างดำเนินการ <span class="vf-count">${cnt('open')}</span></h4><div class="rq-tabs">${tabs}</div></div>
    <p class="muted vf-hint">ขั้นตอน: ผู้ขอลงทะเบียน → ผู้ขอกด "ยืนยันว่าได้รับแล้ว" (แถวสีเหลือง) → ผู้ดูแลระบบกด <b>✓ ยืนยันส่งมอบ</b> = หักจาก${c.label} คงเหลือ บันทึกในประวัติการใช้ และส่ง E-mail แจ้งผู้ขอ</p>
    <div class="vf-scroll"><table class="vf-table"><thead><tr><th>รหัสคำขอ</th><th>ผู้ขอ</th><th>ติดต่อ</th><th class="num">ปริมาณ</th><th>นำไปใช้</th><th>สถานะ</th><th></th></tr></thead><tbody>${body}</tbody></table></div>`;
  panel.querySelectorAll('[data-rqf]').forEach(b => b.onclick = () => { RQ.filter[project] = b.dataset.rqf; renderRqPanel(project); });
  panel.querySelectorAll('[data-rqok]').forEach(b => b.onclick = () => rqAdminConfirm(project, b.dataset.rqok));
  panel.querySelectorAll('[data-rqno]').forEach(b => b.onclick = () => rqAdminCancel(project, b.dataset.rqno));
}
function rqAdminConfirm(project, rid){
  if (!requireSession()) return;
  const r = (RQ.rows[project] || []).find(x => x.RequestID === rid), c = RQ_CFG[project];
  if (!r) return;
  const note = r.Status === RQ_ST.recv ? '' : '\n(ผู้ขอยังไม่ได้กดยืนยันว่าได้รับ)';
  const v = prompt(`ยืนยันส่งมอบ${c.label} ให้ ${r.Who}${note}\nปริมาณที่ส่งมอบจริง (${c.unit}):`, r.Quantity);
  if (v === null) return;
  if (!(Number(v) > 0)) return alert('ปริมาณต้องมากกว่า 0');
  const panel = document.getElementById('rqPanel-' + project); panel.querySelectorAll('button').forEach(b => b.disabled = true);
  google.script.run.withSuccessHandler(res => {
    if (!res.mailed) alert('ยืนยันเรียบร้อย แต่ส่ง E-mail ไม่สำเร็จ — กรุณาแจ้งผู้ขอด้วยตนเอง');
    c.reload();
  }).withFailureHandler(e => { alertErr(e); renderRqPanel(project); })
    .adminConfirmProductRequest(state.session.departmentId, state.session.pin, rid, Number(v));
}
function rqAdminCancel(project, rid){
  if (!requireSession()) return;
  const reason = prompt('ยกเลิกคำขอนี้? ระบุเหตุผล (ไม่บังคับ):', '');
  if (reason === null) return;
  google.script.run.withSuccessHandler(() => loadRq(project)).withFailureHandler(alertErr)
    .adminCancelProductRequest(state.session.departmentId, state.session.pin, rid, reason);
}

/* ---------- ตั้งค่ารอบการหมัก ---------- */
function openFermSettings(project){
  if (!requireSession()) return;
  const c = RQ_CFG[project], d = c.data(); RQ.project = project;
  if (!d){ (project === 'em' ? loadEm : loadCp)(); setTimeout(() => openFermSettings(project), 900); return; }
  const st = d.settings || {};
  document.getElementById('fsTitle').textContent = '⚙️ ตั้งค่ารอบการหมัก — ' + (project === 'em' ? 'น้ำยา EM' : 'ปุ๋ยหมักใบไม้');
  document.getElementById('fsStage1').value = st.Stage1Days; document.getElementById('fsStage2').value = st.Stage2Days;
  document.getElementById('fsReady').value = st.ReadyDays; document.getElementById('fsCheck').value = st.CheckIntervalDays;
  document.getElementById('fsError').classList.add('hidden'); fsPreview(); openModal('modalFermSettings');
}
function fsVals(){ const n = id => Math.round(Number(document.getElementById(id).value)); return { Stage1Days: n('fsStage1'), Stage2Days: n('fsStage2'), ReadyDays: n('fsReady'), CheckIntervalDays: n('fsCheck') }; }
function fsPreview(){
  const v = fsVals(), el = document.getElementById('fsPreview');
  if (!(v.ReadyDays > 0)) { el.innerHTML = ''; return; }
  const pos = d => Math.max(0, Math.min(100, d / v.ReadyDays * 100));
  const d = RQ_CFG[RQ.project].data(), batches = d && d.batches ? d.batches.filter(b => b.stage === 'done') : [];
  const avg = batches.length ? Math.round(batches.reduce((s, b) => s + b.age, 0) / batches.length) : null;
  el.innerHTML = `<div class="fs-bar"><i style="left:${pos(v.Stage1Days)}%"><em>${v.Stage1Days}</em></i><i style="left:${pos(v.Stage2Days)}%"><em>${v.Stage2Days}</em></i><i class="end" style="left:100%"><em>${v.ReadyDays} วัน</em></i></div>
    <p class="muted">ตามเกณฑ์: ครบกำหนด <b>${v.ReadyDays}</b> วัน • ตรวจทุก <b>${v.CheckIntervalDays || '-'}</b> วัน${avg !== null ? ` • ตามจริง (เฉลี่ย ${batches.length} รอบที่เก็บแล้ว): <b>${avg}</b> วัน` : ''}</p>`;
}
function saveFermSettingsUi(){
  const v = fsVals(), btn = document.getElementById('fsSave');
  if (!(v.Stage1Days < v.Stage2Days && v.Stage2Days < v.ReadyDays)) return emShowErr('fsError', 'ต้องเรียงจากน้อยไปมาก: ระยะที่ 1 < ระยะที่ 2 < ครบกำหนด');
  btn.disabled = true;
  google.script.run.withSuccessHandler(() => { btn.disabled = false; closeModals(); RQ_CFG[RQ.project].reload(); })
    .withFailureHandler(e => { btn.disabled = false; emShowErr('fsError', (e && e.message) || e); })
    .saveFermentSettings(state.session.departmentId, state.session.pin, RQ.project, v);
}

/* ---------- ผูกปุ่ม ---------- */
(function bindRq(){
  document.addEventListener('click', e => {
    const o = e.target.closest('[data-rq-open]'); if (o) return openRqForm(o.dataset.rqOpen);
    const r = e.target.closest('[data-rq-receive]'); if (r) return openRqReceive(r.dataset.rqReceive);
    const s = e.target.closest('[data-ferm-settings]'); if (s) return openFermSettings(s.dataset.fermSettings);
    const cp = e.target.closest('[data-rq-copy]'); if (cp){ const k = cp.dataset.rqCopy; return rqCopy(document.getElementById('rqLinkInput-' + k), document.getElementById('rqCopyConfirm-' + k)); }
  });
  document.querySelectorAll('input[name="rqType"]').forEach(i => i.onchange = rqApplyType);
  document.getElementById('rqfStaff').addEventListener('input', e => { e.target.value = e.target.value.replace(/\D/g, '').slice(0, 7); });
  document.getElementById('rqfSave').onclick = submitRqForm;
  document.getElementById('rqrFind').onclick = () => rqFind();
  document.getElementById('rqrConfirm').onclick = rqConfirmReceived;
  document.getElementById('rqdCopy').onclick = () => rqCopy(document.getElementById('rqdLink'));
  ['fsStage1', 'fsStage2', 'fsReady', 'fsCheck'].forEach(id => document.getElementById(id).oninput = fsPreview);
  document.getElementById('fsSave').onclick = saveFermSettingsUi;
})();

/* ============================================================
   วัตถุดิบเข้า-ออกรายเดือน (ขยะเปียก → น้ำยา EM / ใบไม้ → ปุ๋ยหมัก)
   ============================================================ */
const RAW = { em: { year: new Date().getFullYear(), data: null }, compost: { year: new Date().getFullYear(), data: null }, edit: null };
const RAW_MON = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
const RAW_MON_FULL = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
const RAW_NAME = { em: { in: 'ขยะเปียกเข้า', out: 'นำไปหมัก EM', title: 'ขยะเปียก', pane: 'emPaneBalance' }, compost: { in: 'วัตถุดิบเข้า', out: 'นำไปหมักปุ๋ย', title: 'ใบไม้ เศษหญ้า กิ่งไม้', pane: 'cpPaneBalance' } };
function rawKg(v){ v = Number(v) || 0; return v.toLocaleString(undefined, { maximumFractionDigits: 2 }); }
function loadRawBal(project, year){
  const R = RAW[project], pane = document.getElementById(RAW_NAME[project].pane);
  if (year) R.year = year;
  if (!R.data) pane.innerHTML = '<div class="loading">กำลังโหลดข้อมูล...</div>';
  google.script.run.withSuccessHandler(d => { R.data = d; renderRawBal(project); })
    .withFailureHandler(e => { pane.innerHTML = '<p class="error">' + escapeHtml((e && e.message) || e) + '</p>'; })
    .getRawBalance(project, R.year);
}
function renderRawBal(project){
  const d = RAW[project].data, N = RAW_NAME[project], pane = document.getElementById(N.pane), admin = !!state.session;
  const t = d.totals, maxV = Math.max(1, ...d.months.map(m => Math.max(m.inKg, m.usedKg)));
  const kpi = (ic, lbl, v, cls, sub) => `<div class="rb-kpi ${cls || ''}"><span>${ic} ${lbl}</span><b>${rawKg(v)}</b><em>กก.${sub ? ' • ' + sub : ''}</em></div>`;
  const bars = d.months.map(m => `<div class="rb-col${m.future ? ' fut' : ''}" title="${RAW_MON_FULL[m.month - 1]}: เข้า ${rawKg(m.inKg)} • ออก ${rawKg(m.usedKg)} กก.">
      <div class="rb-pair"><i class="in" style="height:${m.inKg / maxV * 100}%"></i><i class="out" style="height:${m.usedKg / maxV * 100}%"></i></div><small>${RAW_MON[m.month - 1]}</small></div>`).join('');
  const rows = d.months.map(m => {
    const neg = m.closing < -1e-9, warn = !m.hasIn && m.usedKg > 0;
    return `<tr class="${m.future ? 'rb-fut' : ''}${neg ? ' rb-neg' : ''}">
      <td><b>${RAW_MON_FULL[m.month - 1]}</b>${m.note ? '<br><small class="muted">' + escapeHtml(m.note) + '</small>' : ''}</td>
      <td class="num">${rawKg(m.opening)}</td>
      <td class="num rb-in">${m.hasIn ? '+' + rawKg(m.inKg) : '<span class="muted">' + (warn ? '⚠️ ยังไม่บันทึก' : '–') + '</span>'}</td>
      <td class="num rb-out">${m.usedKg ? '−' + rawKg(m.usedKg) : '<span class="muted">–</span>'}</td>
      <td class="num"><b>${rawKg(m.closing)}</b>${neg ? '<br><small class="rb-negtxt">ใช้เกินที่บันทึกเข้า</small>' : ''}</td>
      <td class="num">${m.usePct === null ? '–' : '<span class="rb-pct"><i style="width:' + Math.min(100, m.usePct) + '%"></i></span> ' + m.usePct + '%'}</td>
      ${admin ? `<td><button class="btn btn-outline btn-sm" data-rawedit="${m.month}">✏️</button></td>` : ''}
    </tr>`; }).join('');
  pane.innerHTML = `<section class="breakdown-card rb">
    <div class="rb-head">
      <div><h4>⚖️ ${N.title} เข้า-ออก รายเดือน</h4><p class="muted">เข้า = ปริมาณที่มีในระบบแต่ละเดือน • ออก = นำไปหมักจริง (รอบใหม่นับเดือนที่เริ่มหมัก, การเติมวัตถุดิบนับเดือนที่เติม) • คงเหลือยกไปเดือนถัดไป</p></div>
      <div class="rb-tools"><select id="rbYear-${project}">${d.years.map(y => `<option value="${y}" ${y === d.year ? 'selected' : ''}>ปี ${y + 543}</option>`).join('')}</select>
        ${admin ? `<button class="btn btn-primary btn-sm" data-rawedit="0">+ บันทึก${N.in}</button>` : ''}</div>
    </div>
    <div class="rb-kpis">${kpi('📥', 'ยกมาต้นปี', d.opening)}${kpi('➕', N.in + ' (ปีนี้)', t.inKg, 'in')}${kpi('➖', N.out + ' (ปีนี้)', t.usedKg, 'out')}${kpi('📦', 'คงเหลือ', t.closing, t.closing < 0 ? 'neg' : 'bal', t.usePct === null ? '' : 'ใช้ประโยชน์ ' + t.usePct + '%')}</div>
    <div class="rb-chart">${bars}</div>
    <div class="rb-legend"><span><i class="in"></i>${N.in}</span><span><i class="out"></i>${N.out}</span></div>
    <div class="vf-scroll"><table class="vf-table rb-table"><thead><tr><th>เดือน</th><th class="num">ยกมา</th><th class="num">เข้า</th><th class="num">ออก (หมัก)</th><th class="num">คงเหลือ</th><th class="num">% ใช้</th>${admin ? '<th></th>' : ''}</tr></thead>
      <tbody>${rows}</tbody><tfoot><tr><td><b>รวมปี ${d.year + 543}</b></td><td class="num">${rawKg(d.opening)}</td><td class="num rb-in"><b>+${rawKg(t.inKg)}</b></td><td class="num rb-out"><b>−${rawKg(t.usedKg)}</b></td><td class="num"><b>${rawKg(t.closing)}</b></td><td class="num">${t.usePct === null ? '–' : t.usePct + '%'}</td>${admin ? '<td></td>' : ''}</tr></tfoot></table></div>
  </section>`;
  document.getElementById('rbYear-' + project).onchange = e => loadRawBal(project, Number(e.target.value));
  pane.querySelectorAll('[data-rawedit]').forEach(b => b.onclick = () => openRawIn(project, Number(b.dataset.rawedit)));
}
function openRawIn(project, month){
  if (!requireSession()) return;
  const d = RAW[project].data, N = RAW_NAME[project], now = new Date();
  RAW.edit = project;
  const m = month || (d.year === now.getFullYear() ? now.getMonth() + 1 : 1);
  document.getElementById('rawTitle').textContent = '⚖️ บันทึก' + N.in + 'ประจำเดือน';
  document.getElementById('rawHint').textContent = 'ปริมาณ' + N.title + 'ที่มีในระบบของเดือน — ระบบจะหักส่วนที่นำไปหมักในเดือนเดียวกันให้อัตโนมัติ';
  document.getElementById('rawMonth').innerHTML = RAW_MON_FULL.map((n, i) => `<option value="${i + 1}" ${i + 1 === m ? 'selected' : ''}>${n}</option>`).join('');
  const ys = []; for (let y = now.getFullYear() + 1; y >= now.getFullYear() - 5; y--) ys.push(y);
  document.getElementById('rawYear').innerHTML = ys.map(y => `<option value="${y}" ${y === d.year ? 'selected' : ''}>${y + 543}</option>`).join('');
  const fill = () => { const mm = Number(document.getElementById('rawMonth').value), yy = Number(document.getElementById('rawYear').value);
    const row = yy === d.year ? d.months[mm - 1] : null;
    document.getElementById('rawKg').value = row && row.hasIn ? row.inKg : ''; document.getElementById('rawNote').value = row ? row.note : ''; };
  document.getElementById('rawMonth').onchange = fill; document.getElementById('rawYear').onchange = fill; fill();
  document.getElementById('rawError').classList.add('hidden'); openModal('modalRawIn');
}
function saveRawIn(){
  const project = RAW.edit, btn = document.getElementById('rawSave'), kgS = document.getElementById('rawKg').value.trim();
  if (kgS !== '' && !(Number(kgS) >= 0)) return emShowErr('rawError', 'กรุณาระบุปริมาณเป็นตัวเลข (กก.)');
  const y = Number(document.getElementById('rawYear').value);
  btn.disabled = true;
  google.script.run.withSuccessHandler(() => { btn.disabled = false; closeModals(); RAW[project].year = y; loadRawBal(project); })
    .withFailureHandler(e => { btn.disabled = false; emShowErr('rawError', (e && e.message) || e); })
    .saveRawMonthly(state.session.departmentId, state.session.pin, project, y, Number(document.getElementById('rawMonth').value), kgS === '' ? '' : Number(kgS), document.getElementById('rawNote').value.trim());
}
document.getElementById('rawSave').onclick = saveRawIn;
