<style>
  :root{
    --green-700:#1f6f3c; --green-600:#2e8b57; --green-500:#3fa96a; --green-100:#e8f5ec;
    --gray-100:#f4f6f5; --gray-200:#e5e9e7; --gray-500:#6b7570; --gray-800:#2c332f;
    --amber:#e8a33d; --red:#d9534f; --blue:#3f7fbf; --purple:#8e6bbf;
    --radius:10px;
    /* สีประจำโครงการ "ทอดไม่ทิ้ง" (น้ำมัน/อำพัน) */
    --oil-700:#8a5a1b; --oil-600:#c17f2b; --oil-500:#d99a4e; --oil-100:#fbe9d2;
    /* สีประจำโครงการ "Paperless" (กระดาษ/ฟ้า) */
    --paper-blue-700:#1d5fa0; --paper-blue-600:#2f7fc4; --paper-blue-500:#4f9bdc; --paper-blue-100:#e5f0fb;
    /* สีประจำโครงการ "ตลับหมึกเก่าเราขอ" (หมึกพิมพ์/ม่วงคราม) */
    --ink-700:#4c2a82; --ink-600:#6c3fb5; --ink-500:#9169d6; --ink-100:#efe7fb;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Sarabun','Segoe UI',sans-serif; background:var(--gray-100); color:var(--gray-800);
  }
  .hidden{display:none !important;}
  .muted{color:var(--gray-500); font-size:13px;}

  /* Header */
  .topbar{
    display:flex; justify-content:space-between; align-items:center;
    background:linear-gradient(135deg,var(--green-700),var(--green-500));
    color:#fff; padding:16px 24px;
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .brand-icon{font-size:32px;}
  .brand h1{font-size:18px; margin:0;}
  .brand p{font-size:12px; margin:2px 0 0; opacity:.9;}

  /* Buttons */
  .btn{border:none; border-radius:8px; padding:8px 14px; font-size:14px; cursor:pointer; font-family:inherit;}
  .btn:disabled{opacity:.6; cursor:wait;}
  .btn-primary{background:var(--green-600); color:#fff;}
  .btn-primary:hover{background:var(--green-700);}
  .btn-outline{background:#fff; border:1px solid var(--gray-200); color:var(--gray-800);}
  .btn-outline:hover{background:var(--gray-100);}
  .btn-danger{background:#fff; border:1px solid var(--red); color:var(--red); margin-left:8px;}
  .btn-icon{background:#fff; border:1px solid var(--gray-200); width:32px; height:32px; border-radius:50%;}

  /* Toolbar */
  main.view{padding:20px 24px;}
  .toolbar{display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin-bottom:12px;}
  .filters{display:flex; gap:8px; flex-wrap:wrap; flex:1;}
  select, input, textarea{
    padding:8px 10px; border:1px solid var(--gray-200); border-radius:8px; font-family:inherit; font-size:14px;
  }
  #fSearch{min-width:200px;}
  .year-nav{display:flex; align-items:center; gap:8px;}
  .year-label{font-weight:600; min-width:60px; text-align:center;}

  /* Legend */
  .legend{display:flex; gap:16px; flex-wrap:wrap; margin-bottom:10px; font-size:13px;}
  .legend-item{display:flex; align-items:center; gap:6px;}
  .dot{width:10px; height:10px; border-radius:50%; display:inline-block;}
  .dot-notstarted{background:#b8bfba;}
  .dot-progress{background:var(--amber);}
  .dot-delay{background:var(--red);}
  .dot-done{background:var(--green-600);}
  .dot-hold{background:var(--purple);}

  /* Gantt */
  .gantt-wrap{background:#fff; border-radius:var(--radius); overflow:hidden; box-shadow:0 1px 4px rgba(0,0,0,.06);}
  .gantt-header{display:grid; grid-template-columns:220px repeat(12,1fr); background:var(--green-100); font-size:12px; font-weight:600;}
  .gantt-header > div{padding:8px 4px; text-align:center; border-left:1px solid #fff;}
  .gantt-header > div:first-child{text-align:left; padding-left:12px;}
  .gantt-row{display:grid; grid-template-columns:220px repeat(12,1fr); border-top:1px solid var(--gray-200); align-items:center; min-height:64px; padding-top:16px;}
  .gantt-row:hover{background:var(--gray-100);}
  .gantt-label{padding:6px 12px; font-size:13px; cursor:pointer; color:var(--green-700); font-weight:600;}
  .gantt-label .sub{display:block; font-weight:400; color:var(--gray-500); font-size:11px;}
  .gantt-track{grid-column:2 / span 12; position:relative; height:24px; margin:0 4px;}
  .gantt-bar{
    position:absolute; top:0; height:22px; border-radius:6px; color:#fff; font-size:11px;
    display:flex; align-items:center; padding:0 6px; white-space:nowrap; overflow:hidden; cursor:pointer;
    box-shadow:inset 0 -10px 0 rgba(0,0,0,.12);
  }
  .bar-notstarted{background:#b8bfba;}
  .bar-progress{background:var(--amber);}
  .bar-delay{background:var(--red);}
  .bar-done{background:var(--green-600);}
  .bar-hold{background:var(--purple);}
  .bar-ongoing{border-right:3px dashed rgba(255,255,255,.8);}
  .loading, .empty{padding:24px; text-align:center; color:var(--gray-500);}

  .gantt-status-pin{
    position:absolute; top:-16px; font-size:13px; cursor:pointer; transform:translateX(-50%);
    filter:drop-shadow(0 1px 1px rgba(0,0,0,.3));
  }
  .status-caption{
    display:block; font-style:italic; color:var(--gray-800) !important; margin-top:2px;
    max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }

  .row-detail-btn{
    display:block; margin-top:4px; background:none; border:none; padding:0;
    color:var(--blue); font-size:11px; cursor:pointer; text-decoration:underline;
  }
  .row-edit-btn{color:var(--green-700); font-weight:600;}

  /* KPI */
  .kpi-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:12px; margin-bottom:14px;}
  .kpi-card{background:#fff; border-radius:var(--radius); padding:16px; text-align:center; box-shadow:0 1px 4px rgba(0,0,0,.06); border-top:4px solid var(--green-600);}
  .kpi-card .kpi-num{font-size:30px; font-weight:800; color:var(--green-700); line-height:1.1;}
  .kpi-card .kpi-label{font-size:12px; color:var(--gray-500); margin-top:4px;}
  .kpi-card.kpi-notstarted{border-top-color:#b8bfba;}
  .kpi-card.kpi-progress{border-top-color:var(--amber);}
  .kpi-card.kpi-delay{border-top-color:var(--red);}
  .kpi-card.kpi-done{border-top-color:var(--green-600);}
  .kpi-card.kpi-hold{border-top-color:var(--purple);}
  .kpi-card.kpi-notstarted .kpi-num{color:#7d857f;}
  .kpi-card.kpi-progress .kpi-num{color:#b5791f;}
  .kpi-card.kpi-delay .kpi-num{color:var(--red);}
  .kpi-card.kpi-hold .kpi-num{color:var(--purple);}

  /* Breakdown */
  .breakdown-row{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:16px;}
  .breakdown-card{background:#fff; border-radius:var(--radius); padding:16px 18px; box-shadow:0 1px 4px rgba(0,0,0,.06);}
  .breakdown-header{display:flex; align-items:center; gap:12px; margin-bottom:12px; padding-bottom:10px; border-bottom:1px solid var(--gray-200);}
  .breakdown-header-icon{width:34px; height:34px; border-radius:50%; background:var(--green-700); color:#fff; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0;}
  .breakdown-header h4{margin:0; font-size:15px; color:var(--gray-800);}
  .breakdown-header p{margin:2px 0 0; font-size:12px;}
  .breakdown-body{display:flex; gap:18px; align-items:center;}
  .breakdown-pie{flex-shrink:0; width:150px;}
  .breakdown-pie svg{width:100%; height:auto;}
  .breakdown-list{display:flex; flex-direction:column; gap:12px; flex:1; min-width:0;}
  .breakdown-item{display:flex; gap:10px; align-items:flex-start;}
  .breakdown-item .bi-icon{width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:13px; color:#fff; flex-shrink:0; margin-top:1px;}
  .breakdown-item .bi-title{font-weight:700; font-size:13px;}
  .breakdown-item .bi-sub{font-size:11px; color:var(--gray-500); margin-top:2px;}
  @media (max-width:720px){ .breakdown-row{grid-template-columns:1fr;} .breakdown-body{flex-direction:column;} .breakdown-pie{width:170px;} }

  /* Timeline หลายปี */
  .year-timeline-wrap{margin-bottom:16px;}
  .yt-axis{display:grid; font-size:12px; color:var(--gray-500); margin-bottom:6px; position:relative; height:18px;}
  .yt-axis span{position:absolute; transform:translateX(-50%);}
  .yt-row{display:flex; align-items:center; gap:10px; padding:6px 0;}
  .yt-label{width:230px; flex-shrink:0; font-size:12px;}
  .yt-label .yt-name{font-weight:700; color:var(--gray-800); display:block;}
  .yt-label .yt-status{display:inline-block; margin-top:2px;}
  .yt-track{flex:1; position:relative; height:26px; background:var(--gray-100); border-radius:6px;}
  .yt-bar{position:absolute; top:0; height:26px; border-radius:6px; color:#fff; font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center;}
  .yt-current-line{position:absolute; top:-4px; bottom:-4px; width:0; border-left:2px dashed var(--amber); z-index:2;}
  .yt-current-label{position:absolute; bottom:-18px; font-size:10px; color:var(--amber); font-weight:700; transform:translateX(-50%);}
  .yt-chart-inner{position:relative; padding-bottom:20px;}

  /* Detail view */
  .detail-top-row{display:flex; justify-content:space-between; align-items:flex-start; gap:12px;}
  .detail-title-group{display:flex; gap:14px; align-items:center;}
  .detail-icon{width:44px; height:44px; border-radius:50%; background:var(--green-700); color:#fff; display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0;}
  .detail-eyebrow{margin:0; font-size:12px; color:var(--gray-500); font-weight:700;}
  .detail-title-group h2{margin:2px 0 0; font-size:19px;}
  .status-pill{padding:6px 16px; border-radius:20px; color:#fff; font-weight:700; font-size:13px; white-space:nowrap;}
  .detail-admin-row{margin:10px 0 0;}
  .linked-campaign-banner{
    display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;
    background:var(--gray-100); border-radius:10px; padding:12px 16px; margin-top:12px; font-size:13px; color:var(--gray-800);
  }
  .detail-info-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:16px;}
  .detail-info-card{background:var(--gray-100); border-radius:10px; padding:14px 16px;}
  .info-row{display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-bottom:1px solid #e5e9e7; font-size:13px; gap:10px;}
  .info-row:last-child{border-bottom:none;}
  .info-k{color:var(--gray-500);}
  .info-v{font-weight:700; text-align:right;}
  .mini-progress-track{flex:1; background:var(--gray-200); border-radius:20px; height:10px; overflow:hidden; min-width:60px;}
  .mini-progress-fill{display:block; height:100%; background:var(--green-600); border-radius:20px;}
  .detail-status-card{background:var(--green-700); color:#fff; border-radius:10px; padding:16px 18px;}
  .status-card-head{font-weight:700; margin-bottom:10px; display:flex; align-items:center; gap:8px;}
  .detail-status-card p{margin:0; font-size:13px; line-height:1.6;}
  @media (max-width:720px){ .detail-info-grid{grid-template-columns:1fr;} }

  .single-timeline-track{background:var(--gray-200); border-radius:6px; height:26px; position:relative; overflow:hidden;}
  .single-timeline-bar{position:absolute; top:0; height:26px; border-radius:6px;}
  .single-timeline-dates{display:flex; justify-content:space-between; font-size:11px; color:var(--gray-500); margin-top:4px;}

  /* โครงการที่ต้องเร่งติดตาม */
  .attention-card{background:#fff5f0; border:1px solid #f3c9b0; border-radius:var(--radius); padding:16px 18px; margin-bottom:16px;}
  .attention-card h3{margin:0 0 4px; color:#b5461f;}
  .attention-item{background:#fff; border-radius:8px; padding:12px 14px; margin-top:10px; border-left:4px solid var(--red); cursor:pointer;}
  .attention-item:hover{background:#fffaf7;}
  .attention-item .ai-name{font-weight:700; color:var(--gray-800);}
  .attention-item .ai-meta{font-size:12px; color:var(--gray-500); margin:2px 0 6px;}
  .attention-item .ai-status{font-size:13px; font-style:italic;}
  .attention-item .ai-progress{font-weight:700; color:var(--red); float:right;}

  .export-bar{display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap;}

  /* Donut */
  .donut-wrap{flex-shrink:0;}
  .progress-row{display:flex; align-items:center; gap:20px; margin:14px 0;}
  .progress-info{flex:1; display:flex; flex-direction:column; gap:10px; align-items:flex-start;}
  .mini-donut{vertical-align:middle; margin-right:4px;}

  .gantt-wrap.single .gantt-header, .gantt-wrap.single .gantt-row{grid-template-columns:1fr;}
  .gantt-wrap.single .gantt-track{grid-column:1; margin:10px 12px;}

  .detail-card, .log-card, .qa-card{background:#fff; border-radius:var(--radius); padding:18px 20px; margin-bottom:16px; box-shadow:0 1px 4px rgba(0,0,0,.06);}
  .badge{background:var(--green-100); color:var(--green-700); font-size:12px; padding:3px 10px; border-radius:20px;}

  .qa-item{border-left:3px solid #3b82f6; padding:10px 14px; margin-bottom:10px; background:var(--gray-100); border-radius:0 8px 8px 0;}
  .qa-item .qa-q-row{display:flex; justify-content:space-between; align-items:flex-start; gap:8px; flex-wrap:wrap;}
  .qa-item .qa-asker{font-weight:600; font-size:13px; color:var(--gray-700);}
  .qa-item .qa-date{font-size:12px; color:var(--gray-500);}
  .qa-item .qa-question{margin:6px 0 0; font-size:14px; white-space:pre-wrap;}
  .qa-item .qa-answer{margin:10px 0 0; padding:10px 12px; background:#fff; border-radius:8px; font-size:13px; white-space:pre-wrap;}
  .qa-item .qa-answer-head{font-size:12px; font-weight:700; margin-bottom:4px; display:flex; align-items:center; gap:6px;}
  .qa-status-badge{padding:2px 10px; border-radius:12px; color:#fff; font-size:11px; font-weight:600; white-space:nowrap;}
  .qa-status-pending{background:#f59e0b;}
  .qa-status-answered-auto{background:#3b82f6;}
  .qa-status-answered-admin{background:var(--green-600, #2e8b57);}
  .qa-item .btn-answer-question{margin-top:8px;}

  .log-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; gap:8px; flex-wrap:wrap;}
  .log-head > div{display:flex; gap:8px;}
  .log-item{border-left:3px solid var(--green-500); padding:8px 14px; margin-bottom:10px; background:var(--gray-100); border-radius:0 8px 8px 0;}
  .log-item .log-date{font-weight:600; font-size:13px; color:var(--green-700);}
  .log-item .log-meta{font-size:12px; color:var(--gray-500); margin-top:2px;}
  .log-item .log-text{margin:6px 0 0; font-size:14px; white-space:pre-wrap;}

  /* Modal */
  .modal-backdrop{position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:50;}
  .modal{
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    background:#fff; border-radius:var(--radius); padding:22px 24px; width:min(92vw,440px);
    z-index:51; max-height:88vh; overflow:auto;
  }
  .modal label{display:block; font-size:13px; font-weight:600; margin:10px 0 4px;}
  .modal input, .modal select, .modal textarea{width:100%;}
  .modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:18px;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .error{color:var(--red); font-size:13px;}

  @media (max-width:720px){
    .gantt-header, .gantt-row{grid-template-columns:130px repeat(12,minmax(20px,1fr));}
    .gantt-label{font-size:11px; padding:6px;}
  }

  /* แถบแท็บหลัก */
  .main-tabs{display:flex; gap:4px; background:#fff; padding:0 24px; border-bottom:1px solid var(--gray-200); overflow-x:auto;}
  .tab-btn{
    background:none; border:none; padding:14px 18px; font-family:inherit; font-size:14px; font-weight:600;
    color:var(--gray-500); cursor:pointer; border-bottom:3px solid transparent; white-space:nowrap;
  }
  .tab-btn:hover{color:var(--green-700);}
  .tab-btn.active{color:var(--green-700); border-bottom-color:var(--green-600);}
  .tab-btn[data-tab="frytofly"].active{color:var(--oil-700); border-bottom-color:var(--oil-600);}
  .tab-btn[data-tab="paperless"].active{color:var(--paper-blue-700); border-bottom-color:var(--paper-blue-600);}
  .tab-btn[data-tab="cartridge"].active{color:var(--ink-700); border-bottom-color:var(--ink-600);}

  /* แคมเปญ: ทอดไม่ทิ้ง */
  .ftf-hero{
    background:linear-gradient(135deg,var(--oil-700),var(--oil-500)); color:#fff;
    border-radius:var(--radius); padding:20px 22px; margin:20px 24px 16px;
  }
  .ftf-hero-top{display:flex; gap:16px; align-items:flex-start;}
  .ftf-hero-icon{font-size:40px; flex-shrink:0;}
  .ftf-hero h2{margin:0 0 6px; font-size:20px;}
  .ftf-hero p{margin:0; font-size:13px; line-height:1.7; opacity:.95;}
  .ftf-info-row{display:flex; flex-wrap:wrap; gap:10px; margin-top:14px;}
  .ftf-info-chip{background:rgba(255,255,255,.18); border-radius:20px; padding:6px 14px; font-size:12px;}

  .ftf-actions{display:flex; gap:14px; flex-wrap:wrap; margin:0 24px 16px;}
  .ftf-share-card{margin:0 24px 16px;}
  .ftf-share-body{display:flex; gap:24px; align-items:flex-start; flex-wrap:wrap;}
  .ftf-share-link-box{display:flex; gap:8px; flex:1; min-width:240px;}
  .ftf-share-link-box input{flex:1; font-size:12px; background:var(--gray-100); color:var(--gray-800);}
  .ftf-qr-box{text-align:center; flex-shrink:0;}
  .ftf-qr-box img{border:1px solid var(--gray-200); border-radius:8px; background:#fff; padding:6px;}
  .ftf-qr-box .btn{display:block; font-size:12px;}

  .ftf-confirm-banner{
    background:#e8f5ec; border:1px solid var(--green-500); color:var(--green-700);
    border-radius:10px; padding:14px 18px; margin:0 24px 16px; font-size:13px; line-height:1.6;
    display:flex; justify-content:space-between; align-items:flex-start; gap:12px;
  }
  .ftf-confirm-banner button{background:none; border:none; font-size:16px; cursor:pointer; color:var(--green-700); flex-shrink:0;}

  .ftf-lb-head{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; margin-bottom:6px;}
  .ftf-lb-head input{min-width:220px;}

  .ftf-link-card{
    display:flex; align-items:center; gap:14px; background:#fff; border:1px solid var(--gray-200);
    border-left:5px solid var(--amber); border-radius:var(--radius); padding:14px 18px; margin-bottom:16px;
    cursor:pointer; transition:box-shadow .15s;
  }
  .ftf-link-card:hover{box-shadow:0 2px 8px rgba(0,0,0,.08);}
  .ftf-link-icon{font-size:28px; flex-shrink:0;}
  .ftf-link-body{flex:1; min-width:0;}
  .ftf-link-body h4{margin:0 0 2px; font-size:14px; color:var(--gray-800);}
  .ftf-link-body p{margin:0; font-size:12px;}
  .ftf-link-arrow{color:var(--green-700); font-weight:700; font-size:13px; white-space:nowrap; flex-shrink:0;}
  .btn-lg{padding:16px 22px; font-size:15px; font-weight:700; border-radius:12px; box-shadow:0 2px 6px rgba(0,0,0,.1);}

  .ftf-tier-card{margin:0 24px 16px;}
  .ftf-tier-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px; margin-top:10px;}
  .ftf-tier-item{display:flex; gap:10px; align-items:flex-start; border-radius:10px; padding:12px 14px; font-size:12px; line-height:1.6;}
  .ftf-tier-item span{font-size:22px;}
  .ftf-tier-gold{background:#fdf3d8; border:1px solid #e8c96a;}
  .ftf-tier-silver{background:#f1f2f3; border:1px solid #c9ccd1;}
  .ftf-tier-bronze{background:#f7e6d8; border:1px solid #d9a877;}

  .ftf-leaderboard-card{background:#fff; border-radius:var(--radius); padding:16px 18px; margin:0 24px 24px; box-shadow:0 1px 4px rgba(0,0,0,.06);}
  .ftf-lb-row{display:flex; align-items:center; gap:12px; padding:10px 8px; border-bottom:1px solid var(--gray-100);}
  .ftf-lb-row:last-child{border-bottom:none;}
  .ftf-lb-rank{width:26px; text-align:center; font-weight:800; color:var(--gray-500); flex-shrink:0;}
  .ftf-lb-row.rank-1 .ftf-lb-rank{color:#d4af37;}
  .ftf-lb-row.rank-2 .ftf-lb-rank{color:#9aa0a6;}
  .ftf-lb-row.rank-3 .ftf-lb-rank{color:#cd7f32;}
  .ftf-lb-name{flex:1; min-width:0;}
  .ftf-lb-name .n{font-weight:700; font-size:13px;}
  .ftf-lb-name .s{font-size:11px; color:var(--gray-500);}
  .ftf-lb-donated{font-size:12px; color:var(--gray-500); width:110px; text-align:right; flex-shrink:0;}

  /* ============================================================

    body > *:not(#printArea){ display:none !important; }
    #printArea{ display:block !important; position:static !important; width:auto !important; }
    *{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  }

  .rp-page{ break-after:page; page-break-after:always; }
  .rp-page:last-child{ break-after:auto; page-break-after:auto; }

  .print-header h2{margin:0; color:var(--green-700); font-size:20px;}
  .print-header .print-meta{font-size:11px; color:var(--gray-500); text-align:right;}
  .print-kpi-row{margin-bottom:12px;}
  .print-kpi-row .kpi-card{padding:8px; box-shadow:none; border:1px solid #ddd;}
  .print-kpi-row .kpi-num{font-size:20px;}
  .print-kpi-row .kpi-label{font-size:10px;}

  .print-table{width:100%; border-collapse:collapse; font-size:11px;}
  .print-table th, .print-table td{border:1px solid #ccc; padding:5px 8px; text-align:left; vertical-align:top;}
  .print-table th{background:var(--green-600); color:#fff; font-size:11px;}
  .print-table tr:nth-child(even) td{background:#f7faf8;}
  .print-table tr{break-inside:avoid; page-break-inside:avoid;}
  .rp-body .print-table td, .rp-body .print-table th{ font-size:10.5px; }
  .print-status-badge{padding:2px 10px; border-radius:12px; color:#fff; font-size:10px; font-weight:600; display:inline-block; white-space:nowrap;}
  .print-desc{font-size:12px; background:var(--gray-100); padding:10px 12px; border-radius:8px; margin-bottom:14px; white-space:pre-wrap;}

  /* Timeline หลายปี (พิมพ์) */
  .rp-yt-axis{ position:relative; height:18px; font-size:11px; color:var(--gray-500); margin-left:240px; }
  .rp-yt-axis span{ position:absolute; transform:translateX(-50%); }
  .rp-yt-rows{ position:relative; padding-bottom:22px; }
  .rp-yt-lines{ position:absolute; left:240px; right:0; top:0; bottom:0; pointer-events:none; }
  .yt-grid{ position:absolute; top:0; bottom:0; border-left:1px solid #e5e9e7; }

  /* Gantt รายเดือน (พิมพ์) */
  .rp-legend{ display:flex; gap:14px; flex-wrap:wrap; font-size:10px; margin-bottom:8px; }
  .print-gantt-wrap{border:1px solid #ccc; border-radius:6px; overflow:hidden;}
  .print-gantt-header{display:grid; grid-template-columns:230px repeat(12,1fr); background:var(--green-100); font-size:10px; font-weight:700;}
  .print-gantt-header > div{padding:5px 2px; text-align:center; border-left:1px solid #fff;}
  .print-gantt-row{display:grid; grid-template-columns:230px repeat(12,1fr); border-top:1px solid #ddd; break-inside:avoid; page-break-inside:avoid; padding-top:2px;}
  .print-gantt-label{padding:6px 8px; font-size:10px; line-height:1.5;}

  .print-proj-status{color:var(--gray-800); font-style:italic; margin:2px 0;}
  .print-stage-badge{background:var(--gray-200); border-radius:8px; padding:1px 6px; margin:0 4px;}
  .print-gantt-track{
    grid-column:2 / span 12; position:relative; margin:8px 4px; min-height:36px;
    background-image:linear-gradient(to right,#e5e9e7 1px,transparent 1px);
    background-size:calc(100% / 12) 100%;
  }
  .print-gantt-bar{
    position:absolute; top:0; height:18px; border-radius:4px; color:#fff; font-size:9px;
    display:flex; align-items:center; padding:0 4px; white-space:nowrap; overflow:hidden;
  }
  .print-target-mark{position:absolute; top:-2px; font-size:12px; transform:translateX(-50%);}
  .print-status-pin{position:absolute; top:20px; font-size:11px; transform:translateX(-50%);}

  .rp-body .attention-card{ margin-bottom:0; }

  /* หน้ารายโครงการ */
  .rp-proj-head{ display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:10px; }
  .rp-proj-head h3{ margin:0; font-size:18px; }
  .rp-proj-grid{ display:grid; grid-template-columns:1.4fr 130px 1fr; gap:12px; align-items:stretch; }

  .rp-tl-pin{ position:absolute; top:4px; width:12px; height:12px; margin-left:-6px; border-radius:50%; background:#fff; border:3px solid var(--gray-800); }
  .rp-tl-now{ position:absolute; top:-4px; bottom:-4px; border-left:2px dashed #000; }
  .rp-log-text{ white-space:pre-wrap; }

  /* ============================================================
     โครงการ Paperless (ลดการใช้กระดาษ)
     ============================================================ */
  .pl-hero{
    background:linear-gradient(135deg,var(--paper-blue-700),var(--paper-blue-500)); color:#fff;

    display:inline-flex; align-items:center; gap:6px; background:var(--paper-blue-100); color:var(--paper-blue-700);
    border-radius:20px; padding:6px 14px; font-size:12px; font-weight:600;
  }

  /* ============================================================

  .shr-rank-row{ display:flex; align-items:center; gap:10px; padding:7px 2px; border-bottom:1px solid var(--gray-100); }
  .shr-rank-row:last-child{ border-bottom:none; }
  .shr-rank-num{ width:24px; text-align:center; font-weight:800; color:var(--gray-500); font-size:13px; flex-shrink:0; }
  .shr-rank-row.rank-1 .shr-rank-num{ color:#d4af37; }
  .shr-rank-row.rank-2 .shr-rank-num{ color:#9aa0a6; }
  .shr-rank-row.rank-3 .shr-rank-num{ color:#cd7f32; }
  .shr-rank-name{ width:170px; flex-shrink:0; font-size:12.5px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .shr-rank-track{ flex:1; background:var(--gray-100); border-radius:8px; height:18px; overflow:hidden; min-width:50px; }
  .shr-rank-fill{ display:block; height:100%; background:linear-gradient(90deg,var(--share-600),var(--share-500)); border-radius:8px; }
  .shr-rank-val{ width:104px; text-align:right; flex-shrink:0; font-size:12px; color:var(--gray-500); }
  .shr-rank-val b{ color:var(--share-700); font-size:13px; }
  @media (max-width:720px){ .shr-rank-name{ width:110px; } .shr-rank-val{ width:84px; } }

  /* พิมพ์ PDF */
  .rp-shr-rank-bar-fill{ display:block; height:100%; background:var(--share-600); }
  .rp-shr-bars{ display:flex; gap:6px; align-items:flex-end; border-bottom:1px solid #ccc; padding-bottom:2px; }
  .rp-shr-two{ display:grid; grid-template-columns:1.2fr 1fr; gap:14px; margin-top:10px; align-items:start; }
  .rp-shr-note{ font-size:10.5px; color:#555; line-height:1.6; margin-top:8px; }

  /* รายงานสิ่งแวดล้อม: เพิ่มการ์ดที่ 4 */
  .env-breakdown-row{ grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); }
  .shr-table td{ white-space:normal; } .shr-table td:nth-child(9), .shr-table td:nth-child(8){ white-space:nowrap; }

  /* ============================================================
     การส่งจำหน่ายรายรอบ (ทอดไม่ทิ้ง / ตลับหมึก / จากครัวสู่ท้องฟ้า) + โครงการ "จากครัวสู่ท้องฟ้า" / "ปฏิทินเก่าเราขอ"
     ============================================================ */
  :root{
    /* จากครัวสู่ท้องฟ้า (ครัว/ส้มแดง) */
    --kit-700:#a8431a; --kit-600:#d9582a; --kit-500:#ee8456; --kit-100:#fde7dc;
    /* ปฏิทินเก่าเราขอ (อักษรเบรลล์/ชมพูกุหลาบ) */
    --cal-700:#a1275a; --cal-600:#d03f7e; --cal-500:#e8709f; --cal-100:#fbe3ed;
  }
  .tab-btn[data-tab="kitchen"].active{color:var(--kit-700); border-bottom-color:var(--kit-600);}
  .tab-btn[data-tab="calendar"].active{color:var(--cal-700); border-bottom-color:var(--cal-600);}

  /* ธีมสีของแต่ละโครงการ (ใช้กับส่วนการส่งรายรอบ) */
  .theme-ftf{ --pj-700:var(--oil-700); --pj-600:var(--oil-600); --pj-500:var(--oil-500); --pj-100:var(--oil-100); }
  .theme-ctg{ --pj-700:var(--ink-700); --pj-600:var(--ink-600); --pj-500:var(--ink-500); --pj-100:var(--ink-100); }
  .theme-kit{ --pj-700:var(--kit-700); --pj-600:var(--kit-600); --pj-500:var(--kit-500); --pj-100:var(--kit-100); }
  .theme-cal{ --pj-700:var(--cal-700); --pj-600:var(--cal-600); --pj-500:var(--cal-500); --pj-100:var(--cal-100); }
  .kpi-card.kpi-pj{border-top-color:var(--pj-600);}
  .kpi-card.kpi-pj .kpi-num{color:var(--pj-700);}
  .kpi-card.kpi-pj .kpi-sub{font-size:11px; color:var(--gray-500); margin-top:2px;}

  .kit-hero{ background:linear-gradient(135deg,var(--kit-700),var(--kit-500)); }
  .cal-hero{ background:linear-gradient(135deg,var(--cal-700),var(--cal-500)); }
  .kit-hero .btn-primary, .cal-hero .btn-primary{ background:#fff; color:var(--pj-700); font-weight:700; }
  .hero-chips{display:flex; flex-wrap:wrap; gap:10px; margin-top:14px; position:relative; z-index:1;}
  .hero-chip{background:rgba(255,255,255,.18); border-radius:20px; padding:6px 14px; font-size:12px;}

  /* แท็บย่อย */
  .pj-subtabs{ display:flex; gap:6px; flex-wrap:wrap; margin:6px 0 14px; }
  .pj-subtab{
    background:#fff; border:1px solid var(--gray-200); color:var(--gray-800); font-family:inherit; font-size:14px;
    font-weight:600; padding:9px 18px; border-radius:22px; cursor:pointer; display:inline-flex; align-items:center; gap:6px;
  }
  .pj-subtab:hover{ background:var(--pj-100); }
  .pj-subtab.active{ background:var(--pj-600); border-color:var(--pj-600); color:#fff; }

  /* ส่วนการส่งรายรอบ */
  .ship-section{ display:block; }
  .ship-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
  .ship-head h3{ margin:0; font-size:16px; color:var(--gray-800); }
  .ship-actions{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .ship-actions .btn-add{ background:var(--pj-600); color:#fff; }
  .ship-actions .btn-add:hover{ background:var(--pj-700); }
  .ship-kpi-row{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:16px; }
  .ship-card{ background:#fff; border-radius:var(--radius); padding:16px 18px; margin-bottom:16px; box-shadow:0 1px 4px rgba(0,0,0,.06); }
  .ship-card h3{ margin:0 0 2px; font-size:15px; color:var(--gray-800); }
  .ship-table-wrap{ overflow-x:auto; }
  .ship-table{ width:100%; border-collapse:collapse; font-size:13px; min-width:640px; }
  .ship-table th, .ship-table td{ border-bottom:1px solid var(--gray-200); padding:8px 10px; text-align:right; vertical-align:top; }
  .ship-table th{ color:var(--gray-500); font-size:12px; font-weight:600; white-space:nowrap; }
  .ship-table th.l, .ship-table td.l{ text-align:left; }
  .ship-table td.note{ color:var(--gray-500); font-size:12px; text-align:left; }
  .ship-table tfoot td{ font-weight:700; background:var(--gray-100); border-top:2px solid var(--gray-200); }
  .ship-table .sub{ display:block; color:var(--gray-500); font-size:11px; }
  .ship-table .up{ color:#b5461f; font-size:11px; } .ship-table .down{ color:var(--green-700); font-size:11px; }
  .ship-row-actions{ white-space:nowrap; text-align:right; }
  .ship-row-actions button{ background:none; border:none; color:var(--pj-600); cursor:pointer; font-size:12px; text-decoration:underline; margin-left:6px; font-family:inherit; }
  .ship-yearnav{ display:flex; align-items:center; gap:8px; }

  /* กราฟแท่งราคาต่อหน่วยแต่ละรอบ */
  .ship-bars{ display:flex; gap:8px; align-items:flex-end; overflow-x:auto; padding:6px 2px 4px; border-bottom:1px solid var(--gray-200); }
  .ship-bar-col{ flex:1 0 54px; max-width:110px; display:flex; flex-direction:column; align-items:center; gap:4px; }
  .ship-bar-val{ font-size:11px; font-weight:700; color:var(--pj-700); white-space:nowrap; }
  .ship-bar-area{ width:100%; height:130px; display:flex; align-items:flex-end; background-image:linear-gradient(to top, var(--gray-200) 1px, transparent 1px); background-size:100% 32px; }
  .ship-bar{ width:100%; background:linear-gradient(180deg,var(--pj-500),var(--pj-700)); border-radius:6px 6px 2px 2px; min-height:4px; }
  .ship-bar-lbl{ font-size:10.5px; color:var(--gray-500); text-align:center; line-height:1.3; }
  .ship-avg-note{ font-size:12px; color:var(--gray-500); margin:6px 0 0; }

  /* ฟอร์มบันทึกการส่ง */
  .ship-hint{ font-size:12px; margin:4px 0 0; min-height:16px; }
  .ship-hint.ok{ color:var(--green-700); } .ship-hint.new{ color:#b5791f; }
  .ship-chips{ display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .ship-chip{ background:var(--gray-100); border:1px solid var(--gray-200); border-radius:16px; padding:3px 10px; font-size:12px; cursor:pointer; font-family:inherit; }
  .ship-chip:hover{ background:#e8f5ec; border-color:var(--green-500); }
  .ship-calc{ background:var(--gray-100); border-radius:8px; padding:8px 10px; font-size:12px; color:var(--gray-800); margin-top:8px; }

  /* ปฏิทินเก่าเราขอ */
  .cal-bars .ship-bar{ background:linear-gradient(180deg,var(--cal-500),var(--cal-700)); }
  .cal-type-wrap{ display:flex; gap:18px; align-items:center; flex-wrap:wrap; }
  .cal-type-legend{ display:flex; flex-direction:column; gap:8px; flex:1; min-width:200px; font-size:13px; }
  .cal-type-legend .dot{ width:12px; height:12px; border-radius:3px; margin-right:6px; }
  .cal-round-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:12px; }
  .cal-round-card{ border:1px solid var(--gray-200); border-left:5px solid var(--cal-600); border-radius:10px; padding:12px 14px; }
  .cal-round-card h4{ margin:0 0 2px; font-size:14px; }
  .cal-round-card .kg{ font-size:22px; font-weight:800; color:var(--cal-700); }
  .cal-round-card .meta{ font-size:12px; color:var(--gray-500); }
  .cal-round-card .types{ font-size:12px; margin-top:6px; line-height:1.7; }
  .cal-rank-row{ display:flex; align-items:center; gap:12px; padding:8px 4px; border-bottom:1px solid var(--gray-100); }
  .cal-rank-row:last-child{ border-bottom:none; }
  .cal-rank-num{ width:28px; text-align:center; font-weight:800; color:var(--gray-500); font-size:13px; flex-shrink:0; }
  .cal-rank-row.rank-1 .cal-rank-num{ color:#d4af37; } .cal-rank-row.rank-2 .cal-rank-num{ color:#9aa0a6; } .cal-rank-row.rank-3 .cal-rank-num{ color:#cd7f32; }
  .cal-rank-name{ width:240px; flex-shrink:0; font-weight:700; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cal-rank-name small{ display:block; font-weight:400; font-size:11px; color:var(--gray-500); }
  .cal-rank-track{ flex:1; background:var(--gray-100); border-radius:8px; height:18px; overflow:hidden; min-width:50px; }
  .cal-rank-fill{ display:block; height:100%; background:linear-gradient(90deg,var(--cal-600),var(--cal-500)); border-radius:8px; }
  .cal-rank-val{ width:110px; text-align:right; flex-shrink:0; font-size:12px; color:var(--gray-500); }
  .cal-rank-val b{ color:var(--cal-700); font-size:13px; }
  .cal-type-badge{ display:inline-block; padding:2px 10px; border-radius:12px; font-size:11px; font-weight:600; color:#fff; white-space:nowrap; }
  @media (max-width:720px){ .cal-rank-name{ width:120px; } .cal-rank-val{ width:80px; } }

  /* ============================================================
     เมนูโครงการแนวตั้งด้านซ้าย — แต่ละโครงการมีสี/ไอคอนของตัวเอง
     ============================================================ */
  .app-shell{display:grid; grid-template-columns:276px minmax(0,1fr); align-items:start;}
  .app-main{min-width:0;}

  .app-shell .main-tabs{
    position:sticky; top:0; align-self:start; max-height:100vh; overflow-y:auto; overflow-x:hidden;
    display:flex; flex-direction:column; gap:7px; padding:14px 12px 24px;
    background:#fff; border-right:1px solid var(--gray-200); border-bottom:none;
  }
  .tab-group-label{
    font-size:11px; font-weight:800; letter-spacing:.06em; color:var(--gray-500);
    padding:10px 6px 2px; text-transform:uppercase;
  }
  .tab-group-label:first-child{padding-top:2px;}

  /* สีประจำแต่ละโครงการ: --tc7 เข้ม / --tc6 กลาง / --tc5 อ่อน / --tc1 พื้นจาง */
  .app-shell .tab-btn{ --tc7:var(--green-700); --tc6:var(--green-600); --tc5:var(--green-500); --tc1:var(--green-100); }
  .app-shell .tab-btn[data-tab="frytofly"]{ --tc7:var(--oil-700); --tc6:var(--oil-600); --tc5:var(--oil-500); --tc1:var(--oil-100); }
  .app-shell .tab-btn[data-tab="paperless"]{ --tc7:var(--paper-blue-700); --tc6:var(--paper-blue-600); --tc5:var(--paper-blue-500); --tc1:var(--paper-blue-100); }
  .app-shell .tab-btn[data-tab="cartridge"]{ --tc7:var(--ink-700); --tc6:var(--ink-600); --tc5:var(--ink-500); --tc1:var(--ink-100); }
  .app-shell .tab-btn[data-tab="kitchen"]{ --tc7:var(--kit-700); --tc6:var(--kit-600); --tc5:var(--kit-500); --tc1:var(--kit-100); }
  .app-shell .tab-btn[data-tab="calendar"]{ --tc7:var(--cal-700); --tc6:var(--cal-600); --tc5:var(--cal-500); --tc1:var(--cal-100); }
  .app-shell .tab-btn[data-tab="share"]{ --tc7:var(--share-700); --tc6:var(--share-600); --tc5:var(--share-500); --tc1:var(--share-100); }
  .app-shell .tab-btn[data-tab="envreport"]{ --tc7:#14532d; --tc6:#1f7a45; --tc5:#3fa96a; --tc1:#dcf3e3; }

  .app-shell .tab-btn{
    display:flex; align-items:center; gap:12px; width:100%; text-align:left; white-space:normal;
    padding:9px 12px 9px 10px; border:1px solid var(--tc1); border-left:6px solid var(--tc6); border-bottom:1px solid var(--tc1);
    border-radius:12px; background:var(--tc1); color:var(--gray-800);
    transition:transform .12s, box-shadow .12s, background .12s;
  }
  .app-shell .tab-btn:hover{ transform:translateX(3px); box-shadow:0 3px 10px rgba(0,0,0,.12); color:var(--gray-800); }
  .tab-ico{
    flex:0 0 auto; width:40px; height:40px; border-radius:11px; background:#fff;
    display:flex; align-items:center; justify-content:center; font-size:21px; box-shadow:0 1px 3px rgba(0,0,0,.14);
  }
  .tab-txt{min-width:0; line-height:1.25;}
  .tab-txt b{display:block; font-size:14px; font-weight:800; color:var(--tc7);}
  .tab-txt small{display:block; font-size:11.5px; color:var(--gray-500); margin-top:2px;}
  .app-shell .tab-btn.active{
    background:linear-gradient(135deg,var(--tc7),var(--tc5)); border-color:var(--tc7); border-left-color:var(--tc7);
    box-shadow:0 5px 14px rgba(0,0,0,.22); color:#fff; transform:none;
  }
  .app-shell .tab-btn.active .tab-txt b{color:#fff;}
  .app-shell .tab-btn.active .tab-txt small{color:rgba(255,255,255,.9);}
  .app-shell .tab-btn.active::after{content:'›'; margin-left:auto; font-size:26px; line-height:1; color:#fff; opacity:.9;}

  @media (max-width:900px){
    .app-shell{display:block;}
    .app-shell .main-tabs{
      position:sticky; top:0; z-index:30; max-height:none; flex-direction:row; gap:8px; padding:8px 10px;
      overflow-x:auto; overflow-y:hidden; border-right:none; border-bottom:1px solid var(--gray-200);
      box-shadow:0 2px 6px rgba(0,0,0,.08);
    }
    .tab-group-label{display:none;}
    .app-shell .tab-btn{width:auto; flex:0 0 auto; padding:6px 12px 6px 8px; gap:8px; border-left-width:1px; border-bottom:4px solid var(--tc6);}
    .app-shell .tab-btn.active{border-bottom-color:var(--tc7);}
    .app-shell .tab-btn.active::after{display:none;}
    .tab-ico{width:30px; height:30px; font-size:17px; border-radius:8px;}
    .tab-txt small{display:none;}
    .tab-txt b{font-size:13px; white-space:nowrap;}
  }

  /* ============================================================
     รายงานสิ่งแวดล้อม: คำอธิบายในการ์ด
     ============================================================ */
  .env-section-title{margin:24px 0 10px; font-size:16px; color:var(--green-700); display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;}
  .env-section-title small{font-size:12px; font-weight:400; color:var(--gray-500);}

  .env-guide{background:#fff; border-radius:var(--radius); padding:16px 18px; box-shadow:0 1px 4px rgba(0,0,0,.06); border-left:6px solid var(--green-600); margin-bottom:6px;}
  .env-guide:empty{display:none;}
  .env-guide h4{margin:0 0 10px; font-size:15px; color:var(--green-700);}
  .env-guide-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:12px;}
  .env-guide-item{background:var(--gray-100); border-radius:10px; padding:10px 12px; font-size:12.5px; line-height:1.7;}
  .env-guide-item .t{display:block; font-size:13.5px; color:var(--green-700); margin-bottom:3px;}
  .env-guide-warn{margin-top:12px; background:#fff6db; color:#7a5a12; border-radius:8px; padding:9px 12px; font-size:12.5px; line-height:1.7;}

  .env-kpi-row{display:grid; grid-template-columns:repeat(auto-fill,minmax(235px,1fr)); gap:12px; margin-bottom:16px;}
  .env-kpi{background:#fff; border-radius:var(--radius); padding:14px 16px; box-shadow:0 1px 4px rgba(0,0,0,.06); border-top:5px solid var(--kc,var(--green-600)); display:flex; flex-direction:column;}
  .env-kpi .k-top{display:flex; align-items:center; gap:8px;}
  .env-kpi .k-ico{font-size:22px; flex:0 0 auto;}
  .env-kpi .k-label{font-size:13px; font-weight:700; color:var(--gray-800); line-height:1.35;}
  .env-kpi .k-num{font-size:32px; font-weight:800; color:var(--kc7,var(--green-700)); line-height:1.15; margin:8px 0 2px;}
  .env-kpi .k-num small{font-size:14px; font-weight:700; color:var(--gray-500); margin-left:5px;}
  .env-kpi .k-note{font-size:12px; line-height:1.65; color:var(--gray-500); margin-top:6px; border-top:1px dashed var(--gray-200); padding-top:7px;}
  .env-kpi .k-note b{color:var(--gray-800);}

  .env-split-card{margin-bottom:6px;}
  .env-split-bar{display:flex; height:24px; border-radius:12px; overflow:hidden; background:var(--gray-200);}
  .env-split-bar span{display:block; height:100%;}
  .env-split-list{display:grid; grid-template-columns:repeat(auto-fit,minmax(270px,1fr)); gap:6px 22px; margin-top:12px;}
  .env-split-item{display:flex; align-items:center; gap:8px; font-size:13px;}
  .env-split-dot{width:13px; height:13px; border-radius:4px; flex:0 0 auto;}
  .env-split-item .nm{flex:1; min-width:0;}
  .env-split-item .vl{font-weight:700;}
  .env-split-item .pc{color:var(--gray-500); width:52px; text-align:right;}
  .env-split-note{margin:12px 0 0;}

  .env-breakdown-row{align-items:start; grid-template-columns:repeat(auto-fill,minmax(min(370px,100%),1fr));}
  .env-card{border-top:5px solid var(--ec,var(--green-600));}
  .env-c-pl{--ec:var(--paper-blue-600); --ec-bg:var(--paper-blue-100);}
  .env-c-ftf{--ec:var(--oil-600); --ec-bg:var(--oil-100);}
  .env-c-ctg{--ec:var(--ink-600); --ec-bg:var(--ink-100);}
  .env-c-kit{--ec:var(--kit-600); --ec-bg:var(--kit-100);}
  .env-c-cal{--ec:var(--cal-600); --ec-bg:var(--cal-100);}
  .env-c-shr{--ec:var(--share-600); --ec-bg:var(--share-100);}
  .env-about{font-size:12.5px; line-height:1.7; background:var(--gray-100); border-radius:8px; padding:8px 11px; margin:0 0 6px; color:var(--gray-800);}
  .env-stat-row{align-items:flex-start; gap:12px;}
  .env-card, .env-card .env-calc, .env-card .env-say, .env-card .env-about{text-align:left;}
  .env-stat-label{flex:1; min-width:0; font-weight:600; color:var(--gray-800); text-align:left;}
  .env-stat-label small{display:block; font-size:11.5px; font-weight:400; color:var(--gray-500); line-height:1.55; margin-top:2px;}
  .env-stat-val{flex:0 0 auto; max-width:46%; line-height:1.4;}
  .env-calc{margin-top:10px; background:#f3f8f5; border-radius:8px; padding:8px 11px; font-size:11.5px; line-height:1.7; color:var(--gray-500);}
  .env-calc b{color:var(--gray-800);}
  .env-say{margin-top:8px; background:var(--ec-bg,var(--green-100)); border-left:4px solid var(--ec,var(--green-600)); border-radius:8px; padding:9px 12px; font-size:12.5px; line-height:1.75; color:var(--gray-800);}
  .env-assumptions-note{line-height:1.9;}
  .rp-calc{font-size:10px; color:#555; text-align:left;}

  /* ============================================================
     การ์ดสรุป รายเดือน • รายปี • สะสม (ใช้ร่วมกันทุกโครงการ)
     ============================================================ */
  .sum-inpage{margin:0 24px 16px;}

  .sum-bar{position:absolute; left:0; top:12%; bottom:12%; background:var(--sc1,var(--green-100)); border-radius:0 6px 6px 0; z-index:0; opacity:.9;}

  .sum-table td em{font-weight:400; font-size:11px; color:var(--gray-500);}

  .sum-tiles-print .sum-tile-num{font-size:17px;}

  .rp-body .print-table td.sum-lbl{text-align:left; font-weight:600;}

  /* ============ ผู้ช่วยตอบคำถาม (แชท) ============ */
  .asst-fab{

    border:0; border-radius:999px; padding:12px 18px 12px 14px; cursor:pointer; color:#fff; font:600 14px 'Sarabun',sans-serif;
    background:linear-gradient(135deg,var(--green-700),var(--green-500)); box-shadow:0 6px 20px rgba(31,111,60,.4);

  .asst-panel{
    position:fixed; right:18px; bottom:18px; z-index:45; width:min(390px,calc(100vw - 24px)); height:min(600px,calc(100vh - 36px));
    background:#fff; border-radius:16px; box-shadow:0 18px 50px rgba(0,0,0,.28); display:flex; flex-direction:column; overflow:hidden;
    border:1px solid var(--gray-200);
  }
  .asst-panel.hidden{display:none;}
  .asst-head{display:flex; justify-content:space-between; align-items:center; padding:12px 14px; color:#fff; background:linear-gradient(135deg,var(--green-700),var(--green-500));}
  .asst-head-ttl{display:flex; gap:10px; align-items:center;}
  .asst-head-ttl b{display:block; font-size:14.5px;} .asst-head-ttl small{display:block; font-size:11.5px; opacity:.9;}
  .asst-avatar{width:36px; height:36px; border-radius:50%; background:rgba(255,255,255,.22); display:flex; align-items:center; justify-content:center; font-size:20px;}
  .asst-x{background:rgba(255,255,255,.2); border:0; color:#fff; width:30px; height:30px; border-radius:50%; cursor:pointer; font-size:14px;}
  .asst-body{flex:1; overflow-y:auto; padding:14px; background:#f6f9f7; display:flex; flex-direction:column; gap:10px;}
  .asst-msg{max-width:88%; padding:9px 12px; border-radius:14px; font-size:13.5px; line-height:1.6; word-break:break-word; white-space:pre-line;}
  .asst-msg.bot{align-self:flex-start; background:#fff; border:1px solid var(--gray-200); border-bottom-left-radius:4px;}
  .asst-msg.me{align-self:flex-end; background:var(--green-600); color:#fff; border-bottom-right-radius:4px;}
  .asst-msg.warn{background:#fff7e6; border-color:#f0d9a8;}
  .asst-acts{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; white-space:normal;}
  .asst-act{border:1px solid var(--green-600); color:var(--green-700); background:#fff; border-radius:999px; padding:4px 11px; font:600 12px 'Sarabun',sans-serif; cursor:pointer;}
  .asst-act:hover{background:var(--green-100);}
  .asst-act.mail{background:var(--green-600); color:#fff;}
  .asst-chips{display:flex; gap:6px; padding:8px 12px 0; overflow-x:auto; background:#fff; border-top:1px solid var(--gray-200); flex-shrink:0;}
  .asst-chips:empty{display:none;}
  .asst-chip{flex:0 0 auto; border:1px solid var(--gray-200); background:var(--gray-100); border-radius:999px; padding:5px 11px; font:12.5px 'Sarabun',sans-serif; cursor:pointer; color:var(--gray-800);}
  .asst-chip:hover{border-color:var(--green-500); background:var(--green-100);}
  .asst-form{display:flex; gap:8px; padding:10px 12px; background:#fff;}
  .asst-form input{flex:1; min-width:0;}
  .asst-foot{display:flex; justify-content:space-between; gap:8px; padding:0 12px 10px; background:#fff;}
  .asst-link{background:none; border:0; color:var(--green-700); font:600 12.5px 'Sarabun',sans-serif; cursor:pointer; padding:2px 0; text-decoration:underline;}
  .asst-typing{display:inline-flex; gap:4px;} .asst-typing i{width:6px; height:6px; border-radius:50%; background:#9aa39d; animation:asstB 1s infinite;}
  .asst-typing i:nth-child(2){animation-delay:.15s;} .asst-typing i:nth-child(3){animation-delay:.3s;}
  @keyframes asstB{0%,80%,100%{opacity:.25; transform:translateY(0);}40%{opacity:1; transform:translateY(-3px);}}
  .success-note{background:var(--green-100); color:var(--green-700); border-radius:8px; padding:9px 12px; font-size:13.5px; margin:10px 0 0;}
  .success-note.hidden{display:none;}

  .inbox-list{display:flex; flex-direction:column; gap:10px; max-height:60vh; overflow:auto;}

  .inbox-meta{font-size:12px; color:var(--gray-500); margin-bottom:4px;}

  /* ============ ภาพกิจกรรมโครงการ ============ */

  .ph-card{--ph:var(--green-600); background:#fff; border-radius:14px; border:1px solid var(--gray-200); border-top:5px solid var(--ph); padding:16px 18px 18px; box-shadow:0 2px 10px rgba(0,0,0,.04);}

  .ph-head h3{margin:0; font-size:17px; color:var(--ph);} .ph-head h3 small{font-weight:400; color:var(--gray-500); font-size:12.5px; margin-left:6px;}

  .ph-grid.n1{grid-template-columns:1fr; grid-auto-rows:340px;} .ph-grid.n1 .ph-tile:first-child{grid-column:auto; grid-row:auto;}
  .ph-grid.n2{grid-template-columns:1fr 1fr; grid-auto-rows:260px;} .ph-grid.n2 .ph-tile:first-child{grid-column:auto; grid-row:auto;}

  .env-pill span{background:#fff; border-radius:50%; width:26px; height:26px; display:inline-flex; align-items:center; justify-content:center; font-size:14px;}

  .env-donut-wrap{display:flex; flex-direction:column; align-items:stretch; gap:12px;}
  .env-donut{width:210px; height:210px; flex:0 0 auto; margin:0 auto;}
  .env-donut-card .env-split-list{display:flex; flex-direction:column; gap:6px; margin:0;}
  .env-donut-card .env-split-item{font-size:13px; background:#f7faf8; border-radius:10px; padding:6px 10px;}
  .env-donut-card .env-split-note{margin:12px 0 0; font-size:12px; color:var(--gray-500); line-height:1.6;}
  .env-sum-table{width:100%; border-collapse:separate; border-spacing:0; font-size:13px; overflow:hidden; border-radius:12px; border:1px solid #dce9e0;}
  .env-sum-table th{background:#1d6fb8; color:#fff; padding:8px 10px; font-size:12.5px; text-align:right;}
  .env-sum-table th:first-child,.env-sum-table th:nth-child(2){text-align:left;}
  .env-sum-table td{padding:7px 10px; border-top:1px solid #e8efe9; vertical-align:middle;}
  .env-sum-table tbody tr:nth-child(even){background:#f5faf7;}
  .env-sum-table td.num{text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums;}
  .env-sum-table td small{display:block; color:var(--gray-500); font-size:11px;}
  .env-sum-dot{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:7px;}
  .env-sum-bar{display:inline-block; width:46px; height:7px; border-radius:4px; background:#e5ebe7; margin-right:7px; vertical-align:middle; overflow:hidden;}
  .env-sum-bar i{display:block; height:100%; border-radius:4px;}
  .env-sum-table tfoot td{background:linear-gradient(90deg,#1f8a5b,#35b57a); color:#fff; font-weight:800; padding:8px 10px; border-top:0;}
  .env-sum-note{margin:8px 2px 0; font-size:11.5px; color:var(--gray-500);}
  .env-closing{display:flex; align-items:center; gap:16px; margin:22px 0 4px; padding:16px 24px; border-radius:18px; color:#fff; background:linear-gradient(110deg,#168a56 0%,#35b57a 60%,#7bc96f 100%); box-shadow:0 6px 18px rgba(31,138,91,.28); text-align:left;}
  .env-closing-globe{font-size:46px; line-height:1;}
  .env-closing b{display:block; font-size:21px;} .env-closing span{display:block; font-size:13px; opacity:.95; margin-top:2px;}
  @media (max-width:980px){
    .env-hl-row{grid-template-columns:1fr 1fr;} .env-main-grid{grid-template-columns:1fr;}
    .env-poster-main{max-width:100%;} .env-poster-scene{opacity:.35; width:100%;} .env-poster-title{font-size:30px;}
  }
  @media (max-width:560px){ .env-hl-row{grid-template-columns:1fr;} .env-poster{padding:22px 18px;} .env-poster-title{font-size:25px;} .env-poster-period{font-size:15px; padding:5px 16px;} }

  /* ---- ฉบับพิมพ์ (A4 แนวนอน) ---- */
  .rp-env .rp-head{background:linear-gradient(90deg,#1f8a5b,#35b57a); border:0; border-radius:12px; padding:8px 16px; margin-bottom:10px; align-items:center;}
  .rp-env .rp-title{color:#fff; font-size:17px;} .rp-env .rp-sub{color:#e8fff1;}
  .rp-env-poster .env-poster{padding:16px 22px 14px; min-height:0; margin-bottom:8px; border-radius:16px; box-shadow:none;}
  .rp-env-poster .env-poster-scene{width:40%;} .rp-env-poster .env-poster-main{max-width:58%;}
  .rp-env-poster .env-poster-title{font-size:30px; margin:6px 0 6px;} .rp-env-poster .env-poster-period{font-size:14px; padding:4px 16px;}
  .rp-env-poster .env-poster-badge{font-size:11px; padding:2px 10px;} .rp-env-poster .env-poster-lead{font-size:10.5px; margin-top:6px; max-width:520px;}
  .rp-env-poster .env-hl-row{gap:8px; margin-bottom:8px;}
  .rp-env-poster .env-hl{padding:8px 10px; box-shadow:none; border-radius:12px; gap:8px;}
  .rp-env-poster .env-hl-ring{width:40px; height:40px; font-size:19px; box-shadow:0 0 0 3px color-mix(in srgb,var(--hc) 18%,#fff);}
  .rp-env-poster .env-hl-lbl{font-size:10px;} .rp-env-poster .env-hl-num{font-size:21px;} .rp-env-poster .env-hl-num small{font-size:10px;} .rp-env-poster .env-hl-sub{font-size:9px;}
  .rp-env-poster .env-main-grid{gap:8px; margin-bottom:0;}
  .rp-env-poster .env-panel{padding:9px 12px; box-shadow:none; border-radius:14px;}
  .rp-env-poster .env-pill{font-size:12px; padding:3px 12px 3px 5px; margin-bottom:6px;} .rp-env-poster .env-pill span{width:20px; height:20px; font-size:11px;}
  .rp-env-poster .env-donut-wrap{flex-direction:row; align-items:center; gap:10px;}
  .rp-env-poster .env-donut{width:150px; height:150px;}
  .rp-env-poster .env-donut-card .env-split-list{gap:3px; flex:1;} .rp-env-poster .env-donut-card .env-split-item{font-size:10px; padding:3px 7px;}
  .rp-env-poster .env-donut-card .env-split-note{font-size:9px; margin-top:6px; line-height:1.45;}
  .rp-env-poster .env-sum-table{font-size:10px;} .rp-env-poster .env-sum-table th{font-size:9.5px; padding:4px 7px;} .rp-env-poster .env-sum-table td{padding:3.5px 7px;} .rp-env-poster .env-sum-table td small{font-size:8.5px;}
  .rp-env-poster .env-sum-bar{width:32px; height:5px;} .rp-env-poster .env-sum-table tfoot td{padding:4px 7px;} .rp-env-poster .env-sum-note{font-size:8.5px; margin-top:4px;}
  .rp-env-poster .env-closing{margin:8px 0 0; padding:8px 16px; border-radius:14px; box-shadow:none;} .rp-env-poster .env-closing-globe{font-size:30px;}
  .rp-env-poster .env-closing b{font-size:15px;} .rp-env-poster .env-closing span{font-size:10px;}
  .rp-env-kpis .env-kpi-row{grid-template-columns:repeat(3,1fr); gap:12px;}
  .rp-env-kpis .env-kpi{padding:12px 16px 16px; border-radius:12px;}
  .rp-env-kpis .env-kpi .k-label{font-size:13.5px;} .rp-env-kpis .env-kpi .k-num{font-size:34px; margin-top:6px;}
  .rp-env-kpis .env-kpi .k-note{font-size:11.5px; line-height:1.6; margin-top:8px; padding-top:8px;}

  /* ============ สวิตช์ใช้ข้อมูลหน่วยงาน / ฟอร์มปฏิทิน ============ */
  .dept-mode-bar{display:flex; align-items:center; gap:12px; margin:0 0 14px; padding:10px 16px; border-radius:12px; background:#fff; border:1px dashed #c9d9cf;}
  .dept-mode-bar.hidden{display:none;}
  #tabFryToFly .dept-mode-bar{margin:0 24px 14px;}
  .dept-mode-bar.is-off{background:#fff8ea; border-color:#ecd49a;}
  .dm-text b{display:block; font-size:14px;} .dm-text small{display:block; color:var(--gray-500); font-size:12.5px; line-height:1.5;}
  .dm-switch{position:relative; display:inline-block; width:46px; height:26px; flex:0 0 auto; margin:0;}
  .dm-switch input{opacity:0; width:0; height:0; position:absolute;}
  .dm-track{position:absolute; inset:0; background:#c8d0cb; border-radius:999px; transition:background .2s; cursor:pointer;}
  .dm-track::before{content:''; position:absolute; width:20px; height:20px; left:3px; top:3px; background:#fff; border-radius:50%; transition:transform .2s; box-shadow:0 1px 3px rgba(0,0,0,.3);}
  .dm-switch input:checked + .dm-track{background:var(--green-600);} .dm-switch input:checked + .dm-track::before{transform:translateX(20px);}
  .dm-switch input:focus-visible + .dm-track{outline:2px solid var(--green-700); outline-offset:2px;}
  body.nodept-paperless #btnPlOpenLogin, body.nodept-paperless #plLoggedInChip, body.nodept-paperless #btnPlLogout{display:none !important;}
  body.nodept-cartridge .dept-f-cartridge, body.nodept-cartridge .dept-rank-cartridge{display:none !important;}
  body.nodept-share .dept-f-share, body.nodept-share .dept-rank-share{display:none !important;}
  .cal-sub-list{display:flex; flex-direction:column; gap:10px; margin-top:8px;}
  .cal-sub-item{border:1px solid var(--gray-200); border-left:5px solid var(--amber); border-radius:10px; padding:10px 14px; font-size:13.5px;}
  .cal-sub-item.done{border-left-color:var(--green-500); background:#fafdfb;}
  .cal-sub-badge{display:inline-block; padding:1px 10px; border-radius:999px; font-size:12px; font-weight:700; margin-right:6px;}
  .cal-sub-badge.pend{background:#fff1d6; color:#9a6200;} .cal-sub-badge.ok{background:#dcf3e4; color:#1f6f3c;} .cal-sub-badge.no{background:#f3e0e0; color:#a33;}
  .cal-sub-act{display:flex; gap:8px; align-items:center; margin-top:8px; flex-wrap:wrap;} .cal-sub-act input{width:210px;}

  /* ============================================================
     ธีมเรียบหรู (Premium): มรกตเข้ม + ทองแชมเปญ + พื้นหลังไอวอรี่
     อยู่ท้ายไฟล์เพื่อปรับหน้าตาทั้งเว็บ ไม่กระทบการทำงาน
     ============================================================ */
  :root{
    --green-700:#0f4f3a; --green-600:#1b7355; --green-500:#37966f; --green-100:#e6f1ec;
    --gray-100:#f5f3ee; --gray-200:#e7e3d8; --gray-500:#6c746f; --gray-800:#212c27;
    --gold:#b8964f; --gold-soft:#e9dcc0; --ink:#16231d;
    --radius:16px;
    --shadow-card:0 1px 2px rgba(22,35,29,.05), 0 10px 28px -14px rgba(22,35,29,.18);
    --shadow-lift:0 2px 4px rgba(22,35,29,.06), 0 16px 34px -14px rgba(22,35,29,.28);
  }
  body{background:var(--gray-100); color:var(--gray-800); -webkit-font-smoothing:antialiased; letter-spacing:.005em;}
  h1,h2,h3,h4{letter-spacing:0;}
  .modal h3,.ship-card h3,.ctg-rank-head h3,.breakdown-header h4,.env-panel h3{color:var(--ink);}

  /* หัวเว็บ */
  .topbar{
    background:linear-gradient(115deg,#0a3a2b 0%,#10513b 55%,#1b6d4f 100%);
    padding:18px 32px; border-bottom:2px solid var(--gold); box-shadow:0 6px 20px -10px rgba(10,58,43,.6);
  }
  .brand h1{font-size:19px; font-weight:700; letter-spacing:.02em;}
  .brand p{opacity:.78; letter-spacing:.03em;}
  .brand-icon{filter:drop-shadow(0 2px 4px rgba(0,0,0,.25));}
  .topbar .btn-outline{background:transparent; color:#fff; border:1px solid rgba(233,220,192,.7); border-radius:999px; padding:7px 18px;}
  .topbar .btn-outline:hover{background:rgba(255,255,255,.12);}

  /* ปุ่ม / ช่องกรอก */
  .btn{border-radius:10px; font-weight:600; letter-spacing:.01em; transition:background .15s, box-shadow .15s, transform .15s, border-color .15s;}
  .btn-primary{background:linear-gradient(180deg,#1f7a58,#14573f); box-shadow:0 2px 6px -1px rgba(15,79,58,.45);}
  .btn-primary:hover{background:linear-gradient(180deg,#238763,#0f4f3a); transform:translateY(-1px);}
  .btn-outline{border:1px solid #d9d3c3; background:#fff; color:var(--ink);}
  .btn-outline:hover{background:#fbf9f3; border-color:var(--gold);}
  .btn-danger{border-radius:10px;}
  select,input,textarea{border:1px solid #ddd8c9; border-radius:10px; background:#fff; transition:border-color .15s, box-shadow .15s;}
  select:focus,input:focus,textarea:focus{outline:none; border-color:var(--green-600); box-shadow:0 0 0 3px rgba(27,115,85,.15);}

  /* แถบเมนูซ้าย */
  .app-shell{grid-template-columns:288px minmax(0,1fr);}
  .app-shell .main-tabs{background:#fbfaf6; border-right:1px solid var(--gray-200); padding:18px 14px 28px; gap:8px;}
  .tab-group-label{color:var(--gold); letter-spacing:.14em; font-size:10.5px; padding:14px 8px 4px;}
  .app-shell .tab-btn{
    background:#fff; border:1px solid #ebe7db; border-left:4px solid var(--tc6); border-radius:14px; padding:9px 12px 9px 10px;
    box-shadow:0 1px 2px rgba(22,35,29,.04);
  }
  .app-shell .tab-btn:hover{transform:translateX(2px); box-shadow:var(--shadow-card);}
  .tab-ico{background:var(--tc1); box-shadow:none; border-radius:12px;}
  .tab-txt b{font-weight:700; letter-spacing:.01em;}
  .app-shell .tab-btn.active{
    background:linear-gradient(135deg,var(--tc7),var(--tc6)); border-color:var(--tc7); border-left-color:var(--gold);
    box-shadow:0 10px 22px -10px var(--tc7), 0 0 0 1px var(--gold-soft) inset;
  }
  .app-shell .tab-btn.active .tab-ico{background:rgba(255,255,255,.95);}

  /* การ์ดทั่วไป */
  main.view{padding:26px 32px;}
  .gantt-wrap,.kpi-card,.breakdown-card,.detail-card,.ship-card,.ctg-rank-card,.ftf-share-card,.env-panel,.env-kpi,.env-guide,.sum-card,.ph-card,.dept-mode-bar{
    border-radius:var(--radius);
  }
  .gantt-wrap,.breakdown-card,.detail-card,.ship-card,.ctg-rank-card,.sum-card,.env-guide{
    border:1px solid #ebe7db; box-shadow:var(--shadow-card);
  }
  .kpi-card{border:1px solid #ebe7db; border-top:3px solid var(--green-600); box-shadow:var(--shadow-card); padding:18px 16px;}
  .kpi-card .kpi-num{font-weight:800; letter-spacing:-.01em; font-variant-numeric:tabular-nums;}
  .kpi-card .kpi-label{letter-spacing:.02em;}
  .gantt-header{background:#f3efe4; color:#4a5750; letter-spacing:.03em;}
  .gantt-row:hover{background:#faf8f2;}
  .gantt-label{color:var(--green-700);}
  .ship-card,.ctg-rank-card{padding:20px 22px;}
  .ship-card h3,.ctg-rank-head h3,.breakdown-header h4{font-weight:700;}
  .ship-card > h3::after{content:''; display:block; width:34px; height:2px; background:var(--gold); margin-top:7px; border-radius:2px;}
  table.ship-table th,.print-table th{letter-spacing:.02em;}
  .ship-table th{background:#f3efe4; color:#4a5750;}
  .ship-table td{border-color:#efebe0;}
  .ship-table tbody tr:hover{background:#faf8f2;}

  /* หัวเรื่องของแต่ละโครงการ (hero) */
  .ftf-hero,.pl-hero,.ctg-hero,.env-poster{border-radius:20px; box-shadow:var(--shadow-lift);}
  .ctg-hero h2,.ftf-hero h2,.pl-hero h2{letter-spacing:.01em; font-weight:800;}
  .hero-chip{background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.28); backdrop-filter:blur(2px);}
  .ctg-hero .btn-outline,.pl-hero .btn-outline,.ftf-hero .btn-outline{border-color:rgba(255,255,255,.9);}

  /* หัวข้อส่วน */
  .env-section-title{color:var(--ink); font-size:17px; font-weight:800; letter-spacing:.01em; padding-bottom:8px; border-bottom:1px solid var(--gold-soft); position:relative;}
  .env-section-title::after{content:''; position:absolute; left:0; bottom:-1px; width:56px; height:2px; background:var(--gold);}
  .env-kpi{border:1px solid #ebe7db; border-top:3px solid var(--kc,var(--green-600)); box-shadow:var(--shadow-card);}
  .env-panel{border:1px solid #ebe7db; box-shadow:var(--shadow-card);}
  .env-hl{border:1px solid #ebe7db; box-shadow:var(--shadow-card);}
  .env-pill{letter-spacing:.01em; box-shadow:0 4px 10px -4px rgba(31,138,91,.5);}
  .env-closing{box-shadow:var(--shadow-lift); border:1px solid rgba(233,220,192,.6);}
  .env-poster{border:1px solid #e3ead9;}
  .env-poster-badge{border-color:var(--gold-soft); color:var(--green-700); letter-spacing:.02em;}

  /* ภาพกิจกรรม / ผู้ช่วย / กล่องโต้ตอบ */
  .ph-card{border:1px solid #ebe7db; border-top:3px solid var(--ph); box-shadow:var(--shadow-card);}
  .ph-tile{border-radius:12px;}
  .modal{border-radius:20px; padding:26px 28px; box-shadow:0 30px 70px -20px rgba(10,30,22,.55); border:1px solid #ece7d9;}
  .modal h3{font-size:19px; font-weight:800; margin-top:0;}
  .modal-backdrop{background:rgba(14,28,22,.5); backdrop-filter:blur(3px);}
  .asst-fab{background:linear-gradient(135deg,#0f4f3a,#1b7355); box-shadow:0 10px 26px -8px rgba(15,79,58,.7), 0 0 0 2px rgba(233,220,192,.8);}
  .asst-head{background:linear-gradient(115deg,#0a3a2b,#14573f); border-bottom:2px solid var(--gold);}
  .asst-panel{border-radius:20px; border:1px solid #e3ddcc; box-shadow:0 26px 60px -18px rgba(10,30,22,.5);}
  .asst-msg.me{background:linear-gradient(135deg,#14573f,#1f7a58);}
  .dept-mode-bar{border:1px dashed #d8cfb4; background:#fffdf7;}
  .status-pill,.shr-badge,.cal-sub-badge{letter-spacing:.01em;}
  footer{color:#a29b87 !important; letter-spacing:.02em;}

  @media (max-width:900px){
    main.view{padding:18px 14px;} .topbar{padding:14px 16px;}
    .app-shell .tab-btn{border-left-width:1px; border-bottom:3px solid var(--tc6);}
    .app-shell .tab-btn.active{border-left-color:var(--tc7); border-bottom-color:var(--gold);}
  }
  .topbar .btn{white-space:nowrap;}
  @media (max-width:560px){ .topbar{gap:10px;} .brand h1{font-size:15px;} .topbar .btn-outline{padding:6px 12px; font-size:13px;} .brand-icon{font-size:26px;} }

.dept-mode-bar .dm-manage{margin-left:auto;white-space:nowrap}
.dmg-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
.dmg-list{max-height:46vh;overflow:auto;border:1px solid var(--border,#e5e0d2);border-radius:10px;padding:6px 10px}
.dmg-item{display:flex;gap:10px;align-items:center;padding:7px 2px;border-bottom:1px dashed rgba(0,0,0,.07);cursor:pointer;font-weight:400}
.dmg-item:last-child{border-bottom:0}
.dmg-item input{width:auto;margin:0}
.dmg-add{margin-top:12px;border:1px solid var(--border,#e5e0d2);border-radius:10px;padding:0 12px;background:var(--gray-100,#f4f6f5)}
.dmg-add summary{cursor:pointer;padding:10px 0;font-weight:700;color:var(--green-700,#1f6f3c)}
.dmg-add-body{padding:0 0 12px}
.dmg-add-body label{display:block;margin:8px 0 4px;font-weight:600}
.dmg-also{display:flex;flex-wrap:wrap;gap:6px 16px;margin:10px 0}
.dmg-also label{display:flex;gap:6px;align-items:center;margin:0;font-weight:400;cursor:pointer}
.dmg-also input{width:auto;margin:0}
.dmg-ok{color:var(--green-700,#1f6f3c);font-weight:600;margin:6px 0}

.modal.modal-wide{width:min(96vw,1120px)}
.dmx-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.dmx-head h3{margin:0}
.dmx-ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dmx-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}
.dmx-kpis>div{border:1px solid #e7e2d3;border-top:3px solid var(--gold,#c9a24a);border-radius:12px;padding:8px 12px;background:#fffdf7}
.dmx-kpis b{display:block;font-size:22px;color:var(--green-700)}
.dmx-kpis small{color:#6b7570;font-size:11px}
.dmx-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:12px;margin-bottom:12px}
.dmx-card{border:1px solid #e7e2d3;border-radius:12px;padding:10px 14px;background:#fff}
.dmx-card h4{margin:0 0 6px;font-size:14px;color:var(--green-700)}
.dmx-legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;margin-top:4px}
.dmx-leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.dmx-bar-row{display:grid;grid-template-columns:20px minmax(80px,1.3fr) 2fr auto;gap:6px;align-items:center;font-size:12px;margin:5px 0}
.dmx-bar-no{color:#8a8672;text-align:right}
.dmx-bar-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dmx-bar-track{background:#f1eee2;border-radius:6px;height:9px;overflow:hidden}
.dmx-bar-fill{display:block;height:100%;background:linear-gradient(90deg,var(--green-600),var(--gold,#c9a24a));border-radius:6px}
.dmx-bar-val{font-weight:700;font-size:12px}
.dmx-scroll{overflow:auto;max-height:46vh}
.dmx-table{border-collapse:collapse;width:100%;font-size:12px}
.dmx-table th,.dmx-table td{border:1px solid #ece7d9;padding:4px 6px}
.dmx-table th{background:#f6f2e4;position:sticky;top:0;color:#4a4636}
.dmx-c-num{text-align:right;white-space:nowrap}
.dmx-c-no{width:28px;text-align:center;color:#8a8672}
.dmx-c-name{text-align:left;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
