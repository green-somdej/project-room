async function exportEnvReportPDF(){
  const data = state.envReportData;
  if (!data){ alert('ไม่มีข้อมูลให้ส่งออก กรุณารอให้โหลดข้อมูลเสร็จแล้วลองใหม่'); return; }

  const btn = document.getElementById('btnEnvExportPdf');
  const oldText = btn.textContent;
  btn.disabled = true; btn.textContent = '⏳ กำลังสร้างรายงาน...';

  try {
    await printPages(rpEnvPages());
  } catch (err) {
    alertErr(err);
  } finally {
    btn.disabled = false; btn.textContent = oldText;
  }
}


/* ============================================================
   โครงการ "คัดแยก แบ่งปัน"
   (ส่งรายการเข้าโครงการ → ตรวจสอบ/รับเข้าคลัง → ตรวจสอบรายการคงเหลือ → เบิก/แบ่งปัน → รายงาน PDF)
   ============================================================ */
state.shr = {
  loaded: false,
  data: null,
  sub: 'overview',
  pendingAction: '',
  lastSubmitter: null   // จำชื่อ/หน่วยงานล่าสุดไว้ ให้ส่งรายการเพิ่มได้เร็ว
};

const SHR_COLORS = ['#128a88','#e8a33d','#3f7fbf','#8e6bbf','#d9534f','#2e8b57','#6b7570'];
const SHR_CAT_ICON = { 'หมึกพิมพ์/ตลับหมึก':'🖨️', 'ลวดเย็บ/เสียบกระดาษ':'📎', 'กระดาษ':'📄', 'ปากกา':'🖊️', 'อื่นๆ':'📦' };
const SHR_STOCK_BADGE = { 'ระบุราคาแล้ว':'shr-b-ok', 'รอตรวจสอบราคา':'shr-b-warn', 'รอตรวจสอบจำนวน':'shr-b-warn', 'หมดแล้ว':'shr-b-muted' };
const SHR_SUB_BADGE = { 'รอตรวจสอบ':'shr-b-warn', 'รับเข้าคลังแล้ว':'shr-b-ok', 'ไม่รับเข้า':'shr-b-bad', 'ผลสำรวจเดิม':'shr-b-info', 'ไม่มีรายการ':'shr-b-muted' };

function shrNum(n){ return (Number(n) || 0).toLocaleString('en-US', { maximumFractionDigits: 2 }); }
function shrCatIcon(c){ return SHR_CAT_ICON[c] || '📦'; }
function shrMonthLabel(m){ return `${THAI_MONTHS[m.month - 1]} ${String(m.year + 543).slice(2)}`; }
function shrBadge(map, text){ return `<span class="shr-badge ${map[text] || 'shr-b-muted'}">${escapeHtml(text)}</span>`; }
function shrRange(d){
  const k = d.kpi;
  return k.firstDate ? `${fmtDate(k.firstDate)} – ${fmtDate(k.lastDate)}` : 'ยังไม่มีรายการเบิก';
}
function shrLink(action){
  const base = (typeof WEBAPP_URL !== 'undefined' && WEBAPP_URL) ? WEBAPP_URL : window.location.href.split('?')[0];
  return base + '?page=share&action=' + action;
}
function shrFillSelect(id, values, placeholder, keep){
  const el = document.getElementById(id);
  const prev = keep ? el.value : '';
  el.innerHTML = (placeholder ? `<option value="">${placeholder}</option>` : '') +
    values.map(v => `<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join('');
  if (keep && prev && values.indexOf(prev) !== -1) el.value = prev;
}
function shrShowError(id, msg){
  const el = document.getElementById(id);
  el.textContent = msg; el.classList.remove('hidden');
}
function shrHideError(id){ document.getElementById(id).classList.add('hidden'); }
function shrSessionArgs(){
  return state.session ? [state.session.departmentId, state.session.pin] : ['', ''];
}

/* ---------- events ---------- */
function bindShrEvents(){
  document.getElementById('btnShrOpenSubmit').onclick = () => openShrSubmitModal();
  document.getElementById('btnShrShowLinks').onclick = toggleShrLinks;
  document.getElementById('btnShrCopyForm').onclick = () => copyShrLink('shrLinkFormInput', 'shrCopyFormConfirm');
  document.getElementById('btnShrCopyStock').onclick = () => copyShrLink('shrLinkStockInput', 'shrCopyStockConfirm');
  document.getElementById('btnShrAddWithdraw').onclick = () => openShrWithdrawModal('');
  document.getElementById('btnShrAddItem').onclick = () => openShrItemModal(null);
  document.getElementById('btnShrExportExcel').onclick = exportShrExcel;
  document.getElementById('btnShrExportPdf').onclick = exportShrPDF;

  document.querySelectorAll('.shr-subtab').forEach(b => b.onclick = () => setShrSub(b.dataset.sub));

  document.getElementById('shrStockSearch').oninput = renderShrStock;
  document.getElementById('shrStockCat').onchange = renderShrStock;
  document.getElementById('shrStockStatus').onchange = renderShrStock;
  document.getElementById('shrStockShowEmpty').onchange = renderShrStock;
  document.getElementById('shrSubsStatus').onchange = renderShrSubs;
  document.getElementById('shrWdSearch').oninput = renderShrWithdrawals;
  document.getElementById('shrWdCat').onchange = renderShrWithdrawals;

  document.getElementById('btnShrSubmit').onclick = submitShrItem;
  document.getElementById('shrSfNoItems').onchange = syncShrNoItems;
  document.getElementById('btnShrAccept').onclick = acceptShrSubmission;
  document.getElementById('btnShrSaveItem').onclick = saveShrItem;
  document.getElementById('btnShrConfirmCount').onclick = confirmShrCount;
  document.getElementById('btnShrSaveWithdraw').onclick = saveShrWithdrawal;
  document.getElementById('shrWfItem').onchange = syncShrWithdrawForm;
}

/* ---------- โหลด/แสดงผล ---------- */
function loadShrData(){
  const args = shrSessionArgs();
  google.script.run.withSuccessHandler(data => {
    state.shr.loaded = true;
    state.shr.data = data;
    renderShrAll();
    runShrPendingAction();
  }).withFailureHandler(err => {
    state.shr.loaded = false;
    const msg = '<div class="empty">โหลดข้อมูลไม่สำเร็จ: ' + escapeHtml(err.message || err) + '</div>';
    document.getElementById('shrKpiRow').innerHTML = msg;
  }).getShareOverview(args[0], args[1]);
}

function renderShrAll(){
  const d = state.shr.data;
  shrFillSelect('shrStockCat', d.categories, 'ทุกหมวด', true);
  shrFillSelect('shrWdCat', d.categories, 'ทุกหมวด', true);
  shrFillSelect('shrSfCat', d.categories, null);
  shrFillSelect('shrSfUsage', d.usageOptions, null);
  shrFillSelect('shrAfCat', d.categories, null);
  shrFillSelect('shrIfCat', d.categories, null);
  shrFillSelect('shrWfCat', d.categories, null);
  document.getElementById('shrDeptList').innerHTML =
    d.departments.map(n => `<option value="${escapeHtml(n)}"></option>`).join('');
  renderShrKpi(d);
  renderShrTrend(d);
  renderShrCategory(d);
  renderShrDeptRank(d);
  renderShrTopItems(d);
  renderShrStock();
  renderShrSubs();
  renderShrWithdrawals();
  renderShrCounts(d);
  setShrSub(state.shr.sub);
}

function setShrSub(sub){
  state.shr.sub = sub;
  document.querySelectorAll('.shr-subtab').forEach(b => b.classList.toggle('active', b.dataset.sub === sub));
  document.getElementById('shrSubOverview').classList.toggle('hidden', sub !== 'overview');
  document.getElementById('shrSubStock').classList.toggle('hidden', sub !== 'stock');
  document.getElementById('shrSubSubs').classList.toggle('hidden', sub !== 'subs');
  document.getElementById('shrSubWd').classList.toggle('hidden', sub !== 'wd');
  document.getElementById('shrSubSum').classList.toggle('hidden', sub !== 'sum');
  if (sub === 'sum') sumRefresh('share');
}

function renderShrCounts(d){
  const k = d.kpi;
  document.getElementById('shrCntStock').textContent = k.stockLines ? k.stockLines : '';
  const pend = document.getElementById('shrCntSubs');
  pend.textContent = k.submissionsPending ? k.submissionsPending : '';
  pend.classList.toggle('hidden', !k.submissionsPending);
  document.getElementById('shrCntWd').textContent = k.withdrawalCount ? k.withdrawalCount : '';
}

function renderShrKpi(d){
  const k = d.kpi;
  const needCheck = k.stockPricePending + k.stockCountPending;
  document.getElementById('shrKpiRow').innerHTML = `
    <div class="kpi-card kpi-share"><div class="kpi-num">${shrNum(k.withdrawalValue)}</div><div class="kpi-label">มูลค่าที่แบ่งปันแล้ว (บาท)</div><div class="kpi-sub">แทนการจัดซื้อใหม่</div></div>
    <div class="kpi-card kpi-share"><div class="kpi-num">${k.withdrawalCount.toLocaleString()}</div><div class="kpi-label">รายการที่เบิก/แบ่งปันแล้ว</div><div class="kpi-sub">${k.withdrawalDeptCount} หน่วยงาน</div></div>
    <div class="kpi-card kpi-share"><div class="kpi-num">${k.stockLines.toLocaleString()}</div><div class="kpi-label">รายการคงเหลือรอแบ่งปัน</div></div>
    <div class="kpi-card kpi-share"><div class="kpi-num">${shrNum(k.stockValue)}</div><div class="kpi-label">มูลค่าคงเหลือ (บาท)</div><div class="kpi-sub">เฉพาะรายการที่ระบุราคา</div></div>
    <div class="kpi-card kpi-share-warn"><div class="kpi-num">${needCheck.toLocaleString()}</div><div class="kpi-label">คงเหลือที่รอตรวจสอบราคา/จำนวน</div></div>
    <div class="kpi-card kpi-share-warn"><div class="kpi-num">${k.submissionsPending.toLocaleString()}</div><div class="kpi-label">ส่งเข้าโครงการ รอตรวจสอบ</div></div>
    <div class="kpi-card kpi-share"><div class="kpi-num">${k.respondedDeptCount.toLocaleString()}</div><div class="kpi-label">หน่วยงานที่ร่วมแจ้ง/ตอบสำรวจ</div></div>`;
  const i = d.impact;
  const unpriced = k.unpricedWithdrawals
    ? ` • มี ${k.unpricedWithdrawals} รายการเบิกที่ไม่ระบุราคา (ไม่นับในมูลค่า)` : '';
  document.getElementById('shrNote').innerHTML =
    `💡 ช่วงข้อมูลการเบิก ${shrRange(d)}${unpriced}<br>` +
    `🌳 ประมาณผลกระทบ: กระดาษที่แบ่งปัน ${shrNum(i.paperReams)} รีม (≈${shrNum(i.paperSheets)} แผ่น เทียบเท่าต้นไม้ ${shrNum(i.treesSaved)} ต้น) • ` +
    `ตลับหมึก/โทนเนอร์ ${shrNum(i.cartridges)} ตลับ (≈${shrNum(i.cartridgeWeightKg)} กก.) • ` +
    `ลดการปล่อย CO2 ได้ราว ${shrNum(i.totalCo2Kg)} กก. (ค่าประมาณ ปรับสมมติฐานได้ที่ชีต EnvironmentalSettings)`;
}

function renderShrTrend(d){
  const months = d.monthly;
  const el = document.getElementById('shrTrendChart');
  document.getElementById('shrTrendSubtitle').textContent =
    `${shrRange(d)} • รวม ${shrNum(d.kpi.withdrawalValue)} บาท`;
  if (!months.length){ el.innerHTML = '<div class="empty">ยังไม่มีรายการเบิก/แบ่งปัน</div>'; return; }
  const max = Math.max(1, ...months.map(m => m.value));
  const peak = months.findIndex(m => m.value === max);
  el.innerHTML = '<div style="display:flex; gap:6px; align-items:flex-end; border-bottom:1px solid var(--gray-200); padding-bottom:2px;">' +
    months.map((m, i) => {
      const pct = Math.max(2, Math.round((m.value / max) * 100));
      const isPeak = i === peak && m.value > 0;
      return `
        <div style="flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; gap:4px;">
          <div style="font-size:11px; color:${isPeak ? 'var(--share-700)' : 'var(--gray-500)'}; font-weight:${isPeak ? '700' : '400'}; white-space:nowrap;">${m.value ? shrNum(m.value) : '0'}</div>
          <div style="width:100%; height:120px; display:flex; align-items:flex-end; background-image:linear-gradient(to top, var(--gray-200) 1px, transparent 1px); background-size:100% 40px;">
            <div style="width:100%; background:linear-gradient(180deg,var(--share-500),var(--share-700)); border-radius:6px 6px 2px 2px;
                        height:${m.value > 0 ? pct : 0}%; min-height:${m.value > 0 ? '4px' : '0'};"></div>
          </div>
          <div style="font-size:11px; color:var(--gray-500); white-space:nowrap;">${shrMonthLabel(m)}</div>
          <div style="font-size:10px; color:var(--gray-500);">${m.count} รายการ</div>
        </div>`;
    }).join('') + '</div>';
}

function renderShrCategory(d){
  const rows = d.byCategory;
  const total = d.kpi.withdrawalValue;
  document.getElementById('shrCatSubtitle').textContent = `${rows.length} หมวด • รวม ${shrNum(total)} บาท`;
  const pieEl = document.getElementById('shrCatPie');
  const listEl = document.getElementById('shrCatList');
  if (!rows.length){ pieEl.innerHTML = ''; listEl.innerHTML = '<p class="muted">ไม่มีข้อมูล</p>'; return; }
  pieEl.innerHTML = buildPieSvg(rows.map(r => [r.Category, r.value]), total, (l, i) => SHR_COLORS[i % SHR_COLORS.length]);
  listEl.innerHTML = rows.map((r, i) => `
    <div class="breakdown-item">
      <span class="bi-icon" style="background:${SHR_COLORS[i % SHR_COLORS.length]}">${shrCatIcon(r.Category)}</span>
      <div>
        <div class="bi-title">${escapeHtml(r.Category)} • ${r.percent}%</div>
        <div class="bi-sub">${shrNum(r.value)} บาท • ${r.count} รายการ</div>
      </div>
    </div>`).join('');
}

function renderShrDeptRank(d){
  const all = d.byDepartment;
  const rows = all.slice(0, 10);
  document.getElementById('shrDeptSubtitle').textContent =
    `${all.length} หน่วยงาน${all.length > 10 ? ' (แสดง 10 อันดับแรก — ดูทั้งหมดในรายงาน PDF)' : ''}`;
  const el = document.getElementById('shrDeptRank');
  if (!rows.length){ el.innerHTML = '<div class="empty">ยังไม่มีข้อมูล</div>'; return; }
  const max = Math.max(1, ...rows.map(r => r.value));
  el.innerHTML = rows.map(r => `
    <div class="shr-rank-row rank-${r.rank}">
      <div class="shr-rank-num">${r.rank}</div>
      <div class="shr-rank-name" title="${escapeHtml(r.DepartmentName)}">${escapeHtml(r.DepartmentName)}</div>
      <div class="shr-rank-track"><span class="shr-rank-fill" style="width:${Math.round((r.value / max) * 100)}%;"></span></div>
      <div class="shr-rank-val"><b>${shrNum(r.value)}</b> บาท</div>
    </div>`).join('');
}

function renderShrTopItems(d){
  const el = document.getElementById('shrTopItems');
  const rows = d.topItems;
  if (!rows.length){ el.innerHTML = '<div class="empty">ยังไม่มีข้อมูล</div>'; return; }
  const max = Math.max(1, ...rows.map(r => r.value));
  el.innerHTML = rows.map((r, i) => `
    <div class="shr-rank-row rank-${i + 1}">
      <div class="shr-rank-num">${i + 1}</div>
      <div class="shr-rank-name" style="width:230px;" title="${escapeHtml(r.ItemName)}">${escapeHtml(r.ItemName)}</div>
      <div class="shr-rank-track"><span class="shr-rank-fill" style="width:${Math.round((r.value / max) * 100)}%;"></span></div>
      <div class="shr-rank-val" style="width:170px;"><b>${shrNum(r.value)}</b> บาท • ${shrNum(r.quantity)} ${escapeHtml(r.Unit)}</div>
    </div>`).join('');
}

/* ---------- ตรวจสอบรายการคงเหลือ ---------- */
function getShrFilteredStock(){
  const d = state.shr.data;
  const q = document.getElementById('shrStockSearch').value.trim().toLowerCase();
  const cat = document.getElementById('shrStockCat').value;
  const st = document.getElementById('shrStockStatus').value;
  const showEmpty = document.getElementById('shrStockShowEmpty').checked;
  return d.stock.filter(i => {
    if (!showEmpty && st !== 'หมดแล้ว' && i.Status === 'หมดแล้ว') return false;
    if (q && i.ItemName.toLowerCase().indexOf(q) === -1) return false;
    if (cat && i.Category !== cat) return false;
    if (st && i.Status !== st) return false;
    return true;
  });
}

function renderShrStock(){
  const d = state.shr.data;
  if (!d) return;
  const isAdmin = !!state.session;
  const rows = getShrFilteredStock();
  const k = d.kpi;
  document.getElementById('shrStockSubtitle').textContent =
    `${rows.length} รายการ • มูลค่ารวมเฉพาะที่ระบุราคา ${shrNum(k.stockValue)} บาท` +
    (k.stockPricePending + k.stockCountPending ? ` • รอตรวจสอบราคา/จำนวน ${k.stockPricePending + k.stockCountPending} รายการ` : '');
  const body = document.getElementById('shrStockRows');
  const foot = document.getElementById('shrStockFoot');
  if (!rows.length){
    body.innerHTML = '<tr><td colspan="10" class="empty">ไม่พบรายการตามเงื่อนไขที่เลือก</td></tr>';
    foot.innerHTML = '';
    return;
  }
  body.innerHTML = rows.map((i, idx) => {
    const actions = isAdmin ? `
      <button onclick="openShrCountModal('${i.ItemID}')">🔎 ตรวจนับ</button>
      ${i.Quantity > 0 ? `<button onclick="openShrWithdrawModal('${i.ItemID}')">🎁 จ่ายแบ่งปัน</button>` : ''}
      <button onclick="openShrItemModal('${i.ItemID}')">✏️ แก้ไข</button>
      <button class="danger" onclick="deleteShrItem('${i.ItemID}')">🗑️ ลบ</button>` : '';
    return `
      <tr>
        <td>${idx + 1}</td>
        <td class="shr-item">${escapeHtml(i.ItemName)}${i.Note ? `<small>${escapeHtml(i.Note)}</small>` : ''}</td>
        <td class="shr-left">${shrCatIcon(i.Category)} ${escapeHtml(i.Category)}</td>
        <td>${i.Quantity === null ? '-' : shrNum(i.Quantity)}</td>
        <td>${escapeHtml(i.Unit) || '-'}</td>
        <td>${i.UnitValue === null ? '-' : shrNum(i.UnitValue)}</td>
        <td>${i.LineValue === null ? '-' : shrNum(i.LineValue)}</td>
        <td>${shrBadge(SHR_STOCK_BADGE, i.Status)}</td>
        <td>${i.LastCheckedAt ? fmtDate(i.LastCheckedAt) : '<span class="muted">ยังไม่เคยตรวจนับ</span>'}</td>
        <td class="shr-actions">${actions}</td>
      </tr>`;
  }).join('');
  const sum = rows.reduce((s, i) => s + (i.LineValue || 0), 0);
  foot.innerHTML = `<tr><td colspan="6" style="text-align:right;">รวม (เฉพาะที่ระบุราคา)</td><td>${shrNum(sum)}</td><td colspan="3"></td></tr>`;
}

/* ---------- รายการส่งเข้าโครงการ ---------- */
function renderShrSubs(){
  const d = state.shr.data;
  if (!d) return;
  const isAdmin = !!state.session && d.isAdmin;
  const st = document.getElementById('shrSubsStatus').value;
  const rows = d.submissions.filter(s => !st || s.Status === st);
  const c = d.submissionCounts;
  document.getElementById('shrSubsSubtitle').textContent =
    `${rows.length} รายการ • รอตรวจสอบ ${(c['รอตรวจสอบ'] || 0)} • รับเข้าคลังแล้ว ${(c['รับเข้าคลังแล้ว'] || 0)}`;
  document.querySelectorAll('.shr-admin-col').forEach(el => el.classList.toggle('hidden', !isAdmin));
  const body = document.getElementById('shrSubRows');
  if (!rows.length){ body.innerHTML = '<tr><td colspan="8" class="empty">ยังไม่มีรายการ</td></tr>'; return; }
  body.innerHTML = rows.map(s => {
    let actions = '';
    if (isAdmin){
      if (s.Status === 'รอตรวจสอบ' || s.Status === 'ผลสำรวจเดิม'){
        actions = `<button onclick="openShrAcceptModal('${s.SubmissionID}')">✅ รับเข้าคลัง</button>
                   <button class="danger" onclick="reviewShrSubmission('${s.SubmissionID}','reject')">🚫 ไม่รับ</button>`;
      } else if (s.Status === 'ไม่รับเข้า'){
        actions = `<button onclick="reviewShrSubmission('${s.SubmissionID}','reopen')">↩️ กลับเป็นรอตรวจสอบ</button>`;
      }
    }
    const adminCell = isAdmin
      ? `<td class="shr-left shr-admin-col">${escapeHtml(s.SubmitterName || '')}${s.Position ? `<small class="muted" style="display:block;">${escapeHtml(s.Position)}</small>` : ''}</td>`
      : '';
    return `
      <tr>
        <td>${fmtDate(s.SubmitDate)}</td>
        <td class="shr-left">${escapeHtml(s.DepartmentName)}</td>
        ${adminCell}
        <td class="shr-item">${escapeHtml(s.ItemName)}${s.Note ? `<small>${escapeHtml(s.Note)}</small>` : ''}</td>
        <td>${s.Quantity === null ? '-' : shrNum(s.Quantity) + ' ' + escapeHtml(s.Unit)}</td>
        <td class="shr-left">${escapeHtml(s.UsageStatus === '-' ? '' : s.UsageStatus)}</td>
        <td>${shrBadge(SHR_SUB_BADGE, s.Status)}</td>
        <td class="shr-actions">${actions}</td>
      </tr>`;
  }).join('');
  // คอลัมน์ผู้แจ้งสำหรับสาธารณะ: ตัดช่องหัวตารางออก เพื่อให้คอลัมน์ตรงกับข้อมูล
}

/* ---------- รายการเบิก/แบ่งปัน ---------- */
function getShrFilteredWithdrawals(){
  const q = document.getElementById('shrWdSearch').value.trim().toLowerCase();
  const cat = document.getElementById('shrWdCat').value;
  return state.shr.data.withdrawals.filter(w => {
    if (cat && w.Category !== cat) return false;
    if (q && (w.ItemName + ' ' + w.DepartmentName).toLowerCase().indexOf(q) === -1) return false;
    return true;
  });
}

function renderShrWithdrawals(){
  const d = state.shr.data;
  if (!d) return;
  const isAdmin = !!state.session;
  const rows = getShrFilteredWithdrawals();
  const sum = rows.reduce((s, w) => s + w.LineTotal, 0);
  document.getElementById('shrWdSubtitle').textContent = `${rows.length} รายการ • มูลค่ารวม ${shrNum(sum)} บาท`;
  const body = document.getElementById('shrWdRows');
  const foot = document.getElementById('shrWdFoot');
  if (!rows.length){
    body.innerHTML = '<tr><td colspan="9" class="empty">ไม่พบรายการ</td></tr>';
    foot.innerHTML = '';
    return;
  }
  body.innerHTML = rows.map(w => `
    <tr>
      <td>${fmtDate(w.WithdrawDate)}</td>
      <td class="shr-left">${shrCatIcon(w.Category)} ${escapeHtml(w.Category)}</td>
      <td class="shr-item">${escapeHtml(w.ItemName)}${w.Note ? `<small>${escapeHtml(w.Note)}</small>` : ''}</td>
      <td>${shrNum(w.Quantity)}</td>
      <td>${escapeHtml(w.Unit)}</td>
      <td>${w.UnitPrice === null ? '<span class="muted">ไม่ระบุ</span>' : shrNum(w.UnitPrice)}</td>
      <td>${w.UnitPrice === null ? '-' : shrNum(w.LineTotal)}</td>
      <td class="shr-left">${escapeHtml(w.DepartmentName)}</td>
      <td class="shr-actions">${isAdmin ? `<button class="danger" onclick="deleteShrWithdrawal('${w.WithdrawalID}')">🗑️ ลบ</button>` : ''}</td>
    </tr>`).join('');
  foot.innerHTML = `<tr><td colspan="6" style="text-align:right;">รวม</td><td>${shrNum(sum)}</td><td colspan="2"></td></tr>`;
}

/* ---------- ลิงก์ + QR ---------- */
function toggleShrLinks(){
  const card = document.getElementById('shrShareCard');
  const wasHidden = card.classList.contains('hidden');
  card.classList.toggle('hidden');
  if (wasHidden) renderShrLinks();
}
function renderShrLinks(){
  const form = shrLink('form'), stock = shrLink('stock');
  document.getElementById('shrLinkFormInput').value = form;
  document.getElementById('shrLinkStockInput').value = stock;
  const qr = l => 'https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=' + encodeURIComponent(l);
  document.getElementById('shrQrForm').src = qr(form);
  document.getElementById('shrQrFormDl').href = qr(form);
  document.getElementById('shrQrStock').src = qr(stock);
  document.getElementById('shrQrStockDl').href = qr(stock);
}
function copyShrLink(inputId, confirmId){
  const input = document.getElementById(inputId);
  const confirmEl = document.getElementById(confirmId);
  const ok = () => { confirmEl.classList.remove('hidden'); setTimeout(() => confirmEl.classList.add('hidden'), 2500); };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(input.value).then(ok).catch(() => fallbackCopy(input, ok));
  } else {
    fallbackCopy(input, ok);
  }
}
function showShrConfirm(message){
  const el = document.getElementById('shrSubmitConfirm');
  el.innerHTML = `<span>${message}</span><button onclick="this.parentElement.classList.add('hidden')">✕</button>`;
  el.classList.remove('hidden');
  el.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

  })));
  add('รายการเบิก', d.withdrawals.slice().reverse().map(w => ({

  })));

    const stock = d.stock.filter(i => i.Status !== 'หมดแล้ว');
    if (stock.length){
      pages.push(...chunkArray(stock, 14).map((c, i, all) => rpShrStockPage(c, stock, i, all.length)));
    }
    if (d.withdrawals.length){
      pages.push(...chunkArray(d.withdrawals, 15).map((c, i, all) => rpShrWithdrawPage(c, d, i, all.length)));
    }
    if (d.submissions.length){
      pages.push(...chunkArray(d.submissions, 15).map((c, i, all) => rpShrSubmissionPage(c, i, all.length)));
    }
    await printPages(pages);
  } catch (err) {
    alertErr(err);
  } finally {
    btn.disabled = false; btn.textContent = oldText;
  }
}

function shortThaiDate(iso){
  const d = new Date(iso);
  if (isNaN(d)) return iso || '';
  return `${d.getDate()} ${THAI_MONTHS[d.getMonth()]} ${String(d.getFullYear() + 543).slice(2)}`;
}

function buyerKeyJs(name){
  const base = String(name || '').toLowerCase().replace(/[\s\.\-_,()]/g, '');
  const stripped = base.replace(/^(นางสาว|นส|นาง|นาย|คุณ|ร้าน|บริษัท|บจก|หจก)/, '');
  return stripped || base;
}

function bindSubtabs(navId, map, onShow){
  const btns = document.querySelectorAll('#' + navId + ' .pj-subtab');
  btns.forEach(b => b.onclick = () => {
    btns.forEach(x => x.classList.toggle('active', x === b));
    Object.keys(map).forEach(k => document.getElementById(map[k]).classList.toggle('hidden', k !== b.dataset.sub));
    if (onShow && onShow[b.dataset.sub]) onShow[b.dataset.sub]();
  });
}

function loadShip(key){
  const cfg = SHIP_CFG[key], st = state.ship[key];
  const el = document.getElementById(cfg.paneId);
  const getter = key === 'ftf' ? 'getFryToFlyShipments' : 'getKitchenOverview';
  google.script.run.withSuccessHandler(v => {
    st.view = v; st.year = v.year; st.loaded = true;
    renderShip(key);
  }).withFailureHandler(err => {
    el.innerHTML = '<div class="empty">โหลดข้อมูลไม่สำเร็จ: ' + escapeHtml(err.message || err) + '</div>';
  })[getter](st.year);
}

function shipYear(key, delta){
  const cfg = SHIP_CFG[key], v = cfg.view();
  if (!v) return;
  cfg.setYear(v.year + delta);
}

/** แผนภูมิแท่งแนวตั้งแบบง่าย (ใช้กับราคาต่อหน่วยแต่ละรอบ / ปริมาณรายเดือน) */
function shipBars(values, labels, titles, fmtVal){
  const max = Math.max(1, ...values);
  const peak = Math.max(...values);
  return `<div class="ship-bars">` + values.map((val, i) => {
    const pct = val > 0 ? Math.max(4, Math.round(val / max * 100)) : 0;
    return `
      <div class="ship-bar-col" title="${escapeHtml(titles[i] || '')}">
        <div class="ship-bar-val" style="${val > 0 && val === peak ? '' : 'opacity:.75;'}">${val ? fmtVal(val) : ''}</div>
        <div class="ship-bar-area"><div class="ship-bar" style="height:${pct}%;${val > 0 ? '' : 'min-height:0;'}"></div></div>
        <div class="ship-bar-lbl">${labels[i]}</div>
      </div>`;
  }).join('') + `</div>`;
}

function shipKpiCard(num, label, sub){
  return `<div class="kpi-card kpi-pj"><div class="kpi-num">${num}</div><div class="kpi-label">${label}</div>${sub ? `<div class="kpi-sub">${sub}</div>` : ''}</div>`;
}

function renderShip(key){
  const cfg = SHIP_CFG[key];
  const el = document.getElementById(cfg.paneId);
  if (!el) return;
  const v = cfg.view();
  if (!v){ el.innerHTML = '<div class="loading">กำลังโหลดข้อมูล...</div>'; return; }
  if (key === 'kit'){
    document.getElementById('kitYearLabel').textContent = 'ปี พ.ศ. ' + (v.year + 543);
    document.getElementById('kitCanLiters').textContent = v.settings.litersPerCan;
  }
  const isAdmin = !!state.session;
  const b = cfg.base, yr = v.year + 543, ys = v.yearStats, at = v.allTime;
  const multiUnit = cfg.units.length > 1;

  let kpis = [
    shipKpiCard(shipNum(ys.rounds), `จำนวนรอบที่ส่ง (ปี ${yr})`, `สะสมทั้งหมด ${shipNum(at.rounds)} รอบ`),
    shipKpiCard(shipNum(ys.qty), `ปริมาณที่ส่ง (${b}) ปี ${yr}`, `สะสม ${shipNum(at.qty)} ${b}`),
    shipKpiCard(shipNum(ys.amount), `รายได้ปี ${yr} (บาท)`, `สะสม ${shipNum(at.amount)} บาท`),
    shipKpiCard(shipNum(ys.avgPrice), `ราคาเฉลี่ยปี ${yr} (บาท/${b})`, ys.maxPrice ? `ต่ำสุด ${shipNum(ys.minPrice)} – สูงสุด ${shipNum(ys.maxPrice)}` : ''),
    shipKpiCard(at.lastPrice ? shipNum(at.lastPrice) : '-', `ราคารอบล่าสุด (บาท/${b})`, at.lastDate ? 'ส่งเมื่อ ' + fmtDate(at.lastDate) : 'ยังไม่มีการส่ง')
  ];
  if (cfg.extraKpis) cfg.extraKpis(v).forEach(k => kpis.push(shipKpiCard(k[0], k[1], k[2])));

  // กราฟราคาต่อหน่วยของแต่ละรอบ (เรียงจากรอบแรกไปล่าสุด)
  const asc = v.rounds.slice().reverse();
  const priceChart = asc.length
    ? shipBars(asc.map(r => r.PricePerBase), asc.map(r => shortThaiDate(r.Date)),
        asc.map(r => `${fmtDate(r.Date)} • ${r.Buyer} • ${shipNum(r.Quantity)} ${r.Unit} • ${shipNum(r.Amount)} บาท`), x => shipNum(x))
      + `<p class="ship-avg-note">ราคาเฉลี่ยถ่วงน้ำหนักปี ${yr}: <b>${shipNum(ys.avgPrice)}</b> บาท/${b} • ต่ำสุด ${shipNum(ys.minPrice)} • สูงสุด ${shipNum(ys.maxPrice)} • ราคาแต่ละรอบเปลี่ยนตามผู้รับซื้อและช่วงเวลา</p>`
    : '<div class="empty">ยังไม่มีการส่งในปีนี้</div>';

  const monthlyChart = cfg.showMonthly
    ? `<section class="ship-card"><h3>📈 ปริมาณที่ส่งรายเดือน (${b})</h3><p class="muted">ปี พ.ศ. ${yr} • รวม ${shipNum(ys.qty)} ${b}</p>` +
      shipBars(v.monthly.map(m => m.qty), THAI_MONTHS, v.monthly.map((m, i) => `${THAI_MONTHS[i]}: ${shipNum(m.qty)} ${b} • ${shipNum(m.amount)} บาท • ${m.rounds} รอบ`), x => shipNum(x)) + `</section>`
    : '';

  // ตารางรอบ + เปรียบเทียบราคากับรอบก่อนหน้า
  const change = {};
  let prev = null;
  asc.forEach(r => {
    if (prev !== null && prev > 0 && r.PricePerBase > 0){
      const pct = (r.PricePerBase - prev) / prev * 100;
      change[r.ID] = pct;
    }
    if (r.PricePerBase > 0) prev = r.PricePerBase;
  });
  const colCount = 8 + (multiUnit ? 1 : 0);
  const rowsHtml = v.rounds.length ? v.rounds.map(r => {
    const ch = change[r.ID];
    const chHtml = (ch === undefined || Math.abs(ch) < 0.05) ? ''
      : `<span class="${ch > 0 ? 'down' : 'up'}">${ch > 0 ? '▲' : '▼'} ${shipNum(Math.abs(ch), 1)}% เทียบรอบก่อน</span>`;
    const actions = isAdmin
      ? `<button onclick="shipOpenForm('${key}','${r.ID}')">✏️ แก้ไข</button><button onclick="shipDelete('${key}','${r.ID}')">🗑️ ลบ</button>` : '';
    return `<tr>
      <td class="l">${fmtDate(r.Date)}</td>
      <td class="l">${escapeHtml(r.Buyer)}</td>
      <td>${shipNum(r.Quantity)} ${escapeHtml(r.Unit)}${r.Unit !== b ? `<span class="sub">= ${shipNum(r.Base)} ${b}</span>` : ''}</td>
      ${multiUnit ? `<td>${shipNum(r.UnitPrice)}<span class="sub">บาท/${escapeHtml(r.Unit)}</span></td>` : ''}
      <td>${shipNum(r.PricePerBase)}${chHtml ? `<span class="sub">${chHtml}</span>` : ''}</td>
      <td><b>${shipNum(r.Amount)}</b></td>
      <td class="note">${escapeHtml(r.Note || '')}</td>
      <td class="ship-row-actions">${actions}</td>
    </tr>`;
  }).join('') : `<tr><td colspan="${colCount}" class="empty">ยังไม่มีรายการส่งในปีนี้</td></tr>`;
  const footHtml = v.rounds.length ? `<tfoot><tr><td class="l" colspan="2">รวมปี ${yr} (${ys.rounds} รอบ)</td><td>${shipNum(ys.qty)} ${b}</td>${multiUnit ? '<td></td>' : ''}<td>เฉลี่ย ${shipNum(ys.avgPrice)}</td><td>${shipNum(ys.amount)}</td><td colspan="2"></td></tr></tfoot>` : '';

  const yearlyHtml = v.yearly.length ? v.yearly.map(y => `<tr>
      <td class="l">${y.year + 543}</td><td>${shipNum(y.rounds)}</td><td>${shipNum(y.qty)}</td><td>${shipNum(y.amount)}</td>
      <td>${shipNum(y.avgPrice)}</td><td>${y.minPrice ? shipNum(y.minPrice) : '-'}</td><td>${y.maxPrice ? shipNum(y.maxPrice) : '-'}</td></tr>`).join('')
    : '<tr><td colspan="7" class="empty">ยังไม่มีข้อมูล</td></tr>';
  const buyersHtml = v.buyers.length ? v.buyers.map(x => `<tr>
      <td class="l">${escapeHtml(x.BuyerName)}</td><td>${shipNum(x.rounds)}</td><td>${shipNum(x.qty)}</td><td>${shipNum(x.amount)}</td>
      <td>${shipNum(x.avgPrice)}</td><td>${x.lastDate ? fmtDate(x.lastDate) : '-'}</td></tr>`).join('')
    : '<tr><td colspan="6" class="empty">ยังไม่มีผู้รับซื้อ — เมื่อบันทึกการส่ง ระบบจะเพิ่มผู้รับซื้อเข้าทะเบียนให้อัตโนมัติ</td></tr>';

  el.innerHTML = `
    <section class="ship-section">
      <div class="ship-head">
        <div>
          <h3>${cfg.icon} ${cfg.title}</h3>
          <p class="muted">${cfg.subtitle}</p>
        </div>
        <div class="ship-actions">
          ${cfg.ownYearNav ? `<div class="ship-yearnav"><button class="btn btn-icon" onclick="shipYear('${key}',-1)">‹</button><span class="year-label">ปี พ.ศ. ${yr}</span><button class="btn btn-icon" onclick="shipYear('${key}',1)">›</button></div>` : ''}
          ${isAdmin ? `<button class="btn btn-add" onclick="shipOpenForm('${key}')">${cfg.addLabel}</button>` : `<span class="muted">🔒 เข้าสู่ระบบผู้ดูแลเพื่อบันทึกการส่ง</span>`}
          <button class="btn btn-outline" onclick="shipExportExcel('${key}')">📊 Excel</button>
          <button class="btn btn-outline" onclick="shipExportPDF('${key}')">📄 PDF</button>
        </div>
      </div>

      <div class="ship-kpi-row">${kpis.join('')}</div>

      <section class="ship-card">
        <h3>💰 ราคาต่อ${b}ของแต่ละรอบ</h3>
        <p class="muted">ปี พ.ศ. ${yr} • ${v.rounds.length} รอบ — ราคาแต่ละรอบไม่เท่ากัน เลื่อนเมาส์ที่แท่งเพื่อดูผู้รับซื้อและจำนวน</p>
        ${priceChart}
      </section>

      ${monthlyChart}

      <section class="ship-card">
        <h3>🧾 รายการส่งรายรอบ ปี พ.ศ. ${yr}</h3>
        <p class="muted">${v.rounds.length} รอบ • เรียงจากล่าสุด</p>
        <div class="ship-table-wrap"><table class="ship-table">
          <thead><tr><th class="l">วันที่ส่ง</th><th class="l">${cfg.buyerLabel}</th><th>จำนวน</th>${multiUnit ? '<th>ราคา/หน่วยที่ส่ง</th>' : ''}<th>ราคา (บาท/${b})</th><th>จำนวนเงิน (บาท)</th><th class="l">หมายเหตุ</th><th></th></tr></thead>
          <tbody>${rowsHtml}</tbody>${footHtml}
        </table></div>
      </section>

      <section class="ship-card">
        <h3>📅 สรุปรายปี</h3>
        <div class="ship-table-wrap"><table class="ship-table">
          <thead><tr><th class="l">ปี พ.ศ.</th><th>รอบ</th><th>ปริมาณ (${b})</th><th>รายได้ (บาท)</th><th>ราคาเฉลี่ย (บาท/${b})</th><th>ต่ำสุด</th><th>สูงสุด</th></tr></thead>
          <tbody>${yearlyHtml}</tbody>
        </table></div>
      </section>

      <section class="ship-card">
        <h3>🤝 ทะเบียนผู้รับซื้อ</h3>
        <p class="muted">สรุปตามผู้รับซื้อ (สะสมทุกปี) — ผู้รับซื้อที่เคยบันทึกแล้วจะขึ้นให้เลือกอัตโนมัติเมื่อบันทึกการส่งครั้งต่อไป</p>
        <div class="ship-table-wrap"><table class="ship-table">
          <thead><tr><th class="l">ผู้รับซื้อ</th><th>รอบ</th><th>ปริมาณ (${b})</th><th>รายได้ (บาท)</th><th>ราคาเฉลี่ย (บาท/${b})</th><th>ส่งล่าสุด</th></tr></thead>
          <tbody>${buyersHtml}</tbody>
        </table></div>
      </section>
    </section>`;
}

/* ---------- ฟอร์มบันทึก/แก้ไขการส่ง ---------- */
function shipFindRound(key, id){
  const v = SHIP_CFG[key].view();
  return v ? v.rounds.find(r => r.ID === id) : null;
}

function shipOpenForm(key, id){
  if (!requireSession()) return;
  const cfg = SHIP_CFG[key], v = cfg.view();
  if (!v){ alert('กำลังโหลดข้อมูล กรุณารอสักครู่แล้วลองใหม่'); return; }
  const row = id ? shipFindRound(key, id) : null;
  document.getElementById('shipKey').value = key;
  document.getElementById('shipId').value = row ? row.ID : '';
  document.getElementById('shipModalTitle').textContent = (row ? 'แก้ไข' : 'บันทึก') + cfg.formTitle;
  document.getElementById('shipBuyerLabel').textContent = cfg.buyerLabel;
  document.getElementById('shipDate').value = row ? row.Date : todayIso();
  document.getElementById('shipBuyer').value = row ? row.Buyer : '';
  document.getElementById('shipQty').value = row ? row.Quantity : '';
  document.getElementById('shipUnitPrice').value = row ? row.UnitPrice : '';
  document.getElementById('shipAmount').value = row ? row.Amount : '';
  document.getElementById('shipNote').value = row ? (row.Note || '') : '';
  document.getElementById('shipError').classList.add('hidden');

  const unitSel = document.getElementById('shipUnit');
  unitSel.innerHTML = cfg.units.map(u => `<option value="${u}">${u}</option>`).join('');
  unitSel.value = row ? row.Unit : cfg.units[0];
  document.getElementById('shipUnitWrap').classList.toggle('hidden', cfg.units.length < 2);

  // รายชื่อผู้รับซื้อที่มีอยู่แล้วในระบบ → ขึ้นให้เลือกอัตโนมัติ (datalist + ปุ่มลัด)
  const opts = v.buyerOptions || [];
  document.getElementById('shipBuyerList').innerHTML = opts.map(o => `<option value="${escapeHtml(o.BuyerName)}"></option>`).join('');
  document.getElementById('shipBuyerChips').innerHTML = opts.slice(0, 6).map(o =>
    `<button type="button" class="ship-chip" data-name="${escapeHtml(o.BuyerName)}">${escapeHtml(o.BuyerName)}</button>`).join('');
  document.querySelectorAll('#shipBuyerChips .ship-chip').forEach(b => b.onclick = () => {
    document.getElementById('shipBuyer').value = b.dataset.name;
    shipBuyerHint();
  });
  shipUpdateLabels();
  shipBuyerHint();
  openModal('modalShip');
}

function shipUpdateLabels(){
  const cfg = SHIP_CFG[document.getElementById('shipKey').value];
  if (!cfg) return;
  const unit = document.getElementById('shipUnit').value || cfg.units[0];
  document.getElementById('shipQtyLabel').textContent = `จำนวน (${unit})`;
  document.getElementById('shipPriceLabel').textContent = `ราคาต่อ${unit} (บาท)`;
}

function shipBuyerHint(){
  const cfg = SHIP_CFG[document.getElementById('shipKey').value];
  const hint = document.getElementById('shipBuyerHint');
  const name = document.getElementById('shipBuyer').value.trim();
  hint.className = 'ship-hint';
  if (!cfg || !name){ hint.textContent = ''; return; }
  const v = cfg.view();
  const key = buyerKeyJs(name);
  const hit = ((v && v.buyerOptions) || []).find(o => o.BuyerKey === key);
  if (hit && hit.BuyerName === name){
    hint.textContent = `✓ มีผู้รับซื้อรายนี้ในระบบแล้ว (เคยส่ง ${hit.Rounds} รอบ)`; hint.classList.add('ok');
  } else if (hit){
    hint.textContent = `✓ ตรงกับผู้รับซื้อในระบบ: "${hit.BuyerName}" — ระบบจะใช้ชื่อนี้ให้อัตโนมัติ`; hint.classList.add('ok');
  } else {
    hint.textContent = '🆕 ผู้รับซื้อรายใหม่ — ระบบจะเพิ่มเข้าทะเบียนผู้รับซื้อให้อัตโนมัติเมื่อบันทึก'; hint.classList.add('new');
  }
}

/** คำนวณ จำนวนเงินรวม ↔ ราคาต่อหน่วย อัตโนมัติ (กรอกอย่างใดอย่างหนึ่งได้) */
function shipRecalc(source){
  const cfg = SHIP_CFG[document.getElementById('shipKey').value];
  if (!cfg) return;
  const q = Number(document.getElementById('shipQty').value) || 0;
  const priceEl = document.getElementById('shipUnitPrice'), amountEl = document.getElementById('shipAmount');
  const r2 = n => Math.round(n * 100) / 100;
  if (source === 'amount'){
    if (q > 0 && amountEl.value !== '') priceEl.value = r2(Number(amountEl.value) / q);
  } else if (q > 0 && priceEl.value !== ''){
    amountEl.value = r2(q * Number(priceEl.value));
  }
  // แสดงราคาต่อหน่วยฐาน เมื่อส่งเป็นหน่วยอื่น (เช่น ปี๊บ → บาท/ลิตร)
  const unit = document.getElementById('shipUnit').value;
  const calc = document.getElementById('shipCalc');
  const v = cfg.view();
  if (unit && unit !== cfg.base && v && v.settings && q > 0 && amountEl.value !== ''){
    const liters = q * v.settings.litersPerCan;
    calc.textContent = `≈ ${shipNum(liters)} ${cfg.base} • ราคาเฉลี่ย ${shipNum(Number(amountEl.value) / liters)} บาท/${cfg.base} (1 ${unit} = ${v.settings.litersPerCan} ${cfg.base})`;
  } else {
    calc.textContent = '💡 กรอก "ราคาต่อหน่วย" ระบบคำนวณจำนวนเงินรวมให้ หรือกรอก "จำนวนเงินรวม" ระบบคำนวณราคาต่อหน่วยให้ (ราคาแต่ละรอบไม่เท่ากัน บันทึกแยกตามรอบ)';
  }
}

function shipSave(){
  if (!requireSession()) return;
  const key = document.getElementById('shipKey').value, cfg = SHIP_CFG[key];
  const id = document.getElementById('shipId').value;
  const errEl = document.getElementById('shipError');
  errEl.classList.add('hidden');
  const priceRaw = document.getElementById('shipUnitPrice').value, amountRaw = document.getElementById('shipAmount').value;
  const f = {
    date: document.getElementById('shipDate').value,
    buyer: document.getElementById('shipBuyer').value.trim(),
    qty: Number(document.getElementById('shipQty').value) || 0,
    unit: document.getElementById('shipUnit').value || cfg.units[0],
    unitPrice: priceRaw === '' ? '' : Number(priceRaw),
    amount: amountRaw === '' ? '' : Number(amountRaw),
    note: document.getElementById('shipNote').value.trim()
  };
  const fail = m => { errEl.textContent = m; errEl.classList.remove('hidden'); };
  if (!f.date) return fail('กรุณาเลือกวันที่ส่ง');
  if (!f.buyer) return fail('กรุณากรอกชื่อ' + cfg.buyerLabel);
  if (f.qty <= 0) return fail('กรุณาระบุจำนวนให้ถูกต้อง');
  if (f.unitPrice === '' && f.amount === '') return fail('กรุณาระบุราคาต่อหน่วย หรือจำนวนเงินรวม (ถ้าไม่มีรายได้ให้ใส่ 0)');
  const { departmentId, pin } = state.session;
  const run = google.script.run
    .withSuccessHandler(() => { closeModals(); cfg.reload(); })
    .withFailureHandler(err => fail(err.message || String(err)));
  if (id) run[cfg.api.update](departmentId, pin, id, cfg.payload(f));
  else run[cfg.api.add](departmentId, pin, cfg.payload(f));
}

function shipDelete(key, id){
  if (!requireSession()) return;
  if (!confirm('ยืนยันลบรายการส่งนี้?')) return;
  const cfg = SHIP_CFG[key], { departmentId, pin } = state.session;
  google.script.run.withSuccessHandler(() => cfg.reload()).withFailureHandler(alertErr)[cfg.api.del](departmentId, pin, id);
}

/* ---------- ส่งออก Excel / PDF ---------- */
function shipExportExcel(key){
  const cfg = SHIP_CFG[key], v = cfg.view();
  if (!v || (!v.rounds.length && !v.allTime.rounds)){ alert('ยังไม่มีข้อมูลการส่งให้ส่งออก'); return; }
  const b = cfg.base;
  const wb = XLSX.utils.book_new();
  const rounds = v.rounds.map(r => ({
    'วันที่ส่ง': fmtDate(r.Date), [cfg.buyerLabel]: r.Buyer, 'จำนวน': r.Quantity, 'หน่วย': r.Unit,
    [`ปริมาณ (${b})`]: r.Base, 'ราคาต่อหน่วยที่ส่ง (บาท)': r.UnitPrice, [`ราคา (บาท/${b})`]: r.PricePerBase,
    'จำนวนเงิน (บาท)': r.Amount, 'หมายเหตุ': r.Note || ''
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rounds.length ? rounds : [{ 'หมายเหตุ': 'ไม่มีรายการในปีนี้' }]), `รอบการส่ง ${v.year + 543}`);
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(v.yearly.map(y => ({
    'ปี พ.ศ.': y.year + 543, 'จำนวนรอบ': y.rounds, [`ปริมาณ (${b})`]: y.qty, 'รายได้ (บาท)': y.amount,
    [`ราคาเฉลี่ย (บาท/${b})`]: y.avgPrice, 'ราคาต่ำสุด': y.minPrice, 'ราคาสูงสุด': y.maxPrice
  }))), 'สรุปรายปี');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(v.buyers.map(x => ({
    'ผู้รับซื้อ': x.BuyerName, 'จำนวนรอบ': x.rounds, [`ปริมาณ (${b})`]: x.qty, 'รายได้ (บาท)': x.amount,
    [`ราคาเฉลี่ย (บาท/${b})`]: x.avgPrice, 'ส่งล่าสุด': x.lastDate ? fmtDate(x.lastDate) : ''
  }))), 'ทะเบียนผู้รับซื้อ');
  XLSX.writeFile(wb, `${cfg.fileName}_การส่งรายรอบ_${v.year}_${todayStr()}.xlsx`);
}

async function shipExportPDF(key){
  const cfg = SHIP_CFG[key], v = cfg.view();
  if (!v){ alert('ไม่มีข้อมูลให้ส่งออก กรุณารอให้โหลดข้อมูลเสร็จแล้วลองใหม่'); return; }
  try {
    await printPages(shipPdfPages(cfg, v));
  } catch (err) { alertErr(err); }
}

function shipPdfPages(cfg, v){
  const b = cfg.base, yr = v.year + 543, at = v.allTime, ys = v.yearStats;
  const multiUnit = cfg.units.length > 1;
  const kpi = `
    <div class="kpi-card"><div class="kpi-num">${shipNum(ys.rounds)}</div><div class="kpi-label">รอบที่ส่ง ปี ${yr}</div></div>
    <div class="kpi-card"><div class="kpi-num">${shipNum(ys.qty)}</div><div class="kpi-label">ปริมาณ (${b}) ปี ${yr}</div></div>
    <div class="kpi-card"><div class="kpi-num">${shipNum(ys.amount)}</div><div class="kpi-label">รายได้ปี ${yr} (บาท)</div></div>
    <div class="kpi-card"><div class="kpi-num">${shipNum(ys.avgPrice)}</div><div class="kpi-label">ราคาเฉลี่ย (บาท/${b})</div></div>
    <div class="kpi-card"><div class="kpi-num">${shipNum(at.rounds)}</div><div class="kpi-label">รอบสะสม</div></div>
    <div class="kpi-card"><div class="kpi-num">${shipNum(at.amount)}</div><div class="kpi-label">รายได้สะสม (บาท)</div></div>`;
  const th = s => `<th style="text-align:right;">${s}</th>`;
  const yearly = v.yearly.map(y => `<tr><td>${y.year + 543}</td><td style="text-align:right;">${shipNum(y.rounds)}</td><td style="text-align:right;">${shipNum(y.qty)}</td><td style="text-align:right;">${shipNum(y.amount)}</td><td style="text-align:right;">${shipNum(y.avgPrice)}</td><td style="text-align:right;">${y.minPrice ? shipNum(y.minPrice) : '-'}</td><td style="text-align:right;">${y.maxPrice ? shipNum(y.maxPrice) : '-'}</td></tr>`).join('');
  const buyers = v.buyers.slice(0, 10).map(x => `<tr><td>${escapeHtml(x.BuyerName)}</td><td style="text-align:right;">${shipNum(x.rounds)}</td><td style="text-align:right;">${shipNum(x.qty)}</td><td style="text-align:right;">${shipNum(x.amount)}</td><td style="text-align:right;">${shipNum(x.avgPrice)}</td></tr>`).join('');
  const pages = [`
    ${rpHeader(`${cfg.icon} ${cfg.projectName} — ${cfg.title}`, `ปี พ.ศ. ${yr} • พิมพ์เมื่อ ${todayStrThai()}`)}
    <div class="kpi-row print-kpi-row">${kpi}</div>
    <table class="print-table" style="margin-top:8px;">
      <thead><tr><th>ปี พ.ศ.</th>${th('รอบ')}${th('ปริมาณ (' + b + ')')}${th('รายได้ (บาท)')}${th('ราคาเฉลี่ย (บาท/' + b + ')')}${th('ต่ำสุด')}${th('สูงสุด')}</tr></thead>
      <tbody>${yearly || '<tr><td colspan="7">ยังไม่มีข้อมูล</td></tr>'}</tbody>
    </table>
    <table class="print-table" style="margin-top:10px;">
      <thead><tr><th>ผู้รับซื้อ (สะสม)</th>${th('รอบ')}${th('ปริมาณ (' + b + ')')}${th('รายได้ (บาท)')}${th('ราคาเฉลี่ย (บาท/' + b + ')')}</tr></thead>
      <tbody>${buyers || '<tr><td colspan="5">ยังไม่มีข้อมูล</td></tr>'}</tbody>
    </table>`];
  chunkArray(v.rounds, 15).forEach((chunk, ci, all) => {
    const rows = chunk.map(r => `<tr>
      <td>${fmtDate(r.Date)}</td><td>${escapeHtml(r.Buyer)}</td>
      <td style="text-align:right;">${shipNum(r.Quantity)} ${escapeHtml(r.Unit)}${r.Unit !== b ? ` (${shipNum(r.Base)} ${b})` : ''}</td>
      ${multiUnit ? `<td style="text-align:right;">${shipNum(r.UnitPrice)}</td>` : ''}
      <td style="text-align:right;">${shipNum(r.PricePerBase)}</td><td style="text-align:right;">${shipNum(r.Amount)}</td><td>${escapeHtml(r.Note || '')}</td></tr>`).join('');
    pages.push(`
      ${rpHeader(`🧾 รายการส่งรายรอบ — ${cfg.projectName}`, `ปี พ.ศ. ${yr} • ส่วนที่ ${ci + 1}/${all.length}`)}
      <table class="print-table">
        <thead><tr><th>วันที่ส่ง</th><th>${cfg.buyerLabel}</th>${th('จำนวน')}${multiUnit ? th('ราคา/หน่วยที่ส่ง') : ''}${th('ราคา (บาท/' + b + ')')}${th('จำนวนเงิน (บาท)')}<th>หมายเหตุ</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>`);
  });
  return pages;
}

/* ============================================================
   โครงการ "ปฏิทินเก่าเราขอ" (บริจาคปฏิทินเก่าทำอักษรเบรลล์ นับเป็นน้ำหนัก)
   ============================================================ */
state.cal = { view: null, year: null, loaded: false, showAllRank: false };
const CAL_TYPE_COLOR = { 'หน่วยงาน': '#d03f7e', 'เจ้าหน้าที่': '#3f7fbf', 'บริษัท/องค์กรภายนอก': '#e8a33d' };
function calTypeColor(t){ return CAL_TYPE_COLOR[t] || '#6b7570'; }

function bindCalendarEvents(){
  document.getElementById('btnCalAdd').onclick = () => calOpenForm();
  bindCalSubmitEvents();
  document.getElementById('btnCalSave').onclick = calSave;
  document.getElementById('btnCalExportExcel').onclick = calExportExcel;
  document.getElementById('btnCalExportPdf').onclick = calExportPDF;
  document.getElementById('calYearPrev').onclick = () => calYear(-1);
  document.getElementById('calYearNext').onclick = () => calYear(1);
  document.getElementById('calfType').onchange = calUpdateDonorList;
  document.getElementById('calfName').oninput = calNameHint;
  document.getElementById('calfWeight').oninput = calImpactHint;
}

function loadCalendar(){
  google.script.run.withSuccessHandler(v => {
    state.cal.view = v; state.cal.year = v.year; state.cal.loaded = true;
    renderCalendar();
    if (state.activeTab === 'calendar') sumRefresh('calendar');
  }).withFailureHandler(err => {
    document.getElementById('calKpiRow').innerHTML = '<div class="empty">โหลดข้อมูลไม่สำเร็จ: ' + escapeHtml(err.message || err) + '</div>';
  }).getCalendarOverview(state.cal.year);
}

function calYear(delta){
  const v = state.cal.view;
  if (!v) return;
  state.cal.year = v.year + delta;
  loadCalendar();
}

function renderCalendar(){
  const v = state.cal.view;
  if (!v) return;
  const isAdmin = !!state.session;
  const yr = v.year + 543, ys = v.yearStats, at = v.allTime;
  document.getElementById('calYearLabel').textContent = 'ปี พ.ศ. ' + yr;
  document.getElementById('calNote').innerHTML =
    `💡 ปฏิทินเก่าที่รับบริจาคจะส่งต่อไปจัดทำ<b>อักษรเบรลล์ให้ผู้พิการทางสายตา</b> • นับเป็นน้ำหนัก: กระดาษ 1 ตัน ช่วยรักษาต้นไม้ได้ประมาณ ${v.settings.treesPerTon} ต้น และกระดาษ 1 กก. ลด CO2 ได้ประมาณ ${v.settings.co2PerKg} กก. ` +
    `(ค่าประมาณ ปรับได้ที่ชีต EnvironmentalSettings)`;

  const donorsByType = {};
  v.typeAll.forEach(t => { donorsByType[t.type] = t.donors; });
  document.getElementById('calKpiRow').innerHTML = [
    shipKpiCard(shipNum(at.totalKg), 'น้ำหนักปฏิทินที่รับบริจาคสะสม (กก.)', `ปี ${yr}: ${shipNum(ys.kg)} กก.`),
    shipKpiCard(shipNum(at.rounds), 'รอบที่รับบริจาค (สะสม)', `ปี ${yr}: ${shipNum(ys.rounds)} รอบ`),
    shipKpiCard(shipNum(at.donors), 'ผู้ร่วมบริจาค (ราย)', v.donorTypes.map(t => `${t.replace('บริษัท/องค์กรภายนอก', 'ภายนอก')} ${shipNum(donorsByType[t] || 0)}`).join(' • ')),
    shipKpiCard('🌳 ' + shipNum(at.treesSaved), 'ต้นไม้ที่ช่วยรักษาได้ (ต้น)', `ปี ${yr}: ${shipNum(ys.treesSaved)} ต้น`),
    shipKpiCard(shipNum(at.co2SavedKg), 'CO2 ที่ลดได้ (กก.)', `ปี ${yr}: ${shipNum(ys.co2SavedKg)} กก.`),
    shipKpiCard(at.lastDate ? fmtDate(at.lastDate) : '-', 'รับบริจาคล่าสุด', at.donations ? `ทั้งหมด ${shipNum(at.donations)} ครั้ง` : 'ยังไม่มีการบริจาค')
  ].join('');

  // กราฟรายเดือน
  document.getElementById('calTrendSubtitle').textContent = `ปี พ.ศ. ${yr} • รวม ${shipNum(ys.kg)} กก. จาก ${ys.donations} ครั้ง`;
  document.getElementById('calTrendChart').innerHTML = shipBars(v.monthly.map(m => m.kg), THAI_MONTHS,
    v.monthly.map((m, i) => `${THAI_MONTHS[i]}: ${shipNum(m.kg)} กก. (${m.donations} ครั้ง)`), x => shipNum(x));

  // การ์ดแต่ละรอบ
  document.getElementById('calRoundsSubtitle').textContent = `ปี พ.ศ. ${yr} • ${v.rounds.length} รอบ`;
  document.getElementById('calRounds').innerHTML = v.rounds.length ? v.rounds.map(r => `
    <div class="cal-round-card">
      <h4>${escapeHtml(r.RoundName)}</h4>
      <div class="kg">${shipNum(r.kg)} กก.</div>
      <div class="meta">${fmtDate(r.firstDate)}${r.lastDate !== r.firstDate ? ' – ' + fmtDate(r.lastDate) : ''} • ${r.donors} ผู้บริจาค • 🌳 ${shipNum(r.treesSaved)} ต้น</div>
      <div class="types">${v.donorTypes.map(t => `<span class="dot" style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${calTypeColor(t)};margin-right:4px;"></span>${escapeHtml(t)}: <b>${shipNum(r.byType[t] || 0)}</b> กก.`).join('<br>')}</div>
    </div>`).join('') : '<div class="empty">ยังไม่มีการบริจาคในปีนี้</div>';

  // สัดส่วนตามประเภท (ปีที่เลือก)
  const typeRows = v.typeYear.filter(t => t.kg > 0);
  document.getElementById('calTypeSubtitle').textContent = `ปี พ.ศ. ${yr} • รวม ${shipNum(ys.kg)} กก.`;
  document.getElementById('calTypePie').innerHTML = typeRows.length
    ? buildPieSvg(typeRows.map(t => [t.type, t.kg]), ys.kg, label => calTypeColor(label), 170) : '<div class="empty">ยังไม่มีข้อมูล</div>';
  document.getElementById('calTypeLegend').innerHTML = v.typeYear.map(t => {
    const pct = ys.kg ? Math.round(t.kg / ys.kg * 100) : 0;
    return `<div><span class="dot" style="display:inline-block;background:${calTypeColor(t.type)};"></span><b>${escapeHtml(t.type)}</b> — ${shipNum(t.kg)} กก. (${pct}%) • ${t.donors} ราย • ${t.donations} ครั้ง</div>`;
  }).join('');

  // อันดับผู้บริจาค
  const lb = v.donorLeaderboard;
  const shown = state.cal.showAllRank ? lb : lb.slice(0, 15);
  const maxKg = Math.max(1, ...lb.map(d => d.kg));
  document.getElementById('calRankSubtitle').textContent = `${lb.length} ราย • เรียงตามน้ำหนักสะสม`;
  document.getElementById('calRank').innerHTML = lb.length ? shown.map(d => `
    <div class="cal-rank-row rank-${d.rank}">
      <div class="cal-rank-num">${d.rank}</div>
      <div class="cal-rank-name" title="${escapeHtml(d.DonorName)}">${escapeHtml(d.DonorName)}<small><span class="cal-type-badge" style="background:${calTypeColor(d.DonorType)}">${escapeHtml(d.DonorType)}</span></small></div>
      <div class="cal-rank-track"><span class="cal-rank-fill" style="width:${Math.round(d.kg / maxKg * 100)}%;"></span></div>
      <div class="cal-rank-val"><b>${shipNum(d.kg)}</b> กก.<br>${d.times} ครั้ง • ${d.rounds} รอบ</div>
    </div>`).join('') + (lb.length > 15
      ? `<p style="text-align:center;margin:10px 0 0;"><button class="btn btn-outline" onclick="state.cal.showAllRank=!state.cal.showAllRank;renderCalendar();">${state.cal.showAllRank ? 'แสดงเฉพาะ 15 อันดับแรก' : 'แสดงทั้งหมด ' + lb.length + ' ราย'}</button></p>` : '')
    : '<div class="empty">ยังไม่มีผู้ร่วมบริจาค</div>';

  // รายการบริจาค
  document.getElementById('calDonationsSubtitle').textContent = `ปี พ.ศ. ${yr} • ${v.donations.length} รายการ`;
  document.getElementById('calDonationRows').innerHTML = v.donations.length ? v.donations.map(d => `<tr>
      <td class="l">${fmtDate(d.DonationDate)}</td><td class="l">${escapeHtml(d.RoundName)}</td>
      <td class="l"><span class="cal-type-badge" style="background:${calTypeColor(d.DonorType)}">${escapeHtml(d.DonorType)}</span></td>
      <td class="l">${escapeHtml(d.DonorName)}</td><td><b>${shipNum(d.WeightKg)}</b></td><td class="note">${escapeHtml(d.Note || '')}</td>
      <td class="ship-row-actions">${isAdmin ? `<button onclick="calOpenForm('${d.DonationID}')">✏️ แก้ไข</button><button onclick="calDelete('${d.DonationID}')">🗑️ ลบ</button>` : ''}</td>
    </tr>`).join('') : '<tr><td colspan="7" class="empty">ยังไม่มีรายการบริจาคในปีนี้</td></tr>';

  document.getElementById('calYearlyRows').innerHTML = v.yearly.length ? v.yearly.map(y => `<tr>
      <td class="l">${y.year + 543}</td><td>${shipNum(y.rounds)}</td><td>${shipNum(y.donors)}</td><td>${shipNum(y.kg)}</td>
      <td>${shipNum(y.treesSaved)}</td><td>${shipNum(y.co2SavedKg)}</td></tr>`).join('')
    : '<tr><td colspan="6" class="empty">ยังไม่มีข้อมูล</td></tr>';
}

/* ---------- ฟอร์มบันทึกการบริจาค (ผู้ดูแลระบบ) ---------- */
function calOpenForm(id){
  if (!requireSession()) return;
  const v = state.cal.view;
  if (!v){ alert('กำลังโหลดข้อมูล กรุณารอสักครู่แล้วลองใหม่'); return; }
  const row = id ? v.donations.find(d => d.DonationID === id) : null;
  document.getElementById('calfId').value = row ? row.DonationID : '';
  document.getElementById('calModalTitle').textContent = row ? 'แก้ไขการบริจาคปฏิทินเก่า' : 'บันทึกการบริจาคปฏิทินเก่า';
  document.getElementById('calfDate').value = row ? row.DonationDate : todayIso();
  const typeSel = document.getElementById('calfType');
  typeSel.innerHTML = v.donorTypes.map(t => `<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`).join('');
  typeSel.value = row ? row.DonorType : v.donorTypes[0];
  document.getElementById('calRoundList').innerHTML = v.roundOptions.map(r => `<option value="${escapeHtml(r)}"></option>`).join('');
  // รอบตั้งต้น: รอบล่าสุดของปีนี้ (บันทึกผู้บริจาคหลายรายในรอบเดียวกันได้เร็ว) ถ้ายังไม่มีให้เสนอรอบที่ 1
  const defaultRound = v.rounds.length ? v.rounds[0].RoundName : `รอบที่ 1/${v.year + 543}`;
  document.getElementById('calfRound').value = row ? row.RoundName : defaultRound;
  document.getElementById('calfName').value = row ? row.DonorName : '';
  document.getElementById('calfWeight').value = row ? row.WeightKg : '';
  document.getElementById('calfNote').value = row ? (row.Note || '') : '';
  document.getElementById('calfError').classList.add('hidden');
  calUpdateDonorList();
  calNameHint();
  calImpactHint();
  openModal('modalCalDonation');
}

function calUpdateDonorList(){
  const v = state.cal.view;
  if (!v) return;
  const type = document.getElementById('calfType').value;
  document.getElementById('calDonorList').innerHTML = ((v.donorOptions && v.donorOptions[type]) || []).map(n => `<option value="${escapeHtml(n)}"></option>`).join('');
}

function calNameHint(){
  const v = state.cal.view, hint = document.getElementById('calfNameHint');
  const name = document.getElementById('calfName').value.trim();
  hint.className = 'ship-hint';
  if (!v || !name){ hint.textContent = ''; return; }
  const key = buyerKeyJs(name);
  const hit = v.donorLeaderboard.find(d => buyerKeyJs(d.DonorName) === key);
  if (hit){
    hint.textContent = `✓ เคยร่วมบริจาคแล้ว: "${hit.DonorName}" (สะสม ${shipNum(hit.kg)} กก.) — ระบบจะรวมยอดให้อัตโนมัติ`; hint.classList.add('ok');
  } else {
    hint.textContent = '🆕 ผู้บริจาครายใหม่'; hint.classList.add('new');
  }
}

function calImpactHint(){
  const v = state.cal.view, el = document.getElementById('calfImpact');
  const kg = Number(document.getElementById('calfWeight').value) || 0;
  el.className = 'ship-hint ok';
  el.textContent = (v && kg > 0)
    ? `🌳 เทียบเท่าช่วยรักษาต้นไม้ประมาณ ${shipNum(kg / 1000 * v.settings.treesPerTon, 3)} ต้น • ลด CO2 ประมาณ ${shipNum(kg * v.settings.co2PerKg)} กก.` : '';
}

function calSave(){
  if (!requireSession()) return;
  const errEl = document.getElementById('calfError');
  errEl.classList.add('hidden');
  const id = document.getElementById('calfId').value;
  const data = {
    DonationDate: document.getElementById('calfDate').value,
    RoundName: document.getElementById('calfRound').value.trim(),
    DonorType: document.getElementById('calfType').value,
    DonorName: document.getElementById('calfName').value.trim(),
    WeightKg: Number(document.getElementById('calfWeight').value) || 0,
    Note: document.getElementById('calfNote').value.trim()
  };
  const fail = m => { errEl.textContent = m; errEl.classList.remove('hidden'); };
  if (!data.DonationDate) return fail('กรุณาเลือกวันที่รับบริจาค');
  if (!data.DonorName) return fail('กรุณากรอกชื่อผู้บริจาค');
  if (data.WeightKg <= 0) return fail('กรุณาระบุน้ำหนักเป็นกิโลกรัมให้ถูกต้อง');
  const { departmentId, pin } = state.session;
  const run = google.script.run
    .withSuccessHandler(() => { closeModals(); loadCalendar(); })
    .withFailureHandler(err => fail(err.message || String(err)));
  if (id) run.updateCalendarDonation(departmentId, pin, id, data);
  else run.addCalendarDonation(departmentId, pin, data);
}

function calDelete(id){
  if (!requireSession()) return;
  if (!confirm('ยืนยันลบรายการบริจาคนี้?')) return;
  const { departmentId, pin } = state.session;
  google.script.run.withSuccessHandler(() => loadCalendar()).withFailureHandler(alertErr).deleteCalendarDonation(departmentId, pin, id);
}

function calExportExcel(){
  const v = state.cal.view;
  if (!v || !v.allTime.donations){ alert('ยังไม่มีข้อมูลการบริจาคให้ส่งออก'); return; }
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(v.donations.length ? v.donations.map(d => ({
    'วันที่': fmtDate(d.DonationDate), 'รอบ': d.RoundName, 'ประเภทผู้บริจาค': d.DonorType, 'ผู้บริจาค': d.DonorName,
    'น้ำหนัก (กก.)': d.WeightKg, 'หมายเหตุ': d.Note || ''
  })) : [{ 'หมายเหตุ': 'ไม่มีรายการในปีนี้' }]), `การบริจาค ${v.year + 543}`);
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(v.rounds.map(r => ({
    'รอบ': r.RoundName, 'วันที่เริ่ม': fmtDate(r.firstDate), 'วันที่สิ้นสุด': fmtDate(r.lastDate), 'ผู้บริจาค (ราย)': r.donors,
    'น้ำหนักรวม (กก.)': r.kg, 'หน่วยงาน (กก.)': r.byType['หน่วยงาน'] || 0, 'เจ้าหน้าที่ (กก.)': r.byType['เจ้าหน้าที่'] || 0,
    'บริษัท/องค์กรภายนอก (กก.)': r.byType['บริษัท/องค์กรภายนอก'] || 0, 'ต้นไม้ที่ช่วยรักษา (ต้น)': r.treesSaved
  }))), 'สรุปรายรอบ');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(v.donorLeaderboard.map(d => ({
    'อันดับ': d.rank, 'ผู้บริจาค': d.DonorName, 'ประเภท': d.DonorType, 'น้ำหนักสะสม (กก.)': d.kg, 'จำนวนครั้ง': d.times, 'จำนวนรอบ': d.rounds
  }))), 'อันดับผู้บริจาค');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(v.yearly.map(y => ({
    'ปี พ.ศ.': y.year + 543, 'รอบ': y.rounds, 'ผู้บริจาค (ราย)': y.donors, 'น้ำหนัก (กก.)': y.kg,
    'ต้นไม้ที่ช่วยรักษา (ต้น)': y.treesSaved, 'CO2 ที่ลดได้ (กก.)': y.co2SavedKg
  }))), 'สรุปรายปี');
  XLSX.writeFile(wb, `โครงการปฏิทินเก่าเราขอ_${v.year}_${todayStr()}.xlsx`);
}

          <tbody>${chunk.map(d => `<tr><td>${fmtDate(d.DonationDate)}</td><td>${escapeHtml(d.RoundName)}</td><td>${escapeHtml(d.DonorType)}</td><td>${escapeHtml(d.DonorName)}</td><td style="text-align:right;">${shipNum(d.WeightKg)}</td><td>${escapeHtml(d.Note || '')}</td></tr>`).join('')}</tbody>

/* ============================================================
   สรุปรายเดือน • รายปี • สะสม (รูปแบบเดียวกันทุกโครงการ)
   ข้อมูลมาจาก getPeriodSummary(key, year) — คำนวณจากข้อมูลที่บันทึกไว้จริงในแต่ละชีต
   ============================================================ */
const SUM_MONTHS_FULL = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const SUM_CFG = {
  ftf:       { mount: 'sumMountFtf', name: 'ทอดไม่ทิ้ง',           icon: '🛢️', c: '#c17f2b', c7: '#8a5a1b', c1: '#fbe9d2', main: 'liters',  distinct: ['donors'] },
  paperless: { mount: 'sumMountPl',  name: 'Paperless',            icon: '📄', c: '#2f7fc4', c7: '#1d5fa0', c1: '#e5f0fb', main: 'sheets',  distinct: ['depts'] },
  cartridge: { mount: 'sumMountCtg', name: 'ตลับหมึกเก่าเราขอ',    icon: '🖨️', c: '#6c3fb5', c7: '#4c2a82', c1: '#efe7fb', main: 'soldQty', distinct: [] },
  kitchen:   { mount: 'sumMountKit', name: 'จากครัวสู่ท้องฟ้า',     icon: '🍳', c: '#d9582a', c7: '#a8431a', c1: '#fde7dc', main: 'liters',  distinct: [] },
  calendar:  { mount: 'sumMountCal', name: 'ปฏิทินเก่าเราขอ',       icon: '📅', c: '#d03f7e', c7: '#a1275a', c1: '#fbe3ed', main: 'kg',      distinct: ['rounds', 'donors'] },
  share:     { mount: 'sumMountShr', name: 'คัดแยก แบ่งปัน',        icon: '♻️', c: '#128a88', c7: '#0b6e6e', c1: '#e0f5f3', main: 'value',   distinct: ['depts'] }
};
state.sum = {};

function sumSt(key){ return state.sum[key] || (state.sum[key] = { mode: 'month', year: null, data: null }); }
function sumCell(col, v){ return Number(v) ? shipNum(v, col.dec) : '<span class="sum-zero">–</span>'; }
function sumPlain(col, v){ return Number(v) ? shipNum(v, col.dec) : '-'; }
function sumHead(d, first){
  return `<tr><th>${first}</th>` + d.columns.map(c => `<th>${c.label}<small>${c.unit}</small></th>`).join('') + '</tr>';
}

function sumRefresh(key){
  const cfg = SUM_CFG[key], st = sumSt(key);
  const el = document.getElementById(cfg.mount);
  if (!el) return;
  if (!st.data) el.innerHTML = '<div class="loading">กำลังโหลดข้อมูล...</div>';
  google.script.run.withSuccessHandler(d => {
    st.data = d; st.year = d.year; sumRender(key);
  }).withFailureHandler(err => {
    el.innerHTML = '<div class="empty">โหลดสรุปไม่สำเร็จ: ' + escapeHtml(err.message || err) + '</div>';
  }).getPeriodSummary(key, st.year || undefined);
}

function sumSetMode(key, mode){ sumSt(key).mode = mode; sumRender(key); }
function sumYear(key, delta){
  const st = sumSt(key), ys = st.data.years.slice().sort((a, b) => a - b);
  const i = ys.indexOf(st.year) + delta;
  if (i < 0 || i >= ys.length) return;
  st.year = ys[i]; sumRefresh(key);
}

/** ตาราง 3 แบบ (ใช้ทั้งบนหน้าเว็บและตอนพิมพ์) */
function sumTableHtml(key, mode, cls){
  const cfg = SUM_CFG[key], d = sumSt(key).data, mainIdx = d.columns.findIndex(c => c.key === cfg.main);
  const main = d.columns[mainIdx];
  let rows = '', foot = '', head = '';
  if (mode === 'month'){
    const max = Math.max(0, ...d.monthly.map(m => Number(m[cfg.main]) || 0));
    head = sumHead(d, 'เดือน');
    rows = d.monthly.map(m => {
      const empty = d.columns.every(c => !Number(m[c.key]));
      return `<tr class="${empty ? 'sum-empty' : ''}"><td class="sum-lbl">${SUM_MONTHS_FULL[m.month - 1]} ${d.year + 543}</td>` +
        d.columns.map(c => {
          const bar = c.key === cfg.main && max > 0 && Number(m[c.key]) ? `<i class="sum-bar" style="width:${Math.max(3, (m[c.key] / max) * 100).toFixed(1)}%"></i>` : '';
          return `<td class="${c.key === cfg.main ? 'sum-main' : ''}">${bar}<span>${cls === 'print-table' ? sumPlain(c, m[c.key]) : sumCell(c, m[c.key])}</span></td>`;
        }).join('') + '</tr>';
    }).join('');
    foot = `<tr class="sum-foot"><td class="sum-lbl">รวมปี ${d.year + 543}</td>` + d.columns.map(c => `<td>${shipNum(d.yearTotal[c.key], c.dec)}</td>`).join('') + '</tr>';
  } else if (mode === 'year'){
    head = sumHead(d, 'ปี พ.ศ.');
    const max = Math.max(0, ...d.yearly.map(y => Number(y[cfg.main]) || 0));
    rows = d.yearly.map(y => `<tr><td class="sum-lbl">${y.year + 543}</td>` + d.columns.map(c => {
      const bar = c.key === cfg.main && max > 0 && Number(y[c.key]) ? `<i class="sum-bar" style="width:${Math.max(3, (y[c.key] / max) * 100).toFixed(1)}%"></i>` : '';
      return `<td class="${c.key === cfg.main ? 'sum-main' : ''}">${bar}<span>${cls === 'print-table' ? sumPlain(c, y[c.key]) : sumCell(c, y[c.key])}</span></td>`;
    }).join('') + '</tr>').join('');
    foot = `<tr class="sum-foot"><td class="sum-lbl">รวมสะสมทุกปี</td>` + d.columns.map(c => `<td>${shipNum(d.total[c.key], c.dec)}</td>`).join('') + '</tr>';
  } else {
    head = sumHead(d, 'สะสมถึงสิ้นปี พ.ศ.');
    rows = d.cumulative.map((y, i) => `<tr class="${i === 0 ? 'sum-latest' : ''}"><td class="sum-lbl">${y.year + 543}${i === 0 ? ' <em>(ล่าสุด)</em>' : ''}</td>` +
      d.columns.map(c => `<td class="${c.key === cfg.main ? 'sum-main' : ''}"><span>${cls === 'print-table' ? sumPlain(c, y[c.key]) : sumCell(c, y[c.key])}</span></td>`).join('') + '</tr>').join('');
  }
  if (!d.hasData) rows = `<tr><td colspan="${d.columns.length + 1}" class="empty">ยังไม่มีข้อมูลของโครงการนี้</td></tr>`, foot = '';
  return `<table class="${cls}"><thead>${head}</thead><tbody>${rows}</tbody>${foot ? '<tfoot>' + foot + '</tfoot>' : ''}</table>`;
}

function sumNote(key){
  const cfg = SUM_CFG[key], d = sumSt(key).data;
  const labels = d.columns.filter(c => cfg.distinct.indexOf(c.key) !== -1).map(c => '“' + c.label + '”');
  return labels.length ? `* คอลัมน์ ${labels.join(' และ ')} นับแบบไม่ซ้ำภายในช่วงเวลานั้น จึงอาจไม่เท่ากับผลบวกของแถวด้านบน` : '';
}

function sumRender(key){
  const cfg = SUM_CFG[key], st = sumSt(key), d = st.data;
  const el = document.getElementById(cfg.mount);
  if (!el || !d) return;
  const mode = st.mode;
  const tiles = (mode === 'month' ? d.yearTotal : d.total);
  const tileTitle = mode === 'month' ? `รวมปี ${d.year + 543}` : 'สะสมทั้งโครงการ';
  const desc = {
    month: `ยอดของแต่ละเดือนในปี ${d.year + 543} (นับตามวันที่บันทึกรายการ) • แถวล่างสุดคือยอดรวมทั้งปี`,
    year: 'ยอดรวมของแต่ละปีเรียงจากปีล่าสุด • แถวล่างสุดคือยอดสะสมทุกปีรวมกัน',
    cum: 'ยอดสะสมตั้งแต่เริ่มโครงการจนถึงสิ้นปีนั้นๆ (ปีล่าสุดเท่ากับยอดสะสมทั้งโครงการ)'
  }[mode];
  const ys = d.years.slice().sort((a, b) => a - b);
  const seg = (m, t) => `<button class="sum-seg-btn ${mode === m ? 'active' : ''}" onclick="sumSetMode('${key}','${m}')">${t}</button>`;
  const note = sumNote(key);
  el.innerHTML = `
    <section class="sum-card" style="--sc:${cfg.c}; --sc7:${cfg.c7}; --sc1:${cfg.c1};">
      <div class="sum-head">
        <div>
          <h3>${cfg.icon} สรุปผลโครงการ${cfg.name} — รายเดือน • รายปี • สะสม</h3>
          <p class="muted">${desc}</p>
        </div>
        <div class="sum-actions">
          <button class="btn btn-outline" onclick="sumExportExcel('${key}')">📊 Excel</button>
          <button class="btn btn-outline" onclick="sumExportPdf('${key}')">📄 PDF</button>
        </div>
      </div>
      <div class="sum-toolbar">
        <div class="sum-seg">${seg('month', '🗓️ รายเดือน')}${seg('year', '📅 รายปี')}${seg('cum', '📈 สะสม')}</div>
        ${mode === 'month' ? `<div class="year-nav">
          <button class="btn btn-icon" onclick="sumYear('${key}',-1)" ${d.year <= ys[0] ? 'disabled' : ''}>‹</button>
          <span class="year-label">ปี ${d.year + 543}</span>
          <button class="btn btn-icon" onclick="sumYear('${key}',1)" ${d.year >= ys[ys.length - 1] ? 'disabled' : ''}>›</button>
        </div>` : ''}
      </div>
      <div class="sum-tiles-title">${tileTitle}</div>
      <div class="sum-tiles">${d.columns.map(c => `

/* ============================================================
   ผู้ช่วยตอบคำถามอัตโนมัติ + สอบถามเจ้าหน้าที่ + กล่องข้อความผู้ดูแล
   ============================================================ */
const ASST = { open: false, busy: false, lastQ: '', started: false };
const ASST_START_CHIPS = ['มีโครงการอะไรบ้าง', 'วิธีบริจาคน้ำมันใช้แล้ว', 'บริษัทภายนอกร่วมโครงการได้ไหม', 'ผลลัพธ์ด้านสิ่งแวดล้อมรวม'];

function asstEl(id){ return document.getElementById(id); }
function asstScroll(){ const b = asstEl('asstBody'); b.scrollTop = b.scrollHeight; }
function asstChips(list){
  const box = asstEl('asstChips');
  box.innerHTML = (list || []).map(t => `<button type="button" class="asst-chip">${escapeHtml(t)}</button>`).join('');
  box.querySelectorAll('.asst-chip').forEach((b, i) => b.onclick = () => asstAsk(list[i]));
  asstScroll();
}
function asstAdd(role, text, opts){
  opts = opts || {};
  const d = document.createElement('div');
  d.className = 'asst-msg ' + role + (opts.warn ? ' warn' : '');
  d.textContent = text;
  if ((opts.tabs && opts.tabs.length) || opts.mail){
    const acts = document.createElement('div'); acts.className = 'asst-acts';
    (opts.tabs || []).forEach(t => {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'asst-act'; b.textContent = '➜ ' + t.label;
      b.onclick = () => { switchTab(t.tab); window.scrollTo({ top: 0, behavior: 'smooth' }); if (window.innerWidth < 720) asstToggle(false); };
      acts.appendChild(b);
    });
    if (opts.mail){
      const b = document.createElement('button'); b.type = 'button'; b.className = 'asst-act mail'; b.textContent = '✉️ ส่งอีเมลสอบถามเจ้าหน้าที่';
      b.onclick = () => openInquiry(ASST.lastQ);
      acts.appendChild(b);
    }
    d.appendChild(acts);
  }
  asstEl('asstBody').appendChild(d);
  asstScroll();
  return d;
}
function asstToggle(open){
  ASST.open = open === undefined ? !ASST.open : open;
  asstEl('asstPanel').classList.toggle('hidden', !ASST.open);
  asstEl('asstFab').style.display = ASST.open ? 'none' : '';
  if (ASST.open){
    if (!ASST.started){
      ASST.started = true;
      asstAdd('bot', 'สวัสดีครับ 🌱 ผมเป็นผู้ช่วยอัตโนมัติของระบบติดตามโครงการสิ่งแวดล้อมโรงพยาบาล ถามเรื่องโครงการ สถานะ วิธีเข้าร่วม/บริจาค หรือผลลัพธ์ด้านสิ่งแวดล้อมได้เลยครับ\n(ผมตอบเฉพาะเรื่องของระบบนี้ หากตอบไม่ได้ ส่งอีเมลสอบถามเจ้าหน้าที่ได้)');
      asstChips(ASST_START_CHIPS);
    }
    setTimeout(() => asstEl('asstInput').focus(), 50);
  }
}
function asstAsk(q){
  q = String(q || '').trim();
  if (!q || ASST.busy) return;
  ASST.busy = true; ASST.lastQ = q;
  asstAdd('me', q);
  asstEl('asstInput').value = '';
  asstChips([]);
  const typing = asstAdd('bot', '');
  typing.innerHTML = '<span class="asst-typing"><i></i><i></i><i></i></span>';
  google.script.run
    .withSuccessHandler(r => {
      ASST.busy = false; typing.remove();
      asstAdd('bot', r.answer, { tabs: r.tabs, mail: !!r.suggestEmail, warn: r.kind === 'offtopic' || r.kind === 'refused' });
      asstChips(r.followUps && r.followUps.length ? r.followUps : (r.kind === 'answer' ? [] : ASST_START_CHIPS.slice(0, 2)));
    })
    .withFailureHandler(err => {
      ASST.busy = false; typing.remove();
      asstAdd('bot', 'ขออภัยครับ ระบบขัดข้องชั่วคราว: ' + ((err && err.message) || err), { warn: true, mail: true });
    })
    .askAssistant(q);
}

function openInquiry(prefillQuestion){
  asstEl('inqWebsite').value = '';
  if (prefillQuestion) asstEl('inqQuestion').value = String(prefillQuestion);

    state.inqTopicsLoaded = true;

    }).getInquiryTopics();

function updateInquiryOrgLabel(){
  const ext = asstEl('inqType').value === 'บริษัท/องค์กรภายนอก';

function sendInquiry(){
  const err = asstEl('inqError'), ok = asstEl('inqOk'), btn = asstEl('btnInqSend');
  err.classList.add('hidden'); ok.classList.add('hidden');
  const data = {
    AskerType: asstEl('inqType').value, AskerName: asstEl('inqName').value.trim(), Organization: asstEl('inqOrg').value.trim(),
    Contact: asstEl('inqContact').value.trim(), Topic: asstEl('inqTopic').value, Question: asstEl('inqQuestion').value.trim(),
    website: asstEl('inqWebsite').value
  };
  const fail = m => { err.textContent = m; err.classList.remove('hidden'); };
  if (!data.AskerName) return fail('กรุณากรอกชื่อผู้สอบถาม');
  if (data.AskerType === 'บริษัท/องค์กรภายนอก' && !data.Organization) return fail('กรุณาระบุชื่อบริษัท/องค์กร');
  if (!data.Contact) return fail('กรุณากรอกช่องทางติดต่อกลับ (อีเมลหรือเบอร์โทร)');
  if (data.Question.length < 5) return fail('กรุณาพิมพ์คำถามให้ละเอียดขึ้นเล็กน้อย');
  btn.disabled = true; btn.textContent = 'กำลังส่ง...';
  google.script.run
    .withSuccessHandler(r => {
      btn.textContent = 'ส่งคำถาม';
      ok.textContent = '✅ ส่งคำถามเรียบร้อย (รหัส ' + r.id + ') เจ้าหน้าที่จะติดต่อกลับตามช่องทางที่ระบุ' + (r.emailed ? '' : ' — บันทึกในระบบแล้ว');
      ok.classList.remove('hidden');
      asstEl('inqQuestion').value = '';
      if (ASST.started) asstAdd('bot', '✅ ส่งคำถามถึงเจ้าหน้าที่แล้ว (รหัส ' + r.id + ') จะมีผู้ติดต่อกลับครับ');
    })
    .withFailureHandler(e => { btn.disabled = false; btn.textContent = 'ส่งคำถาม'; fail((e && e.message) || String(e)); })
    .submitInquiry(data);
}

function renderPhotoMount(el){

  const tiles = shown.map((p, i) => {
    const more = !expanded && i === MAXV - 1 && total > MAXV ? `<span class="ph-more">+${total - MAXV}</span>` : '';

        ${isAdmin ? '<button class="btn btn-primary ph-add" type="button">＋ เพิ่มรูปกิจกรรม</button>' : ''}
      </div></div>
    ${total ? `<div class="ph-grid ${cls}">${tiles}</div>` : '<div class="ph-empty">ยังไม่มีภาพกิจกรรม — กด "เพิ่มรูปกิจกรรม" เพื่อเริ่มอัปโหลด</div>'}

/* ---------- อัปโหลด ---------- */
function resizeImageFile(file, maxDim){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      let w = img.naturalWidth, h = img.naturalHeight; const r = Math.min(1, maxDim / Math.max(w, h));
      w = Math.round(w * r); h = Math.round(h * r);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); g.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('อ่านไฟล์รูปไม่ได้: ' + file.name)); };
    img.src = url;
  });
}
function openPhotoUpload(key){
  if (!requireSession()) return;
  PH.up = [];
  asstEl('phUpKey').value = key;
  asstEl('phUpTitle').textContent = (PHOTO_META[key] && PHOTO_META[key].title) || 'โครงการ';
  asstEl('phUpFiles').value = '';
  asstEl('phUpError').classList.add('hidden');
  renderPhotoUploadList();
  openModal('modalPhotoUpload');
}
function renderPhotoUploadList(){
  asstEl('phUpList').innerHTML = PH.up.map((u, i) => `<div class="ph-up-item"><img src="${u.data}" alt=""><span class="ph-up-st">${u.status}</span>
    ${u.status === 'รอ' ? `<button type="button" class="ph-up-rm" data-i="${i}" aria-label="เอาออก">✕</button>` : ''}
    <input type="text" class="ph-up-cap" data-i="${i}" maxlength="200" placeholder="คำอธิบายรูป" value="${escapeHtml(u.caption)}" ${u.status === 'รอ' ? '' : 'disabled'}></div>`).join('');
  asstEl('phUpList').querySelectorAll('.ph-up-cap').forEach(inp => inp.oninput = () => { PH.up[inp.dataset.i].caption = inp.value; });
  asstEl('phUpList').querySelectorAll('.ph-up-rm').forEach(b => b.onclick = () => { PH.up.splice(Number(b.dataset.i), 1); renderPhotoUploadList(); });
  asstEl('btnPhUpGo').disabled = !PH.up.some(u => u.status === 'รอ');
}
async function onPhotoFilesChosen(ev){
  const err = asstEl('phUpError'); err.classList.add('hidden');
  const files = Array.from(ev.target.files || []);
  for (const f of files){
    if (!/^image\/(jpeg|png|webp|gif)$/.test(f.type)){ err.textContent = 'ข้าม "' + f.name + '" — รองรับเฉพาะ JPG, PNG, WEBP, GIF'; err.classList.remove('hidden'); continue; }
    try { PH.up.push({ name: f.name, data: await resizeImageFile(f, 1600), caption: '', status: 'รอ' }); }
    catch (e) { err.textContent = e.message; err.classList.remove('hidden'); }
  }
  ev.target.value = '';
  renderPhotoUploadList();
}
async function startPhotoUpload(){
  if (!requireSession()) return;
  const key = asstEl('phUpKey').value, err = asstEl('phUpError'), go = asstEl('btnPhUpGo');
  err.classList.add('hidden'); go.disabled = true;
  let okCount = 0;
  for (const u of PH.up){
    if (u.status !== 'รอ') continue;
    u.status = 'กำลังส่ง'; renderPhotoUploadList(); asstEl('btnPhUpGo').disabled = true;
    try {
      await new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej)
        .uploadProjectPhoto(state.session.departmentId, state.session.pin, key, u.name, 'image/jpeg', u.data.split(',')[1], u.caption));
      u.status = '✓'; okCount++;
    } catch (e) {
      u.status = 'รอ'; err.textContent = 'อัปโหลด "' + u.name + '" ไม่สำเร็จ: ' + ((e && e.message) || e); err.classList.remove('hidden');
      break;
    }
    renderPhotoUploadList();
  }
  renderPhotoUploadList();
  if (okCount){ PH.expanded[key] = false; loadAllPhotos(); }
  if (okCount && !PH.up.some(u => u.status === 'รอ')) setTimeout(closeModals, 600);
}

/* ============================================================

   ============================================================ */
state.projectModes = {};
function deptOn(key){ const m = state.projectModes && state.projectModes[key]; return !m || m.useDepartments !== false; }
const DEPT_MODE_TEXT = {
  paperless: { on: 'แต่ละหน่วยงานมี PIN บันทึกยอดของตัวเองและมีอันดับหน่วยงาน', off: 'ผู้ดูแลระบบบันทึกยอดรวมทั้งโรงพยาบาลรายเดือนเพียงรายการเดียว (ไม่แยกหน่วยงาน ไม่ต้องใช้ PIN หน่วยงาน)' },
  cartridge: { on: 'ฟอร์มส่งตลับหมึกให้เลือกหน่วยงาน และแสดงอันดับหน่วยงาน', off: 'ฟอร์มไม่ถามหน่วยงาน และไม่แสดงอันดับหน่วยงาน นับเป็นยอดรวมของโครงการ' },
  share:     { on: 'ฟอร์มส่งรายการ/เบิกให้ระบุหน่วยงาน และแสดงอันดับหน่วยงานที่รับแบ่งปัน', off: 'ไม่ถามหน่วยงานในฟอร์ม และไม่แสดงอันดับหน่วยงาน' },
  calendar:  { on: 'ผู้บริจาคเลือกประเภท "หน่วยงาน" ได้', off: 'ไม่รับแจ้งในนามหน่วยงาน (เหลือเจ้าหน้าที่ และบริษัท/องค์กรภายนอก)' }
};
function applyProjectModes(){
  Object.keys(DEPT_MODE_TEXT).forEach(k => document.body.classList.toggle('nodept-' + k, !deptOn(k)));
  document.querySelectorAll('.dept-mode-bar').forEach(bar => {
    const k = bar.dataset.deptKey, on = deptOn(k);
    bar.querySelector('input').checked = on;
    bar.classList.toggle('is-off', !on);
    const mg = bar.querySelector('.dm-manage'); if (mg) mg.classList.toggle('hidden', !on);
    bar.querySelector('.dm-desc').textContent = (on ? 'เปิดอยู่: ' : 'ปิดอยู่: ') + DEPT_MODE_TEXT[k][on ? 'on' : 'off'];
  });
  // Paperless โหมดปิด: ใช้การเข้าสู่ระบบผู้ดูแลหลักบันทึกยอดรวม (ไม่ใช้ PIN หน่วยงาน)
  if (!deptOn('paperless')){
    state.paperlessSession = state.session ? { departmentId: state.session.departmentId, departmentName: state.session.departmentName, pin: state.session.pin, fromAdmin: true } : null;
  } else if (state.paperlessSession && state.paperlessSession.fromAdmin){
    state.paperlessSession = null;
  }
  const sub = document.getElementById('plRankSubtitle');
  if (sub) sub.textContent = deptOn('paperless') ? 'คลิกชื่อหน่วยงานเพื่อดูรายงานสรุปรายเดือนของหน่วยงานนั้น' : 'สรุปยอดรวมทั้งโรงพยาบาล คลิกเพื่อดูรายงานรายเดือน';
  if (state.paperlessBootstrap) updatePaperlessAuthUI();
  calFillTypeOptions();
}
function bindDeptModeBars(){
  document.querySelectorAll('.dept-mode-bar').forEach(bar => {
    bar.querySelector('input').onchange = e => {
      if (!requireSession()){ e.target.checked = !e.target.checked; return; }
      const k = bar.dataset.deptKey, val = e.target.checked;
      if (!confirm((val ? 'เปิด' : 'ปิด') + 'การใช้ข้อมูลหน่วยงานของโครงการนี้?\n\n' + DEPT_MODE_TEXT[k][val ? 'on' : 'off'] + '\n\n(ข้อมูลที่บันทึกไว้แล้วไม่ถูกลบ)')){ e.target.checked = !val; return; }

        state.projectModes = r.modes || {};

/* ============================================================
   ปฏิทินเก่าเราขอ: ลิงก์ + QR + ฟอร์มส่งเข้าโครงการ + รายการรอตรวจสอบ (ผู้ดูแล)
