function calFormLink(){
  const base = (typeof WEBAPP_URL !== 'undefined' && WEBAPP_URL) ? WEBAPP_URL : window.location.href.split('?')[0];
  return base + '?page=calendar&action=form';
}
function calFillTypeOptions(){
  const sel = document.getElementById('calsType');
  if (!sel) return;
  const types = ['หน่วยงาน', 'เจ้าหน้าที่', 'บริษัท/องค์กรภายนอก'].filter(t => t !== 'หน่วยงาน' || deptOn('calendar'));
  const prev = sel.value;
  sel.innerHTML = types.map(t => `<option value="${t}">${t}</option>`).join('');
  if (types.indexOf(prev) !== -1) sel.value = prev;
  calsUpdateLabels();
  // ฟอร์มบันทึกของผู้ดูแล: ซ่อนประเภท "หน่วยงาน" เมื่อปิดโหมด
  const ad = document.getElementById('calfType');
  if (ad) Array.from(ad.options).forEach(o => { o.hidden = (o.value === 'หน่วยงาน' && !deptOn('calendar')); });
}
function calsUpdateLabels(){
  const t = document.getElementById('calsType').value;
  document.getElementById('calsNameLabel').textContent = t === 'หน่วยงาน' ? 'ชื่อหน่วยงาน *' : (t === 'เจ้าหน้าที่' ? 'ชื่อ-สกุลเจ้าหน้าที่ *' : 'ชื่อผู้ติดต่อ *');
  document.getElementById('calsOrgWrap').classList.toggle('hidden', t !== 'บริษัท/องค์กรภายนอก');
}
function openCalSubmit(){
  calFillTypeOptions();
  ['calsName', 'calsOrg', 'calsContact', 'calsQty', 'calsDate', 'calsNote', 'calsWebsite'].forEach(id => { document.getElementById(id).value = ''; });
  document.getElementById('calsError').classList.add('hidden'); document.getElementById('calsOk').classList.add('hidden');
  document.getElementById('btnCalsSend').disabled = false;
  openModal('modalCalSubmit');
}
function sendCalSubmit(){
  const err = document.getElementById('calsError'), ok = document.getElementById('calsOk'), btn = document.getElementById('btnCalsSend');
  err.classList.add('hidden'); ok.classList.add('hidden');
  const g = id => document.getElementById(id).value.trim();
  const type = document.getElementById('calsType').value;
  const data = { DonorType: type, DonorName: g('calsName'), Organization: g('calsOrg'), Contact: g('calsContact'), EstimatedQty: Number(g('calsQty')) || 0,
    PlannedDate: g('calsDate'), Note: g('calsNote'), website: document.getElementById('calsWebsite').value };
  const fail = m => { err.textContent = m; err.classList.remove('hidden'); };
  if (!data.DonorName) return fail('กรุณากรอก' + document.getElementById('calsNameLabel').textContent.replace(' *', ''));
  if (type === 'บริษัท/องค์กรภายนอก' && !data.Organization) return fail('กรุณาระบุชื่อบริษัท/องค์กร');
  if (!data.Contact) return fail('กรุณากรอกช่องทางติดต่อ (เบอร์โทรหรืออีเมล)');
  btn.disabled = true; btn.textContent = 'กำลังส่ง...';
  google.script.run.withSuccessHandler(r => {
    btn.textContent = 'ส่งข้อมูล';
    ok.textContent = '✅ ท่านส่งข้อมูลเรียบร้อยแล้ว (รหัส ' + r.id + ') รอผู้ดูแลระบบยืนยันอีกครั้ง เจ้าหน้าที่จะติดต่อกลับตามช่องทางที่ระบุ — ขอบคุณที่ร่วมเป็นผู้ร่วมรักษาสิ่งแวดล้อมไปด้วยกัน 🌿';
    ok.classList.remove('hidden');
    if (state.session) loadCalSubs();
  }).withFailureHandler(e => { btn.disabled = false; btn.textContent = 'ส่งข้อมูล'; fail((e && e.message) || String(e)); }).submitCalendarSubmission(data);
}
function renderCalShareLink(){
  const link = calFormLink();
  document.getElementById('calShareLinkInput').value = link;
  const qr = 'https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=' + encodeURIComponent(link);
  document.getElementById('calQrImg').src = qr;
  document.getElementById('calQrDownload').href = qr;

function bindCalSubmitEvents(){
  document.getElementById('btnCalSubmitOpen').onclick = openCalSubmit;

  document.getElementById('btnCalsSend').onclick = sendCalSubmit;

  };
  document.getElementById('btnCalCopyShareLink').onclick = () => {
    const input = document.getElementById('calShareLinkInput'), c = document.getElementById('calCopyConfirm');
    const done = () => { c.classList.remove('hidden'); setTimeout(() => c.classList.add('hidden'), 2500); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(input.value).then(done).catch(() => fallbackCopy(input, done));
    else fallbackCopy(input, done);
  };
  calFillTypeOptions();
}
function loadCalSubs(){
  if (!state.session) return;
  const box = document.getElementById('calSubList');
  google.script.run.withSuccessHandler(list => {
    const pend = list.filter(x => x.Status === 'รอตรวจสอบ').length;
    document.getElementById('calSubCount').textContent = pend ? `(รอตรวจสอบ ${pend} รายการ)` : '(ไม่มีรายการค้าง)';
    if (!list.length){ box.innerHTML = '<div class="empty">ยังไม่มีผู้แจ้งส่งปฏิทิน</div>'; return; }
    box.innerHTML = list.map(x => {
      const isPend = x.Status === 'รอตรวจสอบ';
      return `<div class="cal-sub-item ${isPend ? '' : 'done'}" data-id="${escapeHtml(x.SubmissionID)}">
        <div class="cal-sub-head"><span class="cal-sub-badge ${isPend ? 'pend' : (x.Status === 'รับแล้ว' ? 'ok' : 'no')}">${escapeHtml(x.Status)}</span>
          <b>${escapeHtml(x.DonorName)}</b> <span class="muted">(${escapeHtml(x.DonorType)}${x.Organization ? ' • ' + escapeHtml(x.Organization) : ''})</span></div>
        <div class="muted">แจ้งเมื่อ ${fmtDate(x.SubmitDate)} • ติดต่อ: ${escapeHtml(x.Contact)} • ประมาณ ${shipNum(x.EstimatedQty, 0)} เล่ม${x.PlannedDate ? ' • สะดวกส่ง ' + fmtDate(x.PlannedDate) : ''}${x.Note ? ' • ' + escapeHtml(x.Note) : ''}</div>
        ${isPend ? `<div class="cal-sub-act"><input type="number" class="cal-sub-kg" min="0" step="any" placeholder="น้ำหนักที่ชั่งได้ (กก.)">
          <button class="btn btn-primary cal-sub-ok" type="button">✅ รับเข้า</button><button class="btn btn-danger cal-sub-no" type="button">ไม่รับ</button></div>` : (x.ReviewedBy ? `<div class="muted">ตรวจสอบโดย ${escapeHtml(x.ReviewedBy)}</div>` : '')}
      </div>`;
    }).join('');
    const review = (id, decision, kg, btn) => {
      btn.disabled = true;
      google.script.run.withSuccessHandler(() => { loadCalSubs(); state.cal.loaded = false; loadCalendar(); })
        .withFailureHandler(e => { btn.disabled = false; alertErr(e); })
        .reviewCalendarSubmission(state.session.departmentId, state.session.pin, id, decision, { WeightKg: kg });
    };
    box.querySelectorAll('.cal-sub-ok').forEach(b => b.onclick = () => {
      const it = b.closest('.cal-sub-item'), kg = Number(it.querySelector('.cal-sub-kg').value) || 0;
      if (kg <= 0){ alert('กรุณากรอกน้ำหนักที่ชั่งได้ (กก.)'); return; }
      review(it.dataset.id, 'accept', kg, b);
    });
    box.querySelectorAll('.cal-sub-no').forEach(b => b.onclick = () => {
      if (!confirm('ไม่รับรายการนี้?')) return;
      review(b.closest('.cal-sub-item').dataset.id, 'reject', 0, b);
    });
  }).withFailureHandler(err => { box.innerHTML = '<div class="empty">โหลดไม่สำเร็จ: ' + escapeHtml(err.message || err) + '</div>'; })
    .getCalendarSubmissions(state.session.departmentId, state.session.pin);
}

/* ===== เลือกหน่วยงานที่ใช้รายโครงการ ===== */
const DMG = { key:null, rows:[], orig:{} };
const DMG_TITLE = { paperless:'Paperless', cartridge:'ตลับหมึกเก่าเราขอ', share:'คัดแยก แบ่งปัน' };
function dmgRender(){
  const q = (document.getElementById('dmgSearch').value || '').trim().toLowerCase();
  const list = document.getElementById('dmgList');
  list.innerHTML = DMG.rows.filter(r => !q || r.DepartmentName.toLowerCase().indexOf(q) !== -1).map(r =>
    `<label class="dmg-item"><input type="checkbox" data-id="${escapeHtml(r.DepartmentID)}" ${r.IsActive ? 'checked' : ''}><span>${escapeHtml(r.DepartmentName)}</span></label>`).join('') || '<p class="muted">ไม่พบหน่วยงาน</p>';
  list.querySelectorAll('input').forEach(c => c.onchange = () => {
    const r = DMG.rows.find(x => x.DepartmentID === c.dataset.id); if (r) r.IsActive = c.checked; dmgCount();
  });
  dmgCount();
}
function dmgCount(){
  const on = DMG.rows.filter(r => r.IsActive).length;
  document.getElementById('dmgCount').textContent = 'ใช้ ' + on + ' / ' + DMG.rows.length + ' หน่วยงาน';
}
function openDeptManage(key){
  if (!requireSession()) return;
  DMG.key = key; DMG.rows = []; DMG.orig = {};
  document.getElementById('dmgTitle').textContent = 'เลือกหน่วยงานที่ใช้ — ' + (DMG_TITLE[key] || '');
  document.getElementById('dmgSearch').value = '';
  document.getElementById('dmgError').classList.add('hidden');
  document.getElementById('dmgList').innerHTML = '<p class="muted">กำลังโหลด...</p>';
  dmgResetAddForm();
  openModal('modalDeptManage');
  dmgLoadRows();
}
function dmgLoadRows(){
  google.script.run.withSuccessHandler(rows => {
    rows = rows || [];
    // คงค่าที่ติ๊กไว้แต่ยังไม่บันทึก
    const pending = {}; DMG.rows.forEach(r => { if (DMG.orig[r.DepartmentID] !== r.IsActive) pending[r.DepartmentID] = r.IsActive; });
    DMG.orig = {}; rows.forEach(r => { DMG.orig[r.DepartmentID] = r.IsActive; if (r.DepartmentID in pending) r.IsActive = pending[r.DepartmentID]; });
    DMG.rows = rows; dmgRender();
  }).withFailureHandler(err => { document.getElementById('dmgList').innerHTML = ''; alertErr(err); })
    .getProjectDepartments(state.session.departmentId, state.session.pin, DMG.key);
}

/* ---------- เพิ่มหน่วยงานใหม่จากหน้าเว็บ ---------- */
function dmgResetAddForm(){
  document.getElementById('dmgAddBox').open = false;
  document.getElementById('dmgNewName').value = '';
  document.getElementById('dmgNewPin').value = '';
  ['dmgAddError', 'dmgAddOk'].forEach(id => document.getElementById(id).classList.add('hidden'));
  const others = Object.keys(DMG_TITLE).filter(k => k !== DMG.key);
  document.getElementById('dmgAlso').innerHTML = '<span class="muted">เพิ่มในโครงการอื่นด้วย:</span>' + others.map(k =>
    `<label><input type="checkbox" value="${k}"> ${escapeHtml(DMG_TITLE[k])}</label>`).join('');
  document.querySelectorAll('#dmgAlso input').forEach(c => c.onchange = dmgTogglePin);
  dmgTogglePin();
}
function dmgAlsoKeys(){
  return Array.from(document.querySelectorAll('#dmgAlso input:checked')).map(c => c.value);
}
function dmgTogglePin(){
  const need = DMG.key === 'paperless' || dmgAlsoKeys().indexOf('paperless') !== -1;
  document.getElementById('dmgNewPinWrap').classList.toggle('hidden', !need);
}
function dmgMarkStale(k){
  if (k === 'paperless') state.paperlessLoaded = false;
  else if (k === 'cartridge') state.cartridgeLoaded = false;
  else if (k === 'share' && state.shr) state.shr.loaded = false;
}
function dmgReloadTab(k){
  if (k === 'paperless'){ state.paperlessLoaded = false; loadPaperlessData(); }
  else if (k === 'cartridge'){ state.cartridgeLoaded = false; loadCartridgeData(); }
  else if (k === 'share'){ loadShrData(); }
}
function dmgAdd(){
  const nameEl = document.getElementById('dmgNewName'), pinEl = document.getElementById('dmgNewPin');
  const err = document.getElementById('dmgAddError'), ok = document.getElementById('dmgAddOk');
  err.classList.add('hidden'); ok.classList.add('hidden');
  const name = nameEl.value.replace(/\s+/g, ' ').trim(), also = dmgAlsoKeys();
  const needPin = DMG.key === 'paperless' || also.indexOf('paperless') !== -1;
  if (!name){ err.textContent = 'กรุณากรอกชื่อหน่วยงาน'; err.classList.remove('hidden'); nameEl.focus(); return; }
  if (needPin && !/^\d{4,8}$/.test(pinEl.value.trim())){
    err.textContent = 'หน่วยงาน Paperless ต้องตั้ง PIN เป็นตัวเลข 4–8 หลัก'; err.classList.remove('hidden'); pinEl.focus(); return;
  }

/* ============================================================
   เป้าหมายรายเดือน → ร้อยละความสำเร็จของโครงการ
   ============================================================ */
const TG = { cache: {}, year: new Date().getFullYear(), pending: {} };
const TG_MON = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function tgNum(v, dec){ v = Number(v) || 0; return v.toLocaleString(undefined, { maximumFractionDigits: dec === undefined ? 1 : Math.max(dec, 0) }); }
function tgPct(v){ return v === null || v === undefined ? '-' : (Math.round(v * 10) / 10).toLocaleString() + '%'; }
function tgClass(pct){ return pct === null || pct === undefined ? 'none' : (pct >= 100 ? 'done' : (pct >= 70 ? 'near' : (pct >= 40 ? 'mid' : 'low'))); }
function tgStatusText(pct){
  if (pct === null || pct === undefined) return '';
  return pct >= 100 ? '✅ ถึงหรือเกินเป้าหมายแล้ว' : (pct >= 70 ? '🟢 ใกล้ถึงเป้าหมาย' : (pct >= 40 ? '🟡 ต่ำกว่าเป้าหมายเล็กน้อย' : '🔴 ต่ำกว่าเป้าหมายมาก'));
}
function tgChartSvg(t){
  const W = 640, H = 190, L = 44, R = 8, T = 18, B = 24, iw = W - L - R, ih = H - T - B;
  const vals = t.months.map(m => Math.max(m.actual, m.target));
  let max = Math.max(1, ...vals); const p = Math.pow(10, Math.floor(Math.log10(max))); const n = max / p; max = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p;
  const bw = iw / 12 * 0.5; let g = '';
  for (let i = 0; i <= 4; i++){ const y = T + ih - ih * i / 4; g += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="#e7e2d3"/><text x="${L - 5}" y="${y + 3}" font-size="10" text-anchor="end" fill="#7b7766">${tgNum(max * i / 4, 0)}</text>`; }
  t.months.forEach((m, i) => {
    const cx = L + iw / 12 * (i + .5), future = i + 1 > t.curMonth;
    const h = ih * m.actual / max, color = m.target > 0 ? (m.actual >= m.target ? '#2e8b57' : '#d9822b') : '#9aa89f';
    if (m.actual > 0) g += `<rect x="${cx - bw / 2}" y="${T + ih - h}" width="${bw}" height="${Math.max(1, h)}" rx="3" fill="${color}" opacity="${future ? .5 : 1}"><title>${TG_MON[i]}: ผลจริง ${tgNum(m.actual, t.metric.dec)} / เป้า ${tgNum(m.target, t.metric.dec)} ${t.metric.unit}</title></rect>`;
    if (m.target > 0){ const y = T + ih - ih * m.target / max; g += `<line x1="${cx - bw * .8}" x2="${cx + bw * .8}" y1="${y}" y2="${y}" stroke="#a8852f" stroke-width="2.5" stroke-linecap="round"/>`; }
    if (m.pct !== null && !future) g += `<text x="${cx}" y="${Math.min(T + ih - h, T + ih - ih * m.target / max) - 4}" font-size="9.5" text-anchor="middle" fill="#3b3a30" font-weight="700">${Math.round(m.pct)}%</text>`;
    g += `<text x="${cx}" y="${H - 7}" font-size="10" text-anchor="middle" fill="#5d5a4b">${TG_MON[i]}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block" role="img" aria-label="ผลจริงเทียบเป้าหมายรายเดือน">${g}</svg>
    <div class="tg-legend"><span><i style="background:#2e8b57"></i>ผลจริง (ถึงเป้า)</span><span><i style="background:#d9822b"></i>ผลจริง (ยังไม่ถึงเป้า)</span><span><i class="tg-line"></i>เป้าหมายรายเดือน</span></div>`;
}
function tgBlockHtml(t){
  const isAdmin = !!state.session, m = t.metric, cm = t.curMonth;
  const nav = `<div class="tg-nav"><button class="btn btn-icon btn-sm" data-tg="prev">‹</button><b>ปี พ.ศ. ${t.year + 543}</b><button class="btn btn-icon btn-sm" data-tg="next">›</button></div>`;
  const adminBtn = isAdmin ? `<button class="btn btn-primary btn-sm" data-tg="edit">${t.hasTarget ? '✏️ แก้ไขเป้าหมาย' : '🎯 ตั้งเป้าหมายรายเดือน'}</button>` : '';
  if (!t.hasTarget){
    return `<div class="tg-card tg-empty"><div class="tg-head"><span class="tg-title">🎯 เป้าหมายรายเดือน</span>${nav}</div>
      <p class="muted">ยังไม่ได้ตั้งเป้าหมายของปี ${t.year + 543} — เมื่อตั้งเป้าแล้ว ระบบจะคำนวณร้อยละความสำเร็จจาก "${escapeHtml(m.label)}" (${escapeHtml(m.unit)}) ที่บันทึกจริง และแสดงที่หน้าภาพรวมโครงการ</p>
      <div class="tg-actions">${adminBtn}</div></div>`;
  }
  const rows = t.months.map(x => `<tr class="${x.month > cm ? 'tg-future' : ''}"><td>${TG_MON[x.month - 1]}</td><td class="num">${x.target > 0 ? tgNum(x.target, m.dec) : '-'}</td><td class="num">${tgNum(x.actual, m.dec)}</td><td class="num"><span class="tg-pill tg-${tgClass(x.pct)}">${tgPct(x.pct)}</span></td><td class="num">${tgPct(x.cumPct)}</td></tr>`).join('');
  return `<div class="tg-card"><div class="tg-head"><span class="tg-title">🎯 ความสำเร็จตามเป้าหมาย — ${escapeHtml(m.label)} (${escapeHtml(m.unit)})</span>${nav}</div>
    <div class="tg-kpis">
      <div class="tg-kpi tg-${tgClass(t.annualPct)}"><small>ตามเป้าหมายทั้งปี ${t.year + 543}</small><b>${tgPct(t.annualPct)}</b>
        <span class="tg-bar"><span style="width:${Math.min(100, t.annualPct || 0)}%"></span></span>
        <small>ผลจริง ${tgNum(t.yearActual, m.dec)} / เป้า ${tgNum(t.annualTarget, m.dec)} ${escapeHtml(m.unit)}</small></div>
      <div class="tg-kpi tg-${tgClass(t.ytdPct)}"><small>เทียบเป้าสะสมถึง${cm >= 12 ? 'สิ้นปี' : (cm > 0 ? 'เดือน ' + TG_MON[cm - 1] : 'ปัจจุบัน')}</small><b>${tgPct(t.ytdPct)}</b>
        <span class="tg-bar"><span style="width:${Math.min(100, t.ytdPct || 0)}%"></span></span>
        <small>${tgStatusText(t.ytdPct) || 'ยังไม่ถึงช่วงที่ตั้งเป้า'}</small></div>
    </div>
    ${tgChartSvg(t)}
    <details class="tg-details"><summary>ดูตารางเป้าหมาย–ผลจริงรายเดือน</summary>
      <table class="tg-table"><thead><tr><th>เดือน</th><th class="num">เป้าหมาย</th><th class="num">ผลจริง</th><th class="num">% ของเป้าเดือนนั้น</th><th class="num">% สะสม</th></tr></thead><tbody>${rows}</tbody></table></details>
    <div class="tg-actions">${adminBtn}<span class="muted tg-note">ผลจริงดึงจากข้อมูลที่บันทึกในโครงการอัตโนมัติ (เฉพาะรายการที่ยืนยันแล้ว)</span></div></div>`;
}
function renderTargetBlock(el, key){
  if (!el) return;
  key = key || el.dataset.tgKey || '';
  if (!key){ el.classList.add('hidden'); if (el.id === 'detailTarget') el.innerHTML = ''; return; }
  el.classList.remove('hidden'); el.dataset.tgKey = key;
  const ck = key + '|' + TG.year, t = TG.cache[ck];
  if (!t){
    if (!el.innerHTML) el.innerHTML = '<div class="tg-card"><p class="muted">กำลังโหลดเป้าหมาย...</p></div>';
    if (TG.pending[ck]) return;
    TG.pending[ck] = true;
    google.script.run.withSuccessHandler(d => { TG.pending[ck] = false; TG.cache[ck] = d; renderTargetBlock(el, key); })
      .withFailureHandler(() => { TG.pending[ck] = false; el.innerHTML = ''; el.classList.add('hidden'); }).getProjectTargets(key, TG.year);
    return;
  }
  el.innerHTML = tgBlockHtml(t);
  const b = a => el.querySelector(`[data-tg="${a}"]`);
  const refreshAll = () => { document.querySelectorAll('.tg-block, #detailTarget').forEach(x => { if (x.dataset.tgKey) renderTargetBlock(x); }); };
  b('prev').onclick = () => { TG.year--; refreshAll(); };
  b('next').onclick = () => { TG.year++; refreshAll(); };
  if (b('edit')) b('edit').onclick = () => openTargetModal(key, t.year);
}
/* ---------- หน้าต่างตั้งเป้าหมาย (ผู้ดูแลระบบ) ---------- */
const TGM = { key: null, year: null, data: null, vals: [] };
function tgmRecalc(){
  const total = TGM.vals.reduce((s, v) => s + (Number(v) || 0), 0);
  document.getElementById('tgmTotal').textContent = tgNum(total, 2);
}
function tgmRender(){
  const d = TGM.data, m = d.metric;
  document.getElementById('tgmUnit').textContent = m.unit;
  document.getElementById('tgmHint').innerHTML = `เป้าหมายเป็น <b>${escapeHtml(m.label)}</b> (${escapeHtml(m.unit)}) ต่อเดือน — ร้อยละความสำเร็จ = ผลจริงที่บันทึก ÷ เป้าหมาย • เดือนที่ไม่ตั้งเป้า (เว้นว่างหรือ 0) จะไม่นับ`;
  document.getElementById('tgmGrid').innerHTML = d.months.map((x, i) => `
    <div class="tgm-cell"><label>${TG_MON[i]}</label>
      <input type="number" min="0" step="any" data-m="${i}" value="${TGM.vals[i] || ''}" placeholder="0">
      <small class="muted">ผลจริง ${tgNum(x.actual, m.dec)}</small></div>`).join('');
  document.querySelectorAll('#tgmGrid input').forEach(inp => inp.oninput = () => { TGM.vals[Number(inp.dataset.m)] = inp.value === '' ? 0 : Number(inp.value); tgmRecalc(); });
  tgmRecalc();
}
function tgmLoad(key, year){
  TGM.key = key; TGM.year = year;
  document.getElementById('tgmError').classList.add('hidden');
  google.script.run.withSuccessHandler(d => {
    TGM.data = d; TGM.vals = d.months.map(x => x.target || 0);
    const ys = []; for (let y = new Date().getFullYear() - 2; y <= new Date().getFullYear() + 2; y++) ys.push(y);
    document.getElementById('tgmYear').innerHTML = ys.map(y => `<option value="${y}" ${y === year ? 'selected' : ''}>พ.ศ. ${y + 543}</option>`).join('');
    document.getElementById('tgmAnnual').value = '';
    tgmRender();
  }).withFailureHandler(alertErr).getProjectTargets(key, year);
}
function openTargetModal(key, year){
  if (!requireSession()) return;
  const names = { ftf: 'ทอดไม่ทิ้ง', paperless: 'Paperless', cartridge: 'ตลับหมึกเก่าเราขอ', kitchen: 'จากครัวสู่ท้องฟ้า', calendar: 'ปฏิทินเก่าเราขอ', share: 'คัดแยก แบ่งปัน', em: 'น้ำยา EM', compost: 'ปุ๋ยหมักใบไม้' };
  document.getElementById('tgmTitle').textContent = '🎯 ตั้งเป้าหมายรายเดือน — ' + (names[key] || '');
  document.getElementById('tgmGrid').innerHTML = '<p class="muted">กำลังโหลด...</p>';
  openModal('modalTargets');
  tgmLoad(key, year || TG.year);
}
function bindTargets(){
  document.getElementById('tgmYear').onchange = e => tgmLoad(TGM.key, Number(e.target.value));
  document.getElementById('tgmSpread').onclick = () => {
    const a = Number(document.getElementById('tgmAnnual').value);
    if (!(a > 0)){ const er = document.getElementById('tgmError'); er.textContent = 'กรุณากรอกเป้ารวมทั้งปีก่อน'; er.classList.remove('hidden'); return; }
    document.getElementById('tgmError').classList.add('hidden');
    const dec = TGM.data.metric.dec, per = Math.round(a / 12 * Math.pow(10, dec + 1)) / Math.pow(10, dec + 1);
    TGM.vals = new Array(12).fill(per); tgmRender();
  };
  document.getElementById('tgmClear').onclick = () => { TGM.vals = new Array(12).fill(0); tgmRender(); };
  document.getElementById('tgmCopy').onclick = () => {
    google.script.run.withSuccessHandler(d => {
      if (!d.hasTarget){ const er = document.getElementById('tgmError'); er.textContent = 'ปี พ.ศ. ' + (TGM.year - 1 + 543) + ' ยังไม่ได้ตั้งเป้าหมาย'; er.classList.remove('hidden'); return; }
      TGM.vals = d.months.map(x => x.target || 0); tgmRender();
    }).withFailureHandler(alertErr).getProjectTargets(TGM.key, TGM.year - 1);
  };
  document.getElementById('tgmSave').onclick = () => {
    if (!requireSession()) return;
    const btn = document.getElementById('tgmSave'), er = document.getElementById('tgmError'); btn.disabled = true; er.classList.add('hidden');
    google.script.run.withSuccessHandler(() => {
      btn.disabled = false; closeModals(); TG.cache = {}; TG.year = TGM.year;
      loadBootstrap();
    }).withFailureHandler(e => { btn.disabled = false; er.textContent = (e && e.message) || String(e); er.classList.remove('hidden'); })
      .setProjectTargets(state.session.departmentId, state.session.pin, TGM.key, TGM.year, TGM.vals.map(v => Number(v) || 0));
  };
}
bindTargets();

/* ============================================================
   โครงการ "น้ำยา EM จากเศษอาหาร"  (INPUT → หมัก 7/15/45 วัน → น้ำยา EM → นำไปใช้ → คงเหลือ)
   ============================================================ */
const EM = { loaded: false, data: null, weekly: null, ext: null, sub: 'overview', filter: 'all', endDate: '', periods: 8, open: {}, pending: false };
const EM_STAGE = {
  early: { color: '#8bc34a', ico: '🌱' }, mid: { color: '#43a047', ico: '🌿' }, late: { color: '#2e7d32', ico: '🌳' },
  ready: { color: '#e0a100', ico: '🔔' }, done: { color: '#1e88a8', ico: '✅' }, cancel: { color: '#9aa89f', ico: '⛔' }
};
function emN(v, dec){ v = Number(v) || 0; return v.toLocaleString(undefined, { maximumFractionDigits: dec === undefined ? 1 : dec }); }
function emShort(iso){ if (!iso) return '-'; const p = String(iso).slice(0, 10).split('-'); return Number(p[2]) + '/' + Number(p[1]); }
function emRange(a, b){ return emShort(a) + ' – ' + emShort(b); }
function emBatchName(b){ return 'รอบที่ ' + b.BatchNo; }
function emById(id){ return ((EM.data && EM.data.batches) || []).find(b => b.BatchID === id); }

function loadEm(force){
  if (EM.loaded && !force){ renderEm(); return; }
  if (!EM.data) document.getElementById('emFlow').innerHTML = '<div class="loading">กำลังโหลดข้อมูล...</div>';
  google.script.run.withSuccessHandler(d => {
    EM.data = d; EM.loaded = true;
    google.script.run.withSuccessHandler(x => { EM.ext = x; renderEm(); }).withFailureHandler(() => { EM.ext = null; }).getEmExternalWaste(30);
    google.script.run.withSuccessHandler(w => { EM.weekly = w; renderEm(); })
      .withFailureHandler(() => { EM.weekly = null; renderEm(); }).getEmWeeklyReport(EM.endDate || null, EM.periods);
  }).withFailureHandler(err => { document.getElementById('emFlow').innerHTML = '<div class="empty">โหลดข้อมูลไม่สำเร็จ: ' + escapeHtml(err.message || err) + '</div>'; }).getEmOverview();
}
function reloadEm(){ EM.loaded = false; loadEm(true); try { loadBootstrap(); } catch (e) { /* ข้าม */ } }

/* ---------- แผนภาพกระบวนการ INPUT → PROCESS → OUTPUT → USE ---------- */

        <div><span>🍎 ผักและผลไม้</span><b>${emN(t.fruitVegKg)} กก.</b></div>
        <div><span>🥩 เนื้อสัตว์</span><b>${emN(t.meatKg)} กก.</b></div>
      </div>
      <div class="emf-big">${emN(t.inputKg)}<small> กก. รวม</small></div>
      <div class="emf-sub">+ กากน้ำตาล ${emN(t.molassesKg)} กก. • น้ำ ${emN(t.waterL)} ลิตร</div></div>
    <div class="emf-arrow" aria-hidden="true">➜</div>
    <div class="emf-step emf-proc"><div class="emf-tag">② PROCESS • หมักในถัง</div>
      <div class="emf-big">${t.fermentingBarrels}<small> ถังที่กำลังหมัก</small></div>
      <div class="emf-sub">หมักแล้วทั้งหมด ${t.batches} รอบ (${t.barrels} ถัง)</div>
      <div class="emf-chips">${stageMini}</div></div>
    <div class="emf-arrow" aria-hidden="true">➜</div>
    <div class="emf-step emf-out"><div class="emf-tag">③ OUTPUT • น้ำยา EM</div>
      <div class="emf-big">${emN(t.harvestedLiters)}<small> ลิตร ที่เก็บได้แล้ว</small></div>
      <div class="emf-sub">ครบกำหนดรอเก็บ ${t.readyBarrels} ถัง (≈ ${emN(t.readyLiters)} ลิตร)<br>กำลังหมักจะได้เพิ่ม ≈ ${emN(t.pipelineLiters - t.readyLiters)} ลิตร</div></div>
    <div class="emf-arrow" aria-hidden="true">➜</div>
    <div class="emf-step emf-use"><div class="emf-tag">④ USE • นำไปใช้</div>
      <div class="emf-big">${emN(t.usedLiters)}<small> ลิตร ใช้แล้ว</small></div>
      <div class="emf-sub">${t.usageTimes} ครั้ง • ${t.usagePlaces} สถานที่ • ${t.usageUsers} ผู้ใช้</div>
      <div class="emf-stock"><span>คงเหลือ</span><b>${emN(t.stockLiters)}</b><span>ลิตร</span></div></div>`;
}

/* ---------- แจ้งเตือน: รอบที่ควรเก็บเป็นน้ำยา EM / ใกล้ครบ / ค้างตรวจ ---------- */
function emAlertsHtml(d, cap){
  cap = cap || 12;
  const more = (n, k) => n > cap ? `<div class="ema-row"><span class="muted">และอีก ${n - cap} รอบ — ดูทั้งหมดที่แท็บ "รอบการหมัก"</span></div>` : '';
  const isAdmin = !!state.session, st = d.settings;
  const ready = d.readyList.map(emById).filter(Boolean), soon = d.soonList.map(emById).filter(Boolean);
  const parts = [];
  if (ready.length){
    parts.push(`<div class="ema ema-ready"><div class="ema-h">🔔 ${ready.length} รอบ ครบกำหนด ${st.ReadyDays} วันแล้ว — ควรเก็บเป็นน้ำยา EM และนำมาใช้งานได้แล้ว</div>
      ${ready.slice(0, cap).map(b => `<div class="ema-row"><span><b>${emBatchName(b)}</b> • เริ่ม ${fmtDate(b.StartDate)} • หมักมา ${b.age} วัน (เกินกำหนด ${Math.max(0, b.age - b.readyDays)} วัน) • ${b.barrels} ถัง คาดว่าได้ ≈ ${emN(b.expectedLiters)} ลิตร</span>${isAdmin ? `<button class="btn btn-primary btn-sm" data-em="harvest" data-id="${b.BatchID}">เก็บเป็นน้ำยา EM</button>` : ''}</div>`).join('')}${more(ready.length)}</div>`);
  }
  if (soon.length){
    parts.push(`<div class="ema ema-soon"><div class="ema-h">⏳ ใกล้ครบกำหนดใน ${st.SoonDays} วัน</div>
      ${soon.slice(0, cap).map(b => `<div class="ema-row"><span><b>${emBatchName(b)}</b> • อีก ${b.daysToReady} วัน (${fmtDate(b.readyDate)}) • ${b.barrels} ถัง ≈ ${emN(b.expectedLiters)} ลิตร</span></div>`).join('')}${more(soon.length)}</div>`);
  }
  if (d.pendingChecks.length){
    parts.push(`<div class="ema ema-check"><div class="ema-h">🔎 ถึงกำหนดตรวจ/ค้างบันทึกผลตรวจทุก 7 วัน</div>
      ${d.pendingChecks.slice(0, cap).map(p => `<div class="ema-row"><span><b>รอบที่ ${p.BatchNo}</b> • หมักมา ${p.age} วัน • ค้างตรวจครั้งที่ ${p.weeks.join(', ')}</span>${isAdmin ? `<button class="btn btn-outline btn-sm" data-em="check" data-id="${p.BatchID}">บันทึกผลตรวจ</button>` : ''}</div>`).join('')}${more(d.pendingChecks.length)}</div>`);
  }
  if (!parts.length) parts.push(`<div class="ema ema-ok">✅ ตอนนี้ไม่มีรอบที่ค้างเก็บน้ำยา และไม่มีผลตรวจที่ค้างบันทึก</div>`);
  return parts.join('');
}

/* ---------- กราฟ SVG ---------- */
function emNiceMax(v){ if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))), n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; }
function emAxis(L, T, iw, ih, max, W, R){
  let g = '';
  for (let i = 0; i <= 4; i++){ const y = T + ih - ih * i / 4; g += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="#e7e2d3"/><text x="${L - 5}" y="${y + 3}" font-size="10" text-anchor="end" fill="#7b7766">${emN(max * i / 4, max < 10 ? 1 : 0)}</text>`; }
  return g;
}
/** ถังที่เริ่มหมักรายวัน (30 วันล่าสุด) */
function emDailySvg(d, W, H){
  const L = 34, R = 8, T = 16, B = 26, iw = W - L - R, ih = H - T - B, n = d.daily.length;
  const max = emNiceMax(Math.max(1, ...d.daily.map(x => x.barrels))), bw = iw / n * 0.66;
  let g = emAxis(L, T, iw, ih, max, W, R);
  d.daily.forEach((x, i) => {
    const cx = L + iw / n * (i + .5), h = ih * x.barrels / max;
    if (x.barrels > 0){ g += `<rect x="${cx - bw / 2}" y="${T + ih - h}" width="${bw}" height="${h}" rx="2.5" fill="#4f8a24"><title>${fmtDate(x.date)}: ${x.barrels} ถัง (${x.batches} รอบ, ${emN(x.kg)} กก.)</title></rect><text x="${cx}" y="${T + ih - h - 3}" font-size="9.5" text-anchor="middle" fill="#2f4f14" font-weight="700">${x.barrels}</text>`; }
    if (i % 3 === 0 || i === n - 1) g += `<text x="${cx}" y="${H - 8}" font-size="9" text-anchor="middle" fill="#5d5a4b">${emShort(x.date)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block" role="img" aria-label="จำนวนถังที่เริ่มหมักรายวัน">${g}</svg>`;
}
/** คาดการณ์น้ำยาที่จะพร้อมเก็บในแต่ละสัปดาห์ */
function emForecastSvg(d, W, H){
  const L = 40, R = 8, T = 18, B = 34, iw = W - L - R, ih = H - T - B, n = d.forecast.length;
  const max = emNiceMax(Math.max(1, ...d.forecast.map(x => x.expectedLiters))), bw = iw / n * 0.58;
  let g = emAxis(L, T, iw, ih, max, W, R);
  d.forecast.forEach((x, i) => {
    const cx = L + iw / n * (i + .5), h = ih * x.expectedLiters / max, over = i === 0 && x.overdue > 0;
    if (x.expectedLiters > 0){ g += `<rect x="${cx - bw / 2}" y="${T + ih - h}" width="${bw}" height="${h}" rx="3" fill="${over ? '#e0a100' : '#1e88a8'}"><title>${emRange(x.from, x.to)}: ${x.barrels} ถัง ≈ ${emN(x.expectedLiters)} ลิตร</title></rect><text x="${cx}" y="${T + ih - h - 4}" font-size="10" text-anchor="middle" fill="#3b3a30" font-weight="700">${emN(x.expectedLiters, 0)}</text>`; }
    g += `<text x="${cx}" y="${H - 18}" font-size="9.5" text-anchor="middle" fill="#5d5a4b">${i === 0 ? 'ภายใน 7 วัน' : emShort(x.from)}</text><text x="${cx}" y="${H - 6}" font-size="9" text-anchor="middle" fill="#8a8672">${x.barrels > 0 ? x.barrels + ' ถัง' : ''}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block" role="img" aria-label="คาดการณ์น้ำยา EM ที่จะพร้อมเก็บ">${g}</svg>
    <div class="tg-legend"><span><i style="background:#e0a100"></i>ครบกำหนดแล้ว/ภายใน 7 วัน (รวมที่ค้างเก็บ)</span><span><i style="background:#1e88a8"></i>ครบกำหนดในสัปดาห์ถัดๆ ไป</span></div>`;
}
/** รายงานทุก 7 วัน: ถังที่เริ่มหมัก/ครบกำหนด (แท่ง) */
function emWeeklyBarrelSvg(w, W, H){
  const s = w.series, n = s.length, L = 36, R = 8, T = 16, B = 30, iw = W - L - R, ih = H - T - B;
  const max = emNiceMax(Math.max(1, ...s.map(x => Math.max(x.startedBarrels, x.reachReadyBarrels, x.fermentingBarrels))));
  let g = emAxis(L, T, iw, ih, max, W, R);
  const bw = iw / n * 0.26;
  s.forEach((x, i) => {
    const cx = L + iw / n * (i + .5);
    [[x.startedBarrels, '#4f8a24', -1, 'เริ่มหมัก'], [x.reachReadyBarrels, '#e0a100', 0, 'ครบกำหนด'], [x.fermentingBarrels, '#9ccc65', 1, 'กำลังหมัก ณ สิ้นช่วง']].forEach(([v, c, k, lab]) => {
      const h = ih * v / max; if (v > 0) g += `<rect x="${cx + k * bw * 1.05 - bw / 2}" y="${T + ih - h}" width="${bw}" height="${h}" rx="2" fill="${c}"><title>${emRange(x.from, x.to)} • ${lab}: ${v} ถัง</title></rect>`;
    });
    g += `<text x="${cx}" y="${H - 16}" font-size="9" text-anchor="middle" fill="#5d5a4b">${emShort(x.from)}</text><text x="${cx}" y="${H - 5}" font-size="9" text-anchor="middle" fill="#8a8672">–${emShort(x.to)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block" role="img" aria-label="ถังรายช่วง 7 วัน">${g}</svg>
    <div class="tg-legend"><span><i style="background:#4f8a24"></i>เริ่มหมัก (ถัง)</span><span><i style="background:#e0a100"></i>ครบกำหนดในช่วงนั้น (ถัง)</span><span><i style="background:#9ccc65"></i>กำลังหมัก ณ สิ้นช่วง (ถัง)</span></div>`;
}
/** รายงานทุก 7 วัน: น้ำยาที่ได้ / ใช้ไป (แท่ง) + คงเหลือ (เส้น) */
function emWeeklyLiterSvg(w, W, H){
  const s = w.series, n = s.length, L = 40, R = 8, T = 16, B = 30, iw = W - L - R, ih = H - T - B;
  const max = emNiceMax(Math.max(1, ...s.map(x => Math.max(x.harvestedLiters, x.usedLiters, x.stockEnd))));
  let g = emAxis(L, T, iw, ih, max, W, R), pts = [];
  const bw = iw / n * 0.3;
  s.forEach((x, i) => {
    const cx = L + iw / n * (i + .5);
    [[x.harvestedLiters, '#1e88a8', -1, 'ได้น้ำยา'], [x.usedLiters, '#d9822b', 1, 'นำไปใช้']].forEach(([v, c, k, lab]) => {
      const h = ih * v / max; if (v > 0) g += `<rect x="${cx + k * bw * .55 - bw / 2}" y="${T + ih - h}" width="${bw}" height="${h}" rx="2" fill="${c}"><title>${emRange(x.from, x.to)} • ${lab}: ${emN(v)} ลิตร</title></rect>`;
    });
    pts.push([cx, T + ih - ih * x.stockEnd / max, x]);
    g += `<text x="${cx}" y="${H - 16}" font-size="9" text-anchor="middle" fill="#5d5a4b">${emShort(x.from)}</text><text x="${cx}" y="${H - 5}" font-size="9" text-anchor="middle" fill="#8a8672">–${emShort(x.to)}</text>`;
  });
  g += `<polyline points="${pts.map(p => p[0] + ',' + p[1]).join(' ')}" fill="none" stroke="#2e7d32" stroke-width="2.4" stroke-linejoin="round"/>` + pts.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="3.6" fill="#fff" stroke="#2e7d32" stroke-width="2"><title>คงเหลือ ณ ${fmtDate(p[2].to)}: ${emN(p[2].stockEnd)} ลิตร</title></circle>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block" role="img" aria-label="น้ำยา EM รายช่วง 7 วัน">${g}</svg>
    <div class="tg-legend"><span><i style="background:#1e88a8"></i>ได้น้ำยา EM (ลิตร)</span><span><i style="background:#d9822b"></i>นำไปใช้ (ลิตร)</span><span><i class="tg-line" style="background:#2e7d32"></i>คงเหลือ ณ สิ้นช่วง (ลิตร)</span></div>`;
}

/* ---------- แถบความคืบหน้าของรอบ (มีหมุด 7/15/ครบกำหนด) ---------- */
function emTrackHtml(b, st){
  const ready = b.readyDays, pos = d => Math.min(100, d / ready * 100);
  const marks = [st.Stage1Days, st.Stage2Days, ready].filter((d, i, a) => d <= ready && a.indexOf(d) === i).map(d =>
    `<span class="emt-mark${b.age >= d ? ' is-on' : ''}" style="left:${pos(d)}%"><i></i><em>${d} วัน</em></span>`).join('');
  const col = EM_STAGE[b.stage].color;
  return `<div class="emt"><div class="emt-bar"><span class="emt-fill" style="width:${b.progress}%;background:${col}"></span>${marks}</div></div>`;
}
function emWeeksHtml(b){
  return `<div class="emw">${b.weeks.map(w => {
    const cls = { done: 'ok', due: 'due', overdue: 'late', upcoming: 'up', skip: 'skip' }[w.status];
    const lab = { done: 'ตรวจแล้ว', due: 'ครบกำหนดวันนี้', overdue: 'ค้างตรวจ', upcoming: 'ยังไม่ถึง', skip: 'ข้าม' }[w.status];
    return `<span class="emw-dot emw-${cls}" title="ครั้งที่ ${w.week} • วันที่ ${w.dueDay} (${fmtDate(w.dueDate)}) • ${lab}${w.check ? ' • pH ' + (w.check.PH === null ? '-' : w.check.PH) + ' • ' + escapeHtml(w.check.Smell || '') : ''}">${w.status === 'done' ? '✓' : w.week}</span>`;
  }).join('')}</div>`;
}

/* ---------- แท็บ: รอบการหมัก ---------- */
function emLogDetail(l){
  if (l.LogType === 'เริ่มหมักถังใหม่') return `วัตถุดิบ ${emN(l.Kg)} กก. (🥗${emN(l.FoodKg)} 🍎${emN(l.FruitVegKg)} 🥩${emN(l.MeatKg)}) • ${l.Barrels} ถัง${l.Location ? ' • ' + l.Location : ''}${l.Note ? ' • ' + l.Note : ''}`;
  if (l.LogType === 'เติมวัตถุดิบเพิ่ม') return `เติม ${emN(l.Kg)} กก.${l.Barrels ? ' • เพิ่ม ' + l.Barrels + ' ถัง' : ''}${l.Note ? ' • ' + l.Note : ''}`;
  return [l.PH !== null ? 'pH ' + l.PH : '', l.Smell, l.Appearance, l.Action, l.Note].filter(Boolean).join(' • ') || '-';
}
function emRecentLogsHtml(d){
  const rows = (d.recentLogs || []).slice(0, 12).map(l => `<tr><td>${fmtDate(l.LogDate)}</td><td>${escapeHtml(l.LogType)}</td><td>${l.BatchNo ? 'รอบที่ ' + l.BatchNo : '-'}</td><td>${escapeHtml(l.Operator)}</td><td>${escapeHtml(emLogDetail(l))}</td></tr>`).join('');

    <div class="dmx-scroll"><table class="vf-table emtbl"><thead><tr><th>วันที่</th><th>ประเภท</th><th>รอบ</th><th>ผู้ปฏิบัติงาน</th><th>รายละเอียด</th></tr></thead><tbody>${rows || '<tr><td colspan="5" class="muted">ยังไม่มีบันทึกประจำวันที่ยืนยันแล้ว — ผู้ปฏิบัติงานบันทึกผ่านลิงก์/QR Code ได้</td></tr>'}</tbody></table></div></div>`;
}
function emBatchCardHtml(b, d){

  const nextCheck = b.fermenting && b.nextCheckDate ? ` • ตรวจครั้งถัดไป ครั้งที่ ${b.nextCheckWeek} วันที่ ${fmtDate(b.nextCheckDate)}` : '';
  const checks = b.checks.length ? `<table class="vf-table emtbl"><thead><tr><th>วันที่</th><th>ครั้งที่</th><th>วันที่ของการหมัก</th><th>pH</th><th>กลิ่น</th><th>ลักษณะ / สิ่งที่ทำ</th>${isAdmin ? '<th></th>' : ''}</tr></thead><tbody>${b.checks.map(k => `<tr><td>${fmtDate(k.CheckDate)}</td><td>${k.Week || '-'}</td><td>วันที่ ${k.DayNo}</td><td>${k.PH === null ? '-' : k.PH}</td><td>${escapeHtml(k.Smell || '-')}</td><td>${escapeHtml([k.Appearance, k.Action, k.Note].filter(Boolean).join(' • ') || '-')}</td>${isAdmin ? `<td><button class="btn btn-outline btn-sm vf-no" data-em="delcheck" data-id="${k.CheckID}">✕</button></td>` : ''}</tr>`).join('')}</tbody></table>` : '<p class="muted">ยังไม่มีบันทึกผลตรวจ</p>';

      <button class="btn btn-outline btn-sm" data-em="edit" data-id="${b.BatchID}">✏️ แก้ไข</button>

    ${b.logCount ? `<p class="emb-hn">📝 บันทึกประจำวัน ${b.logCount} รายการ • ล่าสุด ${fmtDate(b.lastLogDate)}</p>` : ''}

    ${open ? `<div class="emb-more">${logsTbl}${checks}</div>` : ''}
  </article>`;
}
function emBatchesHtml(d){
  const f = EM.filter, list = d.batches.filter(b => f === 'all' || (f === 'fermenting' && (b.stage === 'early' || b.stage === 'mid' || b.stage === 'late')) || (f === 'ready' && b.stage === 'ready') || (f === 'done' && b.stage === 'done') || (f === 'cancel' && b.stage === 'cancel'));
  const cnt = k => d.batches.filter(b => k === 'all' || (k === 'fermenting' && (b.stage === 'early' || b.stage === 'mid' || b.stage === 'late')) || b.stage === k).length;
  const chip = (k, lab) => `<button type="button" class="dmx-chip${f === k ? ' active' : ''}" data-emf="${k}">${lab} (${cnt(k)})</button>`;

/* ---------- แท็บ: รายงานทุก 7 วัน ---------- */
function emDelta(cur, prev, unit, dec){
  if (prev === null || prev === undefined) return '';
  const diff = cur - prev; if (Math.abs(diff) < 1e-9) return `<em class="emdel emdel-0">เท่ากับช่วงก่อน</em>`;
  return `<em class="emdel ${diff > 0 ? 'emdel-up' : 'emdel-down'}">${diff > 0 ? '▲ +' : '▼ '}${emN(diff, dec === undefined ? 1 : dec)} ${unit} จากช่วงก่อน</em>`;
}
function emWeeklySummaryLines(w){
  const c = w.current, p = w.previous, st = w.settings, snap = w.snapshot, L = [];
  L.push(`เริ่มหมักใหม่ ${c.startedBatches} รอบ (${c.startedBarrels} ถัง • วัตถุดิบ ${emN(c.startedKg)} กก.)`);
  L.push(`ถังที่ครบ ${st.Stage1Days} วัน ${c.reach1Barrels} ถัง • ครบ ${st.Stage2Days} วัน ${c.reach2Barrels} ถัง • ครบกำหนดเป็นน้ำยา EM (${st.ReadyDays} วัน) ${c.reachReadyBarrels} ถัง`);
  L.push(`เก็บเป็นน้ำยา EM ${c.harvestedBatches} รอบ ได้ ${emN(c.harvestedLiters)} ลิตร • นำไปใช้ ${emN(c.usedLiters)} ลิตร (${c.usageTimes} ครั้ง) • คงเหลือสิ้นช่วง ${emN(c.stockEnd)} ลิตร`);
  L.push(`กำลังหมักอยู่ ${c.fermentingBarrels} ถัง (${c.fermentingBatches} รอบ)${c.readyWaitingBatches ? ` — <b class="emx-warn">ครบกำหนดแล้วแต่ยังไม่เก็บ ${c.readyWaitingBarrels} ถัง (${c.readyWaitingBatches} รอบ)</b>` : ' — ไม่มีรอบที่ครบกำหนดค้างเก็บ'}`);
  L.push(`ผลตรวจทุก 7 วัน: ถึงกำหนด ${c.checksDue} ครั้ง บันทึกแล้ว ${c.checksDone} ครั้ง${c.checksDue > c.checksDone ? ` — <b class="emx-warn">ค้างบันทึก ${c.checksDue - c.checksDone} ครั้ง</b>` : (c.checksDue ? ' — ครบถ้วน' : '')}`);
  return L;
}

/* ---------- การกระทำของผู้ดูแล ---------- */
function emAdminCall(fn, args, ok){
  if (!requireSession()) return;
  google.script.run.withSuccessHandler(r => { if (ok) ok(r); reloadEm(); }).withFailureHandler(alertErr)[fn](state.session.departmentId, state.session.pin, ...args);
}
function emAction(act, id){
  const b = emById(id);
  if (act === 'toggle'){ EM.open[id] = !EM.open[id]; document.getElementById('emPaneBatches').innerHTML = emBatchesHtml(EM.data); bindEmDynamic(); return; }
  if (!requireSession()) return;
  if (act === 'harvest') return openEmHarvest(id);
  if (act === 'check') return openEmCheck(id);
  if (act === 'edit') return openEmBatch(id);
  if (act === 'cancel'){ if (confirm('ยกเลิก ' + emBatchName(b) + '? (รอบที่ยกเลิกจะไม่นับในยอด กลับมาหมักต่อได้)')) emAdminCall('updateEmBatch', [id, { Status: 'ยกเลิก' }]); return; }
  if (act === 'restore'){ emAdminCall('updateEmBatch', [id, { Status: 'กำลังหมัก' }]); return; }
  if (act === 'undo'){ if (confirm('ยกเลิกการเก็บน้ำยาของ ' + emBatchName(b) + ' กลับไปเป็นกำลังหมัก?')) emAdminCall('updateEmBatch', [id, { Status: 'กำลังหมัก' }]); return; }
  if (act === 'delbatch'){ if (confirm('ลบ ' + emBatchName(b) + ' พร้อมผลตรวจทั้งหมด? (ลบแล้วกู้คืนไม่ได้)')) emAdminCall('deleteEmBatch', [id]); return; }
  if (act === 'delcheck'){ if (confirm('ลบบันทึกผลตรวจนี้?')) emAdminCall('deleteEmCheck', [id]); return; }
  if (act === 'delusage'){ if (confirm('ลบรายการนำไปใช้นี้? (ปริมาณจะคืนกลับเป็นคงเหลือ)')) emAdminCall('deleteEmUsage', [id]); return; }
}
function emShowErr(id, msg){ const e = document.getElementById(id); e.textContent = msg; e.classList.remove('hidden'); }
function emIsoToday(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

function embCalc(){
  const g = id => Number(document.getElementById(id).value) || 0, st = EM.data.settings;
  const kg = g('embFood') + g('embFruit') + g('embMeat'), bl = g('embBarrelL') || st.DefaultBarrelLiters, ex = g('embExpected') || g('embBarrels') * bl * st.YieldPercent / 100;

  let ready = ''; if (start){ const dd = new Date(start + 'T12:00:00'); dd.setDate(dd.getDate() + days); ready = ' • ครบกำหนด ' + fmtDate(dd.toISOString().slice(0, 10)); }
  document.getElementById('embCalc').innerHTML = `วัตถุดิบรวม <b>${emN(kg)} กก.</b> • ${g('embBarrels')} ถัง • คาดว่าได้น้ำยา EM ≈ <b>${emN(ex)} ลิตร</b>${ready}`;

function openEmBatch(id){

  set('embBarrels', b ? b.barrels : ''); set('embBarrelL', b ? b.barrelLiters : st.DefaultBarrelLiters); set('embReadyDays', b && b.readyDays !== st.ReadyDays ? b.readyDays : '');

function saveEmBatch(){

function openEmCheck(id){
  const b = emById(id);
  document.getElementById('emcId').value = id;
  document.getElementById('emcInfo').innerHTML = `<b>${emBatchName(b)}</b> • เริ่มหมัก ${fmtDate(b.StartDate)} • ตอนนี้หมักมา ${b.age} วัน`;
  document.getElementById('emcDate').value = emIsoToday();

/* ============================================================
   เชื่อมต่อระบบอื่น: วัตถุดิบจากระบบอื่น (แสดงในแท็บ EM) + หน้าตั้งค่า (ผู้ดูแลระบบ)
   ============================================================ */
function emExtSvg(x, W, H){
  const n = x.daily.length, L = 40, R = 8, T = 14, B = 26, iw = W - L - R, ih = H - T - B;
  const max = emNiceMax(Math.max(1, ...x.daily.map(d => Math.max(d.foodKg + d.fruitVegKg + d.meatKg, d.batchKg))));
  let g = emAxis(L, T, iw, ih, max, W, R); const bw = iw / n * 0.66;
  x.daily.forEach((d, i) => {
    const cx = L + iw / n * (i + .5); let acc = 0;
    [[d.foodKg, '#8bc34a', 'เศษอาหาร'], [d.fruitVegKg, '#f9a825', 'ผักและผลไม้'], [d.meatKg, '#c0485a', 'เนื้อสัตว์']].forEach(([v, c, lab]) => {
      if (v <= 0) return; const h = ih * v / max, y = T + ih - ih * (acc + v) / max; acc += v;
      g += `<rect x="${cx - bw / 2}" y="${y}" width="${bw}" height="${h}" fill="${c}"><title>${fmtDate(d.date)} • ${lab}: ${emN(v)} กก.</title></rect>`;
    });
    if (d.batchKg > 0){ const y = T + ih - ih * d.batchKg / max; g += `<line x1="${cx - bw * .8}" x2="${cx + bw * .8}" y1="${y}" y2="${y}" stroke="#1f2a24" stroke-width="3" stroke-linecap="round"><title>${fmtDate(d.date)} • นำมาหมัก ${emN(d.batchKg)} กก.</title></line>`; }
    if (i % 4 === 0 || i === n - 1) g += `<text x="${cx}" y="${H - 8}" font-size="9" text-anchor="middle" fill="#5d5a4b">${emShort(d.date)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block" role="img" aria-label="วัตถุดิบจากระบบอื่นเทียบกับที่นำมาหมัก">${g}</svg>
    <div class="tg-legend"><span><i style="background:#8bc34a"></i>เศษอาหาร</span><span><i style="background:#f9a825"></i>ผักและผลไม้</span><span><i style="background:#c0485a"></i>เนื้อสัตว์</span><span><i class="tg-line" style="background:#1f2a24"></i>นำมาหมักจริง (กก./วัน)</span></div>`;
}

function integCopy(text, btn){
  const done = () => { if (btn){ const t = btn.textContent; btn.textContent = '✅ คัดลอกแล้ว'; setTimeout(() => btn.textContent = t, 1800); } };
  const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
  try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(() => { document.execCommand('copy'); done(); }); else { document.execCommand('copy'); done(); } } catch (e) { /* ข้าม */ }
  document.body.removeChild(ta);
}

const CP = { loaded: false, data: null, weekly: null, sub: 'overview', filter: 'all', endDate: '', periods: 8, open: {}, pending: false };
const CP_STAGE = {
  early: { color: '#c8a36a', ico: '🌱' }, mid: { color: '#a67c3d', ico: '🌿' }, late: { color: '#3f7d3a', ico: '🌳' },
  ready: { color: '#e0a100', ico: '🔔' }, done: { color: '#5f8f3a', ico: '✅' }, cancel: { color: '#9aa89f', ico: '⛔' }
};
function cpN(v, dec){ v = Number(v) || 0; return v.toLocaleString(undefined, { maximumFractionDigits: dec === undefined ? 1 : dec }); }
function cpShort(iso){ if (!iso) return '-'; const p = String(iso).slice(0, 10).split('-'); return Number(p[2]) + '/' + Number(p[1]); }
function cpRange(a, b){ return cpShort(a) + ' – ' + cpShort(b); }
function cpBatchName(b){ return 'รอบที่ ' + b.BatchNo; }
function cpById(id){ return ((CP.data && CP.data.batches) || []).find(b => b.BatchID === id); }

function loadCp(force){

  if (!CP.data) document.getElementById('cpFlow').innerHTML = '<div class="loading">กำลังโหลดข้อมูล...</div>';
  google.script.run.withSuccessHandler(d => {
    CP.data = d; CP.loaded = true;
    google.script.run.withSuccessHandler(w => { CP.weekly = w; renderCp(); })
      .withFailureHandler(() => { CP.weekly = null; renderCp(); }).getCpWeeklyReport(CP.endDate || null, CP.periods);

}

/* ---------- แจ้งเตือน: รอบที่ควรเก็บเป็นปุ๋ยหมัก / ใกล้ครบ / ค้างตรวจ ---------- */
function cpAlertsHtml(d, cap){
  cap = cap || 12;
  const more = (n, k) => n > cap ? `<div class="ema-row"><span class="muted">และอีก ${n - cap} รอบ — ดูทั้งหมดที่แท็บ "รอบการหมัก"</span></div>` : '';
  const isAdmin = !!state.session, st = d.settings;
  const ready = d.readyList.map(cpById).filter(Boolean), soon = d.soonList.map(cpById).filter(Boolean);
  const parts = [];
  if (ready.length){
    parts.push(`<div class="ema ema-ready"><div class="ema-h">🔔 ${ready.length} รอบ ครบกำหนด ${st.ReadyDays} วันแล้ว — ควรเก็บเป็นปุ๋ยหมักและนำมาใช้งานได้แล้ว</div>
      ${ready.slice(0, cap).map(b => `<div class="ema-row"><span><b>${cpBatchName(b)}</b> • เริ่ม ${fmtDate(b.StartDate)} • หมักมา ${b.age} วัน (เกินกำหนด ${Math.max(0, b.age - b.readyDays)} วัน) • ${b.piles} กอง คาดว่าได้ ≈ ${cpN(b.expectedKg)} กก.</span>${isAdmin ? `<button class="btn btn-primary btn-sm" data-cp="harvest" data-id="${b.BatchID}">เก็บเป็นปุ๋ยหมัก</button>` : ''}</div>`).join('')}${more(ready.length)}</div>`);
  }
  if (soon.length){
    parts.push(`<div class="ema ema-soon"><div class="ema-h">⏳ ใกล้ครบกำหนดใน ${st.SoonDays} วัน</div>
      ${soon.slice(0, cap).map(b => `<div class="ema-row"><span><b>${cpBatchName(b)}</b> • อีก ${b.daysToReady} วัน (${fmtDate(b.readyDate)}) • ${b.piles} กอง ≈ ${cpN(b.expectedKg)} กก.</span></div>`).join('')}${more(soon.length)}</div>`);
  }
  if (d.pendingChecks.length){
    parts.push(`<div class="ema ema-check"><div class="ema-h">🔎 ถึงกำหนดตรวจ/ค้างบันทึกผลตรวจทุก 7 วัน</div>
      ${d.pendingChecks.slice(0, cap).map(p => `<div class="ema-row"><span><b>รอบที่ ${p.BatchNo}</b> • หมักมา ${p.age} วัน • ค้างตรวจครั้งที่ ${p.weeks.join(', ')}</span>${isAdmin ? `<button class="btn btn-outline btn-sm" data-cp="check" data-id="${p.BatchID}">บันทึกผลตรวจ</button>` : ''}</div>`).join('')}${more(d.pendingChecks.length)}</div>`);
  }
  if (!parts.length) parts.push(`<div class="ema ema-ok">✅ ตอนนี้ไม่มีรอบที่ค้างเก็บปุ๋ยหมักและไม่มีผลตรวจที่ค้างบันทึก</div>`);
  return parts.join('');
}

/* ---------- กราฟ SVG ---------- */
function cpNiceMax(v){ if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))), n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; }
function cpAxis(L, T, iw, ih, max, W, R){
  let g = '';
  for (let i = 0; i <= 4; i++){ const y = T + ih - ih * i / 4; g += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="#e7e2d3"/><text x="${L - 5}" y="${y + 3}" font-size="10" text-anchor="end" fill="#7b7766">${cpN(max * i / 4, max < 10 ? 1 : 0)}</text>`; }
  return g;
}
/** กองที่เริ่มหมักรายวัน (30 วันล่าสุด) */
function cpDailySvg(d, W, H){
  const L = 34, R = 8, T = 16, B = 26, iw = W - L - R, ih = H - T - B, n = d.daily.length;
  const max = cpNiceMax(Math.max(1, ...d.daily.map(x => x.piles))), bw = iw / n * 0.66;
  let g = cpAxis(L, T, iw, ih, max, W, R);
  d.daily.forEach((x, i) => {
    const cx = L + iw / n * (i + .5), h = ih * x.piles / max;
    if (x.piles > 0){ g += `<rect x="${cx - bw / 2}" y="${T + ih - h}" width="${bw}" height="${h}" rx="2.5" fill="#8d6232"><title>${fmtDate(x.date)}: ${x.piles} กอง (${x.batches} รอบ, ${cpN(x.kg)} กก.)</title></rect><text x="${cx}" y="${T + ih - h - 3}" font-size="9.5" text-anchor="middle" fill="#4a3318" font-weight="700">${x.piles}</text>`; }
    if (i % 3 === 0 || i === n - 1) g += `<text x="${cx}" y="${H - 8}" font-size="9" text-anchor="middle" fill="#5d5a4b">${cpShort(x.date)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block" role="img" aria-label="จำนวนกองที่เริ่มหมักรายวัน">${g}</svg>`;
}
/** คาดการณ์ปุ๋ยหมักที่จะพร้อมเก็บในแต่ละสัปดาห์ */
function cpForecastSvg(d, W, H){
  const L = 40, R = 8, T = 18, B = 34, iw = W - L - R, ih = H - T - B, n = d.forecast.length;
  const max = cpNiceMax(Math.max(1, ...d.forecast.map(x => x.expectedKg))), bw = iw / n * 0.58;
  let g = cpAxis(L, T, iw, ih, max, W, R);
  d.forecast.forEach((x, i) => {
    const cx = L + iw / n * (i + .5), h = ih * x.expectedKg / max, over = i === 0 && x.overdue > 0;
    if (x.expectedKg > 0){ g += `<rect x="${cx - bw / 2}" y="${T + ih - h}" width="${bw}" height="${h}" rx="3" fill="${over ? '#e0a100' : '#5f8f3a'}"><title>${cpRange(x.from, x.to)}: ${x.piles} กอง ≈ ${cpN(x.expectedKg)} กก.</title></rect><text x="${cx}" y="${T + ih - h - 4}" font-size="10" text-anchor="middle" fill="#3b3a30" font-weight="700">${cpN(x.expectedKg, 0)}</text>`; }
    g += `<text x="${cx}" y="${H - 18}" font-size="9.5" text-anchor="middle" fill="#5d5a4b">${i === 0 ? 'ภายใน 7 วัน' : cpShort(x.from)}</text><text x="${cx}" y="${H - 6}" font-size="9" text-anchor="middle" fill="#8a8672">${x.piles > 0 ? x.piles + ' กอง' : ''}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block" role="img" aria-label="คาดการณ์ปุ๋ยหมักที่จะพร้อมเก็บ">${g}</svg>
    <div class="tg-legend"><span><i style="background:#e0a100"></i>ครบกำหนดแล้ว/ภายใน 7 วัน (รวมที่ค้างเก็บ)</span><span><i style="background:#5f8f3a"></i>ครบกำหนดในสัปดาห์ถัดๆ ไป</span></div>`;
}
/** รายงานทุก 7 วัน: กองที่เริ่มหมัก/ครบกำหนด (แท่ง) */
function cpWeeklyPileSvg(w, W, H){
  const s = w.series, n = s.length, L = 36, R = 8, T = 16, B = 30, iw = W - L - R, ih = H - T - B;
  const max = cpNiceMax(Math.max(1, ...s.map(x => Math.max(x.startedPiles, x.reachReadyPiles, x.fermentingPiles))));
  let g = cpAxis(L, T, iw, ih, max, W, R);
  const bw = iw / n * 0.26;
  s.forEach((x, i) => {
    const cx = L + iw / n * (i + .5);
    [[x.startedPiles, '#8d6232', -1, 'เริ่มหมัก'], [x.reachReadyPiles, '#e0a100', 0, 'ครบกำหนด'], [x.fermentingPiles, '#c9a46a', 1, 'กำลังหมัก ณ สิ้นช่วง']].forEach(([v, c, k, lab]) => {
      const h = ih * v / max; if (v > 0) g += `<rect x="${cx + k * bw * 1.05 - bw / 2}" y="${T + ih - h}" width="${bw}" height="${h}" rx="2" fill="${c}"><title>${cpRange(x.from, x.to)} • ${lab}: ${v} กอง</title></rect>`;
    });
    g += `<text x="${cx}" y="${H - 16}" font-size="9" text-anchor="middle" fill="#5d5a4b">${cpShort(x.from)}</text><text x="${cx}" y="${H - 5}" font-size="9" text-anchor="middle" fill="#8a8672">–${cpShort(x.to)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block" role="img" aria-label="กองรายช่วง 7 วัน">${g}</svg>
    <div class="tg-legend"><span><i style="background:#8d6232"></i>เริ่มหมัก (กอง)</span><span><i style="background:#e0a100"></i>ครบกำหนดในช่วงนั้น (กอง)</span><span><i style="background:#c9a46a"></i>กำลังหมัก ณ สิ้นช่วง (กอง)</span></div>`;
}
/** รายงานทุก 7 วัน: ปุ๋ยหมักที่ได้ / ใช้ไป (แท่ง) + คงเหลือ (เส้น) */
function cpWeeklyLiterSvg(w, W, H){
  const s = w.series, n = s.length, L = 40, R = 8, T = 16, B = 30, iw = W - L - R, ih = H - T - B;
  const max = cpNiceMax(Math.max(1, ...s.map(x => Math.max(x.harvestedKg, x.usedKg, x.stockEnd))));
  let g = cpAxis(L, T, iw, ih, max, W, R), pts = [];
  const bw = iw / n * 0.3;
  s.forEach((x, i) => {
    const cx = L + iw / n * (i + .5);
    [[x.harvestedKg, '#5f8f3a', -1, 'ได้ปุ๋ยหมัก'], [x.usedKg, '#d9822b', 1, 'นำไปใช้']].forEach(([v, c, k, lab]) => {
      const h = ih * v / max; if (v > 0) g += `<rect x="${cx + k * bw * .55 - bw / 2}" y="${T + ih - h}" width="${bw}" height="${h}" rx="2" fill="${c}"><title>${cpRange(x.from, x.to)} • ${lab}: ${cpN(v)} กก.</title></rect>`;
    });
    pts.push([cx, T + ih - ih * x.stockEnd / max, x]);
    g += `<text x="${cx}" y="${H - 16}" font-size="9" text-anchor="middle" fill="#5d5a4b">${cpShort(x.from)}</text><text x="${cx}" y="${H - 5}" font-size="9" text-anchor="middle" fill="#8a8672">–${cpShort(x.to)}</text>`;
  });
  g += `<polyline points="${pts.map(p => p[0] + ',' + p[1]).join(' ')}" fill="none" stroke="#3f7d3a" stroke-width="2.4" stroke-linejoin="round"/>` + pts.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="3.6" fill="#fff" stroke="#3f7d3a" stroke-width="2"><title>คงเหลือ ณ ${fmtDate(p[2].to)}: ${cpN(p[2].stockEnd)} กก.</title></circle>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block" role="img" aria-label="ปุ๋ยหมักรายช่วง 7 วัน">${g}</svg>
    <div class="tg-legend"><span><i style="background:#5f8f3a"></i>ได้ปุ๋ยหมัก (กก.)</span><span><i style="background:#d9822b"></i>นำไปใช้ (กก.)</span><span><i class="tg-line" style="background:#3f7d3a"></i>คงเหลือ ณ สิ้นช่วง (กก.)</span></div>`;
}

/* ---------- แถบความคืบหน้าของรอบ (มีหมุด 7/15/ครบกำหนด) ---------- */
function cpTrackHtml(b, st){
  const ready = b.readyDays, pos = d => Math.min(100, d / ready * 100);
  const marks = [st.Stage1Days, st.Stage2Days, ready].filter((d, i, a) => d <= ready && a.indexOf(d) === i).map(d =>
    `<span class="emt-mark${b.age >= d ? ' is-on' : ''}" style="left:${pos(d)}%"><i></i><em>${d} วัน</em></span>`).join('');
  const col = CP_STAGE[b.stage].color;
  return `<div class="emt"><div class="emt-bar"><span class="emt-fill" style="width:${b.progress}%;background:${col}"></span>${marks}</div></div>`;
}
function cpWeeksHtml(b){
  return `<div class="emw">${b.weeks.map(w => {
    const cls = { done: 'ok', due: 'due', overdue: 'late', upcoming: 'up', skip: 'skip' }[w.status];
    const lab = { done: 'ตรวจแล้ว', due: 'ครบกำหนดวันนี้', overdue: 'ค้างตรวจ', upcoming: 'ยังไม่ถึง', skip: 'ข้าม' }[w.status];
    return `<span class="emw-dot emw-${cls}" title="ครั้งที่ ${w.week} • วันที่ ${w.dueDay} (${fmtDate(w.dueDate)}) • ${lab}${w.check ? ' • ' + (w.check.TempC === null ? '-' : w.check.TempC + '°C') + ' • ' + escapeHtml(w.check.Smell || '') : ''}">${w.status === 'done' ? '✓' : w.week}</span>`;
  }).join('')}</div>`;
}

/* ---------- แท็บ: ภาพรวมกระบวนการ ---------- */

  const kpi = [
    ['🪴', t.batches + ' รอบ', 'หมักแล้วทั้งหมด (' + t.piles + ' กอง)'], ['🍂', cpN(t.inputKg) + ' กก.', 'ใบไม้แห้ง/ใบไม้สด/กิ่งไม้/เศษไม้ที่นำเข้า'],
    ['⏳', t.fermentingPiles + ' กอง', 'กำลังหมัก (≈ ' + cpN(t.pipelineKg) + ' กก.)'], ['🔔', t.readyPiles + ' กอง', 'ครบกำหนด ควรเก็บเป็นปุ๋ยหมัก'],
    ['🌱', cpN(t.harvestedKg) + ' กก.', 'ปุ๋ยหมักที่เก็บได้แล้ว'], ['💧', cpN(t.stockKg) + ' กก.', 'คงเหลือ (ใช้ไป ' + cpN(t.usedKg) + ' กก.)']

  const stageRows = d.byStage.map(x => `<tr><td><i class="emd" style="background:${CP_STAGE[x.key].color}"></i>${CP_STAGE[x.key].ico} ${x.label}</td><td class="num">${x.batches}</td><td class="num"><b>${x.piles}</b></td><td class="num">${cpN(x.inputKg)}</td><td class="num">${cpN(x.expectedKg)}</td></tr>`).join('');
  const ms = d.milestones.map(m => {

      <div class="emms-bar"><span style="width:${pct}%"></span></div>
      <small>ยังไม่ถึง ${m.waitingPiles} กอง • จะครบภายใน ${st.SoonDays} วัน: <b>${m.soonPiles}</b> กอง${m.days === st.ReadyDays ? ' • ผ่านเกณฑ์แล้วคาดว่าได้ ≈ ' + cpN(m.reachedExpectedKg) + ' กก.' : ''}</small></div>`;
  }).join('');
  const stockTot = Math.max(1, t.harvestedKg);
  return `
    <section class="emk-grid">${kpi}</section>
    <div class="em-grid2">
      <div class="dmx-card"><h4>🪴 กองที่กำลังหมัก แยกตามอายุการหมัก</h4>
        <div class="emsb">${stageBar || '<em class="muted">ยังไม่มีกองที่กำลังหมัก</em>'}</div>
        <table class="vf-table emtbl"><thead><tr><th>อายุการหมัก</th><th class="num">รอบ</th><th class="num">กอง</th><th class="num">วัตถุดิบ (กก.)</th><th class="num">คาดว่าได้ (กก.)</th></tr></thead><tbody>${stageRows}</tbody></table></div>
      <div class="dmx-card"><h4>🎯 กองที่ผ่านหมุดหมาย ${st.Stage1Days} / ${st.Stage2Days} / ${st.ReadyDays} วัน</h4>${ms}</div>
    </div>
    <div class="em-grid2">
      <div class="dmx-card"><h4>📅 จำนวนกองที่เริ่มหมักในแต่ละวัน (30 วันล่าสุด)</h4>${cpDailySvg(d, 640, 210)}</div>
      <div class="dmx-card"><h4>🔮 คาดการณ์: ปุ๋ยหมักที่จะพร้อมเก็บ (8 สัปดาห์ข้างหน้า)</h4>${cpForecastSvg(d, 640, 210)}</div>
    </div>
    <div class="dmx-card"><h4>💧 ปุ๋ยหมัก: ผลิตได้ → ใช้ไป → คงเหลือ</h4>
      <div class="emsb emsb-stock"><span style="flex:${Math.max(0.0001, t.usedKg)};background:#d9822b">ใช้ไป ${cpN(t.usedKg)} กก.</span><span style="flex:${Math.max(0.0001, t.stockKg)};background:#3f7d3a">คงเหลือ ${cpN(t.stockKg)} กก.</span></div>
      <small class="muted">ผลิตได้รวม ${cpN(t.harvestedKg)} กก. จาก ${t.harvestedBatches} รอบ • ใช้ไปแล้ว ${Math.round(t.usedKg / stockTot * 100)}%</small></div>
    ${cpRecentLogsHtml(d)}`;
}

/* ---------- แท็บ: รอบการหมัก ---------- */
function cpLogDetail(l){
  if (l.LogType === 'เริ่มหมักกองใหม่') return `วัตถุดิบ ${cpN(l.Kg)} กก. (🍂${cpN(l.DryKg)} 🌿${cpN(l.FreshKg)} 🪵${cpN(l.BranchKg)}) • ${l.Piles} กอง${l.Location ? ' • ' + l.Location : ''}${l.Note ? ' • ' + l.Note : ''}`;
  if (l.LogType === 'เติมวัตถุดิบเพิ่ม') return `เติม ${cpN(l.Kg)} กก.${l.Piles ? ' • เพิ่ม ' + l.Piles + ' กอง' : ''}${l.Note ? ' • ' + l.Note : ''}`;
  return [l.TempC !== null ? l.TempC + '°C' : '', l.Smell, l.Appearance, l.Action, l.Note].filter(Boolean).join(' • ') || '-';
}
function cpRecentLogsHtml(d){
  const rows = (d.recentLogs || []).slice(0, 12).map(l => `<tr><td>${fmtDate(l.LogDate)}</td><td>${escapeHtml(l.LogType)}</td><td>${l.BatchNo ? 'รอบที่ ' + l.BatchNo : '-'}</td><td>${escapeHtml(l.Operator)}</td><td>${escapeHtml(cpLogDetail(l))}</td></tr>`).join('');
  return `<div class="dmx-card"><h4>📝 บันทึกการหมักประจำวันล่าสุด <small class="muted">(ยืนยันแล้ว ${d.totals.dailyLogs} รายการ)</small></h4>
    <div class="dmx-scroll"><table class="vf-table emtbl"><thead><tr><th>วันที่</th><th>ประเภท</th><th>รอบ</th><th>ผู้ปฏิบัติงาน</th><th>รายละเอียด</th></tr></thead><tbody>${rows || '<tr><td colspan="5" class="muted">ยังไม่มีบันทึกประจำวันที่ยืนยันแล้ว — ผู้ปฏิบัติงานบันทึกผ่านลิงก์/QR Code ได้</td></tr>'}</tbody></table></div></div>`;
}
function cpBatchCardHtml(b, d){
  const isAdmin = !!state.session, st = d.settings, open = !!CP.open[b.BatchID], c = CP_STAGE[b.stage];
  const nm = b.nextMilestone ? `ขั้นต่อไป: ${b.nextMilestone.label} (${fmtDate(b.nextMilestone.date)} • อีก ${b.nextMilestone.inDays} วัน)` : (b.stage === 'ready' ? `🔔 ครบกำหนดมา ${b.age - b.readyDays} วันแล้ว — เก็บเป็นปุ๋ยหมักได้เลย` : '');
  const nextCheck = b.fermenting && b.nextCheckDate ? ` • ตรวจครั้งถัดไป ครั้งที่ ${b.nextCheckWeek} วันที่ ${fmtDate(b.nextCheckDate)}` : '';
  const checks = b.checks.length ? `<table class="vf-table emtbl"><thead><tr><th>วันที่</th><th>ครั้งที่</th><th>วันที่ของการหมัก</th><th>อุณหภูมิ (°C)</th><th>กลิ่น</th><th>ลักษณะ / สิ่งที่ทำ</th>${isAdmin ? '<th></th>' : ''}</tr></thead><tbody>${b.checks.map(k => `<tr><td>${fmtDate(k.CheckDate)}</td><td>${k.Week || '-'}</td><td>วันที่ ${k.DayNo}</td><td>${k.TempC === null ? '-' : k.TempC}</td><td>${escapeHtml(k.Smell || '-')}</td><td>${escapeHtml([k.Appearance, k.Action, k.Note].filter(Boolean).join(' • ') || '-')}</td>${isAdmin ? `<td><button class="btn btn-outline btn-sm vf-no" data-cp="delcheck" data-id="${k.CheckID}">✕</button></td>` : ''}</tr>`).join('')}</tbody></table>` : '<p class="muted">ยังไม่มีบันทึกผลตรวจ</p>';
  const logsTbl = (b.logs && b.logs.length) ? `<h5 class="emb-h5">📝 บันทึกประจำวัน</h5><table class="vf-table emtbl"><thead><tr><th>วันที่</th><th>ประเภท</th><th>ผู้ปฏิบัติงาน</th><th>รายละเอียด</th></tr></thead><tbody>${b.logs.map(l => `<tr><td>${fmtDate(l.LogDate)}</td><td>${escapeHtml(l.LogType)}</td><td>${escapeHtml(l.Operator)}</td><td>${escapeHtml(cpLogDetail(l))}</td></tr>`).join('')}</tbody></table><h5 class="emb-h5">🔎 ผลตรวจ</h5>` : '';
  const adm = isAdmin ? `<div class="emb-act">
      ${b.fermenting ? `<button class="btn btn-outline btn-sm" data-cp="check" data-id="${b.BatchID}">🔎 บันทึกผลตรวจ</button><button class="btn btn-primary btn-sm" data-cp="harvest" data-id="${b.BatchID}">🌱 เก็บเป็นปุ๋ยหมัก</button>` : ''}
      ${b.stage === 'done' ? `<button class="btn btn-outline btn-sm" data-cp="harvest" data-id="${b.BatchID}">✏️ แก้ผลผลิต</button>` : ''}
      <button class="btn btn-outline btn-sm" data-cp="edit" data-id="${b.BatchID}">✏️ แก้ไข</button>
      ${b.stage === 'cancel' ? `<button class="btn btn-outline btn-sm" data-cp="restore" data-id="${b.BatchID}">↩️ กลับมาหมักต่อ</button>` : (b.stage !== 'done' ? `<button class="btn btn-outline btn-sm" data-cp="cancel" data-id="${b.BatchID}">⛔ ยกเลิกรอบ</button>` : `<button class="btn btn-outline btn-sm" data-cp="undo" data-id="${b.BatchID}">↩️ ยกเลิกการเก็บ</button>`)}
      <button class="btn btn-outline btn-sm vf-no" data-cp="delbatch" data-id="${b.BatchID}">🗑️ ลบ</button></div>` : '';
  return `<article class="emb emb-${b.stage}" style="--c:${c.color}">
    <div class="emb-head"><div><b class="emb-no">${cpBatchName(b)}</b><span class="emb-sub">เริ่มหมัก ${fmtDate(b.StartDate)}${b.location ? ' • ' + escapeHtml(b.location) : ''}</span></div>
      <span class="emb-pill" style="background:${c.color}">${c.ico} ${escapeHtml(b.stageLabel)}</span></div>
    ${cpTrackHtml(b, st)}
    <div class="emb-stats">
      <div><small>อายุการหมัก</small><b>${b.stage === 'done' ? 'ตามจริง ' + b.age : b.age + ' / ' + b.readyDays} วัน</b><em>${fermDaysNote(b, st)}</em></div>
      <div><small>วัตถุดิบ</small><b>${cpN(b.inputKg)} กก.</b><em>🍂${cpN(b.dryKg)} 🌿${cpN(b.freshKg)} 🪵${cpN(b.branchKg)}</em></div>
      <div><small>จำนวนกอง</small><b>${b.piles} กอง</b></div>
      <div><small>${b.stage === 'done' ? 'ได้ปุ๋ยหมักจริง' : 'คาดว่าได้ปุ๋ยหมัก'}</small><b>${cpN(b.stage === 'done' ? b.yieldKg : b.expectedKg)} กก.</b>${b.stage === 'done' ? `<em>ใช้แล้ว ${cpN(b.usedKg)} • เหลือ ${cpN(b.remainingKg)}</em>` : `<em>ครบกำหนด ${fmtDate(b.readyDate)}</em>`}</div>
    </div>
    ${nm ? `<p class="emb-next">${nm}${nextCheck}</p>` : ''}
    ${b.stage !== 'cancel' ? `<div class="emb-weeks"><small>ผลตรวจทุก ${st.CheckIntervalDays} วัน:</small>${cpWeeksHtml(b)}</div>` : ''}
    ${b.logCount ? `<p class="emb-hn">📝 บันทึกประจำวัน ${b.logCount} รายการ • ล่าสุด ${fmtDate(b.lastLogDate)}</p>` : ''}
    ${b.stage === 'done' && b.harvestNote ? `<p class="muted emb-hn">📝 ${escapeHtml(b.harvestNote)}</p>` : ''}
    ${b.note ? `<p class="muted emb-hn">หมายเหตุ: ${escapeHtml(b.note)}</p>` : ''}
    <div class="emb-foot"><button class="btn btn-outline btn-sm" data-cp="toggle" data-id="${b.BatchID}">${open ? '▲ ซ่อนประวัติการตรวจ' : '▼ ประวัติการตรวจทุก 7 วัน (' + b.checks.length + ')'}</button>${adm}</div>
    ${open ? `<div class="emb-more">${logsTbl}${checks}</div>` : ''}
  </article>`;
}
function cpBatchesHtml(d){
  const f = CP.filter, list = d.batches.filter(b => f === 'all' || (f === 'fermenting' && (b.stage === 'early' || b.stage === 'mid' || b.stage === 'late')) || (f === 'ready' && b.stage === 'ready') || (f === 'done' && b.stage === 'done') || (f === 'cancel' && b.stage === 'cancel'));
  const cnt = k => d.batches.filter(b => k === 'all' || (k === 'fermenting' && (b.stage === 'early' || b.stage === 'mid' || b.stage === 'late')) || b.stage === k).length;
  const chip = (k, lab) => `<button type="button" class="dmx-chip${f === k ? ' active' : ''}" data-cpf="${k}">${lab} (${cnt(k)})</button>`;
  return `<div class="dmx-chips">${chip('all', 'ทั้งหมด')}${chip('fermenting', '⏳ กำลังหมัก')}${chip('ready', '🔔 ครบกำหนด')}${chip('done', '✅ เก็บแล้ว')}${chip('cancel', '⛔ ยกเลิก')}</div>
    <div class="emb-list">${list.map(b => cpBatchCardHtml(b, d)).join('') || '<div class="empty">ยังไม่มีรอบการหมักในหมวดนี้</div>'}</div>`;
}

/* ---------- แท็บ: รายงานทุก 7 วัน ---------- */
function cpDelta(cur, prev, unit, dec){
  if (prev === null || prev === undefined) return '';
  const diff = cur - prev; if (Math.abs(diff) < 1e-9) return `<em class="emdel emdel-0">เท่ากับช่วงก่อน</em>`;
  return `<em class="emdel ${diff > 0 ? 'emdel-up' : 'emdel-down'}">${diff > 0 ? '▲ +' : '▼ '}${cpN(diff, dec === undefined ? 1 : dec)} ${unit} จากช่วงก่อน</em>`;
}
function cpWeeklySummaryLines(w){
  const c = w.current, p = w.previous, st = w.settings, snap = w.snapshot, L = [];
  L.push(`เริ่มหมักใหม่ ${c.startedBatches} รอบ (${c.startedPiles} กอง • วัตถุดิบ ${cpN(c.startedKg)} กก.)`);
  L.push(`กองที่ครบ ${st.Stage1Days} วัน ${c.reach1Piles} กอง • ครบ ${st.Stage2Days} วัน ${c.reach2Piles} กอง • ครบกำหนดเป็นปุ๋ยหมัก (${st.ReadyDays} วัน) ${c.reachReadyPiles} กอง`);
  L.push(`เก็บเป็นปุ๋ยหมัก ${c.harvestedBatches} รอบ ได้ ${cpN(c.harvestedKg)} กก. • นำไปใช้ ${cpN(c.usedKg)} กก. (${c.usageTimes} ครั้ง) • คงเหลือสิ้นช่วง ${cpN(c.stockEnd)} กก.`);
  L.push(`กำลังหมักอยู่ ${c.fermentingPiles} กอง (${c.fermentingBatches} รอบ)${c.readyWaitingBatches ? ` — <b class="emx-warn">ครบกำหนดแล้วแต่ยังไม่เก็บ ${c.readyWaitingPiles} กอง (${c.readyWaitingBatches} รอบ)</b>` : ' — ไม่มีรอบที่ครบกำหนดค้างเก็บ'}`);

  return L;
}
function cpSnapshotRowsHtml(w){

function bindCpDynamic(){
  const root = document.getElementById('tabCP');
  root.querySelectorAll('[data-cp]').forEach(b => b.onclick = () => cpAction(b.dataset.cp, b.dataset.id));
  root.querySelectorAll('[data-cpf]').forEach(b => b.onclick = () => { CP.filter = b.dataset.cpf; document.getElementById('cpPaneBatches').innerHTML = cpBatchesHtml(CP.data); bindCpDynamic(); });
  const end = document.getElementById('cpwEnd'), per = document.getElementById('cpwPeriods'), td = document.getElementById('cpwToday');
  const reloadW = () => { CP.weekly = null; document.getElementById('cpPaneWeekly').innerHTML = cpWeeklyHtml(CP.data); google.script.run.withSuccessHandler(w => { CP.weekly = w; document.getElementById('cpPaneWeekly').innerHTML = cpWeeklyHtml(CP.data); bindCpDynamic(); }).withFailureHandler(alertErr).getCpWeeklyReport(CP.endDate || null, CP.periods); };
  if (end) end.onchange = () => { CP.endDate = end.value; reloadW(); };

}
function cpSub(sub){
  CP.sub = sub;

/* ---------- การกระทำของผู้ดูแล ---------- */
function cpAdminCall(fn, args, ok){
  if (!requireSession()) return;
  google.script.run.withSuccessHandler(r => { if (ok) ok(r); reloadCp(); }).withFailureHandler(alertErr)[fn](state.session.departmentId, state.session.pin, ...args);
}
function cpAction(act, id){
  const b = cpById(id);
  if (act === 'toggle'){ CP.open[id] = !CP.open[id]; document.getElementById('cpPaneBatches').innerHTML = cpBatchesHtml(CP.data); bindCpDynamic(); return; }
  if (!requireSession()) return;
  if (act === 'harvest') return openCpHarvest(id);
  if (act === 'check') return openCpCheck(id);
  if (act === 'edit') return openCpBatch(id);
  if (act === 'cancel'){ if (confirm('ยกเลิก ' + cpBatchName(b) + '? (รอบที่ยกเลิกจะไม่นับในยอด กลับมาหมักต่อได้)')) cpAdminCall('updateCpBatch', [id, { Status: 'ยกเลิก' }]); return; }
  if (act === 'restore'){ cpAdminCall('updateCpBatch', [id, { Status: 'กำลังหมัก' }]); return; }
  if (act === 'undo'){ if (confirm('ยกเลิกการเก็บปุ๋ยหมักของ ' + cpBatchName(b) + ' กลับไปเป็นกำลังหมัก?')) cpAdminCall('updateCpBatch', [id, { Status: 'กำลังหมัก' }]); return; }
  if (act === 'delbatch'){ if (confirm('ลบ ' + cpBatchName(b) + ' พร้อมผลตรวจทั้งหมด? (ลบแล้วกู้คืนไม่ได้)')) cpAdminCall('deleteCpBatch', [id]); return; }
  if (act === 'delcheck'){ if (confirm('ลบบันทึกผลตรวจนี้?')) cpAdminCall('deleteCpCheck', [id]); return; }
  if (act === 'delusage'){ if (confirm('ลบรายการนำไปใช้นี้? (ปริมาณจะคืนกลับเป็นคงเหลือ)')) cpAdminCall('deleteCpUsage', [id]); return; }
}
function cpShowErr(id, msg){ const e = document.getElementById(id); e.textContent = msg; e.classList.remove('hidden'); }
function cpIsoToday(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

function cpbCalc(){
  const g = id => Number(document.getElementById(id).value) || 0, st = CP.data.settings;
  const kg = g('cpbFood') + g('cpbFruit') + g('cpbMeat'), ex = g('cpbExpected') || kg * st.YieldPercent / 100;
  const days = g('cpbReadyDays') || st.ReadyDays, start = document.getElementById('cpbDate').value;
  let ready = ''; if (start){ const dd = new Date(start + 'T12:00:00'); dd.setDate(dd.getDate() + days); ready = ' • ครบกำหนด ' + fmtDate(dd.toISOString().slice(0, 10)); }
  document.getElementById('cpbCalc').innerHTML = `วัตถุดิบรวม <b>${cpN(kg)} กก.</b> • ${g('cpbPiles')} กอง • คาดว่าได้ปุ๋ยหมัก ≈ <b>${cpN(ex)} กก.</b>${ready}`;
}
function openCpBatch(id){
  if (!requireSession() || !CP.data) return;
  const b = id ? cpById(id) : null, st = CP.data.settings, set = (k, v) => { document.getElementById(k).value = v === undefined || v === null ? '' : v; };
  document.getElementById('cpbTitle').textContent = b ? '✏️ แก้ไข ' + cpBatchName(b) : '🌱 เริ่มหมักรอบใหม่';

  set('cpbFood', b ? b.dryKg || '' : ''); set('cpbFruit', b ? b.freshKg || '' : ''); set('cpbMeat', b ? b.branchKg || '' : '');
  set('cpbMolasses', b ? b.activatorKg || '' : ''); set('cpbWater', b ? b.waterL || '' : '');
  set('cpbPiles', b ? b.piles : ''); set('cpbReadyDays', b && b.readyDays !== st.ReadyDays ? b.readyDays : '');

function saveCpBatch(){

function doVerify(key, ids, approve){
