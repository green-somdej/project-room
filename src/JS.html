/* ============================= PIE CHART (SVG) ============================= */
/** สร้าง SVG Pie chart จาก entries [[label,count],...] */
function buildPieSvg(entries, total, colorFn, size, hideLabels){
  size = size || 220;
  const cx = size/2, cy = size/2, r = size/2 - 4;
  let angleStart = -90;
  const slices = entries.map(([label, count], i) => {
    const pct = total ? (count/total)*100 : 0;
    const angleEnd = angleStart + (pct/100) * 360;
    const path = describeArcSlice(cx, cy, r, angleStart, angleEnd);
    const midAngle = (angleStart + angleEnd) / 2;
    const labelPos = polarToXY(cx, cy, r*0.62, midAngle);
    const color = colorFn(label, i);
    angleStart = angleEnd;
    const showLabel = !hideLabels && pct >= 6;
    return `<path d="${path}" fill="${color}" stroke="#fff" stroke-width="2"></path>` +
      (showLabel ? `<text x="${labelPos.x}" y="${labelPos.y}" fill="#fff" font-size="${size*0.075}" font-weight="700" text-anchor="middle" dominant-baseline="middle" font-family="Sarabun, sans-serif">${Math.round(pct)}%</text>` : '');
  }).join('');
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">${slices}</svg>`;
}

function polarToXY(cx, cy, r, angleDeg){
  const rad = (angleDeg * Math.PI) / 180;
  return { x: cx + r*Math.cos(rad), y: cy + r*Math.sin(rad) };
}

function describeArcSlice(cx, cy, r, startAngle, endAngle){
  if (endAngle - startAngle >= 359.999){
    return `M ${cx-r} ${cy} a ${r} ${r} 0 1 0 ${2*r} 0 a ${r} ${r} 0 1 0 ${-2*r} 0 Z`;
  }
  const start = polarToXY(cx, cy, r, startAngle);
  const end = polarToXY(cx, cy, r, endAngle);
  const largeArc = (endAngle - startAngle) > 180 ? 1 : 0;
  return `M ${cx} ${cy} L ${start.x} ${start.y} A ${r} ${r} 0 ${largeArc} 1 ${end.x} ${end.y} Z`;
}

/* ============================= DONUT CHART (Canvas) ============================= */
/** วาดวงกลมความคืบหน้าลง canvas และคืนค่า dataURL (ใช้ฝังในหน้า PDF ได้) */
function drawDonut(canvas, percent, colorHex, opts){
  opts = opts || {};
  const size = canvas.width;
  const ctx = canvas.getContext('2d');
  const cx = size/2, cy = size/2;
  const thickness = opts.thickness || 10;
  const radius = size/2 - thickness;
  const pct = Math.max(0, Math.min(100, percent || 0));

  ctx.clearRect(0,0,size,size);
  ctx.beginPath();
  ctx.arc(cx, cy, radius, 0, Math.PI*2);
  ctx.lineWidth = thickness;
  ctx.strokeStyle = '#e5e9e7';
  ctx.stroke();
  if (pct > 0){
    ctx.beginPath();
    ctx.arc(cx, cy, radius, -Math.PI/2, -Math.PI/2 + (Math.PI*2*pct/100));
    ctx.lineWidth = thickness;
    ctx.strokeStyle = colorHex;
    ctx.lineCap = 'round';
    ctx.stroke();
  }
  if (!opts.noText){
    ctx.fillStyle = '#2c332f';
    ctx.font = 'bold ' + Math.round(size*0.22) + 'px Sarabun, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(pct + '%', cx, cy);
  }
  return canvas.toDataURL('image/png');
}

/* ============================= INIT ============================= */
document.addEventListener('DOMContentLoaded', () => {
  bindStaticEvents();
  bindPaperlessEvents();
  bindCartridgeEvents();
  bindShrEvents();
  bindShipEvents();
  bindCalendarEvents();
  bindEnvReportEvents();
  loadBootstrap();
  applyInitialRouteFromLink();
});

function loadBootstrap(){
  document.getElementById('ganttBody').innerHTML = '<div class="loading">กำลังโหลดข้อมูล...</div>';
  google.script.run.withSuccessHandler(data => {
    state.bootstrap = data;
    try { TG.cache = {}; } catch (e) { /* ยังโหลดโมดูลไม่เสร็จ */ }
    state.projectModes = data.projectModes || {};
    populateFilterOptions();
    populateLoginDeptOptions();
    populateStatusOptions();
    renderYearLabel();
    renderOverview();
    try { renderArchiveCounts(); renderLinkMounts(); } catch (e) { /* ยังโหลดโมดูลไม่เสร็จ */ }
    try { applyProjectModes(); } catch (e) { /* ยังโหลดโมดูลไม่เสร็จ */ }
    prefetchTabs();
  }).withFailureHandler(showFatalError).getBootstrapData();
}

/* โหลดข้อมูลของแต่ละแท็บโครงการล่วงหน้าเบื้องหลัง (ทีละตัว เว้นระยะ) เพื่อให้กดเปิดแท็บแล้วเห็นข้อมูลทันที ไม่ต้องรอ */
function prefetchTabs(){
  if (state.prefetchStarted) return;
  state.prefetchStarted = true;
  const jobs = [
    () => { if (!state.ftfLoaded) loadFryToFlyData(); },
    () => { if (!state.ship.ftf.loaded) loadShip('ftf'); },
    () => { if (!state.cartridgeLoaded) loadCartridgeData(); },
    () => { if (!state.paperlessLoaded) loadPaperlessData(); },
    () => { if (!state.shr.loaded) loadShrData(); },
    () => { if (!state.ship.kit.loaded) loadShip('kit'); },
    () => { if (!state.cal.loaded) loadCalendar(); },
    () => { if (!EM.loaded) loadEm(); },
    () => { if (!CP.loaded) loadCp(); },
    () => { if (!state.envReportLoaded) loadEnvReportData(); }
  ];
  jobs.forEach((job, i) => setTimeout(() => { try { job(); } catch (e) { /* ปล่อยให้โหลดตอนเปิดแท็บแทน */ } }, 600 + i * 500));
}

function showFatalError(err){
  document.getElementById('ganttBody').innerHTML =
    '<div class="empty">โหลดข้อมูลไม่สำเร็จ: ' + escapeHtml(err.message || err) + '</div>';
}

function populateFilterOptions(){

  const depts = [...new Set(state.bootstrap.projects.map(p => p.ResponsibleUnit).filter(Boolean))];
  fillSelect('fCategory', cats, 'ทุกประเภทโครงการ');
  fillSelect('fDepartment', depts, 'ทุกหน่วยงาน');
  // คืนค่าตัวกรองที่เลือกไว้ (กรณีโหลดข้อมูลใหม่หลังบันทึก)
  document.getElementById('fCategory').value = state.filters.category;
  document.getElementById('fDepartment').value = state.filters.department;
}
function populateStatusOptions(){
  fillSelect('fStatus', state.bootstrap.statusCategories, 'ทุกสถานะ');
  fillSelect('lfStatusCategory', state.bootstrap.statusCategories, null);
  fillSelect('pfStatusCategory', state.bootstrap.statusCategories, null);
  document.getElementById('fStatus').value = state.filters.status;
}
function populateLoginDeptOptions(){
  const sel = document.getElementById('loginDept');
  sel.innerHTML = state.bootstrap.departments.map(d =>
    `<option value="${escapeHtml(d.DepartmentID)}">${escapeHtml(d.DepartmentName)}</option>`).join('');
}
function fillSelect(id, values, placeholder){
  const sel = document.getElementById(id);
  const opts = values.map(v => `<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join('');
  sel.innerHTML = (placeholder ? `<option value="">${placeholder}</option>` : '') + opts;
}

function renderYearLabel(){
  document.getElementById('yearLabel').textContent = 'ปี พ.ศ. ' + (state.year + 543);
}

/* ============================= GANTT: OVERVIEW ============================= */
function buildGanttHeaderHtml(){
  return '<div></div>' + THAI_MONTHS.map(m => `<div>${m}</div>`).join('');
}

function getFilteredProjects(){
  return state.bootstrap.projects.filter(p => {
    if (state.filters.category && p.Category !== state.filters.category) return false;
    if (state.filters.department && p.ResponsibleUnit !== state.filters.department) return false;
    if (state.filters.status && p.StatusCategory !== state.filters.status) return false;
    if (state.filters.search && !String(p.ProjectName || '').includes(state.filters.search)) return false;
    return true;
  });
}

function renderOverview(){
  document.getElementById('ganttHeader').innerHTML = buildGanttHeaderHtml();
  const projects = getFilteredProjects();
  const body = document.getElementById('ganttBody');

  if (projects.length === 0){
    body.innerHTML = '<div class="empty">ไม่พบโครงการตามเงื่อนไขที่เลือก</div>';
    renderSummary(projects);
    return;
  }

  const isAdmin = !!state.session;
  body.innerHTML = projects.map(p => {
    const bar = computeBarGeometry(p.StartDate, p.TargetDate, state.year);
    const barLabel = `${escapeHtml(p.StatusCategory || '')} ${p.Progress}%`;
    const barHtml = bar
      ? `<div class="gantt-bar bar-${statusClass(p.StatusCategory)} ${bar.ongoing ? 'bar-ongoing' : ''}"
              style="left:${bar.leftPct}%; width:${bar.widthPct}%;"
              onclick="openDetail('${p.ProjectID}')" title="${escapeHtml(p.CurrentStatus||'')}">
           ${barLabel}
         </div>`
      : '';
    const pinPct = computeDatePositionPct(p.LastLogDate, state.year);
    const pinHtml = pinPct !== null
      ? `<div class="gantt-status-pin" style="left:${pinPct}%;" onclick="openDetail('${p.ProjectID}')"
             title="บันทึกเมื่อ ${fmtDate(p.LastLogDate)}: ${escapeHtml(p.CurrentStatus || '')}">📌</div>`
      : '';
    const editBtn = isAdmin
      ? `<button class="row-detail-btn row-edit-btn" onclick="openProjectModal('${p.ProjectID}')">✏️ แก้ไขสถานะ/รายละเอียด</button>`
      : '';
    const lk = p.LinkKey ? LINK_TAB_META[p.LinkKey] : null;
    const liveHtml = lk
      ? `<span class="sub ov-live" title="${escapeHtml(p.AutoSummary || '')}">${p.StatusSource === 'manual' && p.AutoSummary ? '📊 ข้อมูลสดจากแท็บ: ' + escapeHtml(p.AutoSummary) : '🔄 อัปเดตอัตโนมัติจากแท็บโครงการ'}</span>
         <button class="row-detail-btn ov-go-tab" onclick="switchTab('${p.LinkKey}')">${lk.icon} ไปที่แท็บ${escapeHtml(lk.short)} ›</button>`
      : '';
    const tgChip = p.Target && p.Target.hasTarget
      ? `<span class="sub tg-chip tg-${tgClass(p.Target.annualPct)}" title="ผลจริงปีนี้ ${tgNum(p.Target.yearActual, p.Target.dec)} จากเป้า ${tgNum(p.Target.annualTarget, p.Target.dec)} ${escapeHtml(p.Target.unit)} • เทียบเป้าสะสมถึงเดือนนี้ ${p.Target.ytdPct === null ? '-' : p.Target.ytdPct + '%'}">🎯 ${tgPct(p.Target.annualPct)} ของเป้าหมายปี ${p.Target.year + 543}</span>`
      : (lk ? '<span class="sub tg-chip tg-none">🎯 ยังไม่ตั้งเป้าหมายรายเดือน</span>' : '');
    const arcBtn = isAdmin && p.StatusCategory === 'เสร็จสมบูรณ์'
      ? `<button class="row-detail-btn row-archive-btn" onclick="archiveProjectFromRow('${p.ProjectID}')">🗄️ เก็บเข้าคลัง</button>` : '';
    return `
      <div class="gantt-row">
        <div class="gantt-label">
          <canvas class="mini-donut" width="28" height="28" data-pct="${p.Progress}" data-color="${statusColorHex(p.StatusCategory)}"></canvas>
          <span onclick="openDetail('${p.ProjectID}')">${escapeHtml(p.ProjectName)}</span>
          <span class="sub">${escapeHtml(p.ResponsibleUnit || '')}</span>
          ${p.CurrentStatus ? `<span class="sub status-caption" title="${escapeHtml(p.CurrentStatus)}">📌 ${p.LastLogDate ? fmtDate(p.LastLogDate)+': ' : ''}${escapeHtml(p.CurrentStatus)}</span>` : ''}
          ${tgChip}
          ${liveHtml}
          <button class="row-detail-btn" onclick="openDetail('${p.ProjectID}')">ดูรายละเอียด ›</button>
          ${editBtn}${arcBtn}
        </div>
        <div class="gantt-track">${barHtml}${pinHtml}</div>
      </div>`;
  }).join('');

  body.querySelectorAll('.mini-donut').forEach(cv => {
    drawDonut(cv, Number(cv.dataset.pct), cv.dataset.color, { thickness: 4, noText: true });
  });

  renderSummary(projects);
}

/** สรุปภาพรวมทั้งหน้า */
function renderSummary(projects){
  renderKPI(projects);
  renderCategoryCards(projects);
  renderStatusCards(projects);
  renderYearTimeline(projects);
  renderAttention(projects);
}

/** การ์ด KPI: จำนวนทั้งหมด / ความคืบหน้าเฉลี่ย / แยกตามสถานะ */
function renderKPI(projects){
  const total = projects.length;
  const avg = total ? Math.round(projects.reduce((s,p) => s + (p.Progress || 0), 0) / total) : 0;
  const counts = groupCount(projects, 'StatusCategory');

  let html = `
    <div class="kpi-card"><div class="kpi-num">${total}</div><div class="kpi-label">โครงการทั้งหมด</div></div>
    <div class="kpi-card"><div class="kpi-num">${avg}%</div><div class="kpi-label">ความคืบหน้าเฉลี่ย</div></div>`;
  counts.forEach(([label, count]) => {
    html += `<div class="kpi-card kpi-${statusClass(label)}"><div class="kpi-num">${count}</div><div class="kpi-label">${escapeHtml(label)}</div></div>`;
  });
  document.getElementById('kpiRow').innerHTML = html;
}

/** สัดส่วนตามประเภท + Pie chart */
function renderCategoryCards(projects){
  const total = projects.length;
  const groups = {};
  projects.forEach(p => {
    const key = p.Category || 'ไม่ระบุ';
    if (!groups[key]) groups[key] = { count: 0, desc: '' };
    groups[key].count++;
    if (!groups[key].desc && p.Description) groups[key].desc = p.Description;
  });
  const entries = Object.entries(groups).sort((a,b) => b[1].count - a[1].count);
  const countEntries = entries.map(([label, info]) => [label, info.count]);

  document.getElementById('categorySubtitle').textContent =
    `${total} โครงการ แบ่งตาม ${entries.length} ด้านของงานสิ่งแวดล้อมโรงพยาบาล`;

  const pieEl = document.getElementById('categoryPie');
  const el = document.getElementById('categoryCards');
  if (entries.length === 0){
    pieEl.innerHTML = '';
    el.innerHTML = '<p class="muted">ไม่มีข้อมูล</p>';
    return;
  }
  pieEl.innerHTML = buildPieSvg(countEntries, total, (label, i) => categoryColorHex(i));

  el.innerHTML = entries.map(([label, info], i) => {
    const pct = total ? Math.round((info.count/total)*100) : 0;
    return `
      <div class="breakdown-item">
        <span class="bi-icon" style="background:${categoryColorHex(i)}">${categoryIcon(label)}</span>
        <div>
          <div class="bi-title">${escapeHtml(label)} • ${info.count} โครงการ (${pct}%)</div>
          ${info.desc ? `<div class="bi-sub">${escapeHtml(info.desc)}</div>` : ''}
        </div>
      </div>`;
  }).join('');
}

/** สัดส่วนตามสถานะ + Pie chart */
function renderStatusCards(projects){
  const total = projects.length;
  const groups = {};
  projects.forEach(p => {
    const key = p.StatusCategory || 'ไม่ระบุ';
    groups[key] = (groups[key] || 0) + 1;
  });
  const entries = Object.entries(groups).sort((a,b) => b[1]-a[1]);

  document.getElementById('statusSubtitle').textContent =
    `ความคืบหน้าการดำเนินงานของทั้ง ${total} โครงการ ณ ปัจจุบัน`;

  const pieEl = document.getElementById('statusPie');
  const el = document.getElementById('statusCards');
  if (entries.length === 0){
    pieEl.innerHTML = '';
    el.innerHTML = '<p class="muted">ไม่มีข้อมูล</p>';
    return;
  }
  pieEl.innerHTML = buildPieSvg(entries, total, label => statusColorHex(label));

  el.innerHTML = entries.map(([label, count]) => {
    const pct = total ? Math.round((count/total)*100) : 0;
    return `
      <div class="breakdown-item">
        <span class="bi-icon" style="background:${statusColorHex(label)}">${STATUS_ICON[label] || '•'}</span>

/** แผนภาพเส้นเวลาหลายปี พร้อมเส้น "ปัจจุบัน" */
function renderYearTimeline(projects){
  const withDates = projects.filter(p => p.StartDate);
  const container = document.getElementById('yearTimelineChart');
  if (withDates.length === 0){
    document.getElementById('yearTimelineSubtitle').textContent = 'ไม่มีข้อมูลระยะเวลาโครงการ';
    container.innerHTML = '';
    return;
  }

  const minDate = new Date(Math.min(...withDates.map(p => new Date(p.StartDate))));
  const maxDate = new Date(Math.max(...withDates.map(p => new Date(p.TargetDate || p.StartDate))));
  const rangeStart = new Date(minDate.getFullYear(), 0, 1);
  const rangeEnd = new Date(maxDate.getFullYear(), 11, 31, 23, 59, 59);
  const totalMs = rangeEnd - rangeStart;

  document.getElementById('yearTimelineSubtitle').textContent =
    `ระยะเวลาดำเนินการของแต่ละโครงการ (${fmtDate(rangeStart)} – ${fmtDate(rangeEnd)})`;

  const years = [];
  for (let y = minDate.getFullYear() + 543; y <= maxDate.getFullYear() + 543 + 1; y++) years.push(y);
  const axisHtml = years.map(y => {
    const pct = ((new Date(y - 543, 0, 1) - rangeStart) / totalMs) * 100;
    return `<span style="left:${Math.max(0,Math.min(100,pct))}%">${y}</span>`;
  }).join('');

  const now = new Date();
  const nowPct = (now >= rangeStart && now <= rangeEnd) ? ((now - rangeStart)/totalMs)*100 : null;
  const currentLineHtml = nowPct !== null
    ? `<div class="yt-current-line" style="left:${nowPct}%"></div><div class="yt-current-label" style="left:${nowPct}%">ปัจจุบัน</div>`
    : '';

  const rowsHtml = withDates.map(p => {
    const start = new Date(p.StartDate);
    const end = new Date(p.TargetDate || p.StartDate);
    const leftPct = ((start - rangeStart) / totalMs) * 100;
    const widthPct = Math.max(2, ((end - start) / totalMs) * 100);
    const color = statusColorHex(p.StatusCategory);
    return `
      <div class="yt-row">
        <div class="yt-label">
          <span class="yt-name">${categoryIcon(p.Category)} ${escapeHtml(p.ProjectName)}</span>
          <span class="yt-status" style="color:${color}; font-size:11px; font-weight:700;">${escapeHtml(p.StatusCategory || '')}</span>
        </div>
        <div class="yt-track" onclick="openDetail('${p.ProjectID}')" style="cursor:pointer;">
          <div class="yt-bar" style="left:${leftPct}%; width:${widthPct}%; background:${color};">${p.Progress}%</div>
        </div>
      </div>`;
  }).join('');

  container.innerHTML = `
    <div class="yt-chart-inner">
      <div class="yt-axis" style="margin-left:230px;">${axisHtml}</div>
      <div style="position:relative;">
        <div class="yt-current-line-wrap" style="position:absolute; left:230px; right:0; top:0; bottom:0;">${currentLineHtml}</div>
        ${rowsHtml}
      </div>
    </div>`;
}

/** โครงการที่ต้องเร่งติดตาม (สถานะล่าช้า เรียงตามวันกำหนดใกล้สุดก่อน) */
function getDelayedProjects(projects){
  return projects.filter(p => p.StatusCategory === 'ล่าช้า').sort((a,b) => {
    if (!a.TargetDate) return 1;
    if (!b.TargetDate) return -1;
    return new Date(a.TargetDate) - new Date(b.TargetDate);
  });
}

function groupCount(list, field){
  const map = {};
  list.forEach(p => {
    const key = p[field] || 'ไม่ระบุ';
    map[key] = (map[key] || 0) + 1;
  });
  return Object.entries(map).sort((a,b) => b[1]-a[1]);
}

/** ตำแหน่ง/ความกว้าง (%) ของแถบโครงการบนแกน 12 เดือนของปีที่เลือก (null ถ้าไม่ตกในปีนั้น) */
function computeBarGeometry(startStr, targetStr, year){
  const yearStart = new Date(year, 0, 1);
  const yearEnd = new Date(year, 11, 31, 23, 59, 59);
  const start = startStr ? new Date(startStr) : yearStart;
  let ongoing = false;
  let end;
  if (targetStr) {
    end = new Date(targetStr);
  } else {
    end = yearEnd;
    ongoing = true;
  }
  if (end < yearStart || start > yearEnd) return null;

  const clampedStart = start < yearStart ? yearStart : start;
  const clampedEnd = end > yearEnd ? yearEnd : end;

  const totalMs = yearEnd - yearStart;
  const leftPct = ((clampedStart - yearStart) / totalMs) * 100;
  let widthPct = ((clampedEnd - clampedStart) / totalMs) * 100;
  if (widthPct < 1.5) widthPct = 1.5;
  return { leftPct, widthPct, ongoing: ongoing || end > yearEnd };
}

/** ตำแหน่ง % ของวันที่ใดวันหนึ่งบนแกนเวลาของปีที่เลือก */
function computeDatePositionPct(dateStr, year){
  if (!dateStr) return null;
  const yearStart = new Date(year, 0, 1);
  const yearEnd = new Date(year, 11, 31, 23, 59, 59);
  const d = new Date(dateStr);
  if (d < yearStart || d > yearEnd) return null;
  return ((d - yearStart) / (yearEnd - yearStart)) * 100;
}

function humanizeDuration(startStr, endStr){
  if (!startStr || !endStr) return 'ไม่ระบุ';
  const start = new Date(startStr), end = new Date(endStr);
  let months = (end.getFullYear()-start.getFullYear())*12 + (end.getMonth()-start.getMonth());
  if (end.getDate() < start.getDate()) months--;
  if (months < 0) months = 0;
  const years = Math.floor(months/12);
  const remMonths = months % 12;
  if (years > 0 && remMonths > 0) return `${years} ปี ${remMonths} เดือน`;
  if (years > 0) return `${years} ปี`;
  if (remMonths > 0) return `${remMonths} เดือน`;
  const days = Math.max(1, Math.round((end-start)/(1000*60*60*24)));
  return `${days} วัน`;
}

const QA_STATUS_CLASS = { pending: 'qa-status-pending', 'answered-auto': 'qa-status-answered-auto', 'answered-admin': 'qa-status-answered-admin' };

function loadProjectQuestions(projectId){
  google.script.run.withSuccessHandler(renderQaList)

    const answerText = q.Status === 'answered-admin' ? q.AdminAnswer : q.AutoAnswer;

      ? `<div class="qa-answer">

  if (state.shr && state.shr.loaded) loadShrData();
  // ภาพกิจกรรม: แสดง/ซ่อนปุ่มเพิ่มรูปตามสิทธิ์ผู้ดูแลระบบ
  try { renderAllPhotoMounts(); } catch (e) { /* ยังโหลดโมดูลภาพไม่เสร็จ */ }
  try { renderLinkMounts(); if (state.archive && state.archive.list) renderArchive(); renderTargetBlock(document.getElementById('detailTarget')); } catch (e) { /* ยังโหลดโมดูลไม่เสร็จ */ }

  try { if (CP.loaded) renderCp(); } catch (e) { /* ยังโหลดโมดูลไม่เสร็จ */ }
  try { if (state.ftfLoaded) loadVerify('ftf'); if (state.cartridgeLoaded) loadVerify('cartridge'); } catch (e) { /* ยังโหลดโมดูลไม่เสร็จ */ }
  try { applyProjectModes(); if (state.session) loadCalSubs(); } catch (e) { /* ยังโหลดโมดูลไม่เสร็จ */ }
}

/* ============================= REPORT PDF (A4 แนวนอน หลายหน้า) ============================= */
const RP_TITLE = 'ระบบติดตามโครงการสิ่งแวดล้อมโรงพยาบาล';
const RP_TIMELINE_PER_PAGE = 12;   // จำนวนโครงการต่อหน้าใน Timeline หลายปี
const RP_GANTT_PER_PAGE = 6;       // จำนวนโครงการต่อหน้าใน Gantt รายเดือน
const RP_ATTENTION_PER_PAGE = 5;   // จำนวนโครงการล่าช้าต่อหน้า
const RP_FIRST_LOG_ROWS = 4;       // แถวประวัติในหน้าแรกของแต่ละโครงการ
const RP_NEXT_LOG_ROWS = 12;       // แถวประวัติในหน้าต่อ ๆ ไป
const RP_FTF_FIRST_ROWS = 14;      // แถวผู้เข้าร่วมทอดไม่ทิ้ง หน้าแรก (มี KPI)
const RP_FTF_NEXT_ROWS = 20;       // แถวผู้เข้าร่วมทอดไม่ทิ้ง หน้าต่อไป
const RP_FTF_TOP = 14;             // ในรายงานภาพรวมแสดงกี่อันดับแรก

function gsRun(fn, ...args){
  return new Promise((resolve, reject) => {
    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args);
  });
}
function chunkArray(arr, n){
  const out = [];
  for (let i = 0; i < arr.length; i += n) out.push(arr.slice(i, i + n));
  return out;
}
function stripOnclickHtml(html){
  return html.replace(/onclick="[^"]*"/g, '').replace(/\sid="[^"]*"/g, '');
}
function rpHeader(title, sub){
  return `<div class="rp-head"><h3 class="rp-title">${title}</h3><span class="rp-sub">${sub || ''}</span></div>`;
}
function printStatusBadge(cat){
  return `<span class="print-status-badge" style="background:${statusColorHex(cat)}">${escapeHtml(cat || '-')}</span>`;
}

/** ใส่หน้าทั้งหมดลง #printArea พร้อมเลขหน้า แล้วเปิดหน้าต่างพิมพ์ */
async function printPages(pages){
  const total = pages.length;
  document.getElementById('printArea').innerHTML = pages.map((html, i) => `
    <section class="rp-page">
      <div class="rp-body">${html}</div>
      <div class="rp-footer"><span>${RP_TITLE} • พิมพ์เมื่อ ${todayStrThai()}</span><span>หน้า ${i + 1} / ${total}</span></div>
    </section>`).join('');
  if (document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch (e) {} }
  setTimeout(() => window.print(), 400);
}

/** จุดเริ่มต้น: includeProjects=true → รายงานฉบับเต็ม (มีหน้ารายโครงการ) */
async function buildAndPrintReport(includeProjects){
  const projects = getFilteredProjects();
  if (projects.length === 0){ alert('ไม่มีข้อมูลให้ส่งออกตามตัวกรองที่เลือก'); return; }

  const btns = [...document.querySelectorAll('#btnExportPdf, #btnExportFullPdf')];
  const oldText = btns.map(b => b.textContent);
  btns.forEach(b => { b.disabled = true; b.textContent = '⏳ กำลังสร้างรายงาน...'; });

  try {
    let logsMap = {};
    if (includeProjects) logsMap = await gsRun('getReportLogsByProject');

    let ftf = state.ftfData || null;
    if (!ftf){
      try {
        ftf = await gsRun('getFryToFlyData');
        ftf.participants.forEach((p, i) => p.__rank = i + 1);
      } catch (e) { ftf = null; } // ดึงข้อมูลแคมเปญไม่ได้ ก็ข้ามหน้านั้นไป
    }

    const pages = [];
    pages.push(rpSummaryPage(projects, ftf));
    pages.push(...rpTimelinePages(projects));
    pages.push(...rpGanttPages(projects));
    pages.push(...rpAttentionPages(projects));
    pages.push(...rpFtfPages(ftf, { limit: RP_FTF_TOP, showPhone: false }));
    if (includeProjects){
      projects.forEach((p, i) => pages.push(...rpProjectPages(p, i + 1, logsMap[p.ProjectID] || [])));
    }

    await printPages(pages);
  } catch (err) {
    alertErr(err);
  } finally {
    btns.forEach((b, i) => { b.disabled = false; b.textContent = oldText[i]; });
  }
}

/* ---------- Timeline หลายปี (แบ่งหน้า) ---------- */
function rpTimelinePages(projects){
  const withDates = projects.filter(p => p.StartDate);
  if (withDates.length === 0) return [];

  const minDate = new Date(Math.min(...withDates.map(p => new Date(p.StartDate))));
  const maxDate = new Date(Math.max(...withDates.map(p => new Date(p.TargetDate || p.StartDate))));
  const rangeStart = new Date(minDate.getFullYear(), 0, 1);
  const rangeEnd = new Date(maxDate.getFullYear(), 11, 31, 23, 59, 59);
  const totalMs = rangeEnd - rangeStart;
  const pctOf = d => ((d - rangeStart) / totalMs) * 100;

  const years = [];
  for (let y = minDate.getFullYear(); y <= maxDate.getFullYear(); y++) years.push(y);
  const axisHtml = years.map(y => `<span style="left:${pctOf(new Date(y, 6, 1))}%">${y + 543}</span>`).join('');
  const gridHtml = years.map(y => `<div class="yt-grid" style="left:${pctOf(new Date(y, 0, 1))}%"></div>`).join('');

  const now = new Date();
  const nowHtml = (now >= rangeStart && now <= rangeEnd)
    ? `<div class="yt-current-line" style="left:${pctOf(now)}%"></div><div class="yt-current-label" style="left:${pctOf(now)}%">ปัจจุบัน</div>` : '';

  const chunks = chunkArray(withDates, RP_TIMELINE_PER_PAGE);
  return chunks.map((list, ci) => {
    const rows = list.map(p => {
      const s = new Date(p.StartDate), e = new Date(p.TargetDate || p.StartDate);
      const left = pctOf(s);
      const width = Math.max(2, ((e - s) / totalMs) * 100);
      const color = statusColorHex(p.StatusCategory);
      return `
        <div class="yt-row">
          <div class="yt-label">
            <span class="yt-name">${categoryIcon(p.Category)} ${escapeHtml(p.ProjectName)}</span>
            <span class="yt-status" style="color:${color}; font-size:11px; font-weight:700;">${escapeHtml(p.StatusCategory || '')}</span>
          </div>
          <div class="yt-track"><div class="yt-bar" style="left:${left}%; width:${width}%; background:${color};">${p.Progress}%</div></div>
        </div>`;
    }).join('');
    return `
      ${rpHeader('🗓️ แผนภาพเส้นเวลาโครงการ (Timeline)',
        `${fmtDate(rangeStart)} – ${fmtDate(rangeEnd)}${chunks.length > 1 ? ` • ส่วนที่ ${ci + 1}/${chunks.length}` : ''}`)}
      <div class="rp-yt-axis">${axisHtml}</div>
      <div class="rp-yt-rows">
        <div class="rp-yt-lines">${gridHtml}${nowHtml}</div>
        ${rows}
      </div>`;
  });
}

/* ---------- Gantt รายเดือน ---------- */
function rpGanttRow(p){
  const bar = computeBarGeometry(p.StartDate, p.TargetDate, state.year);
  const pinPct = computeDatePositionPct(p.LastLogDate, state.year);
  const barHtml = bar
    ? `<div class="print-gantt-bar" style="left:${bar.leftPct}%; width:${bar.widthPct}%; background:${statusColorHex(p.StatusCategory)};">${escapeHtml(p.CurrentStage || p.StatusCategory || '')}</div>
       ${bar.ongoing ? '' : `<div class="print-target-mark" style="left:${bar.leftPct + bar.widthPct}%;">🏁</div>`}`
    : '<span class="muted" style="font-size:10px;">นอกช่วงปีนี้</span>';
  const pinHtml = pinPct !== null ? `<div class="print-status-pin" style="left:${pinPct}%;">📌</div>` : '';
  return `
    <div class="print-gantt-row">
      <div class="print-gantt-label">
        <div class="print-proj-name">${escapeHtml(p.ProjectName)}</div>
        <div class="print-proj-meta">${escapeHtml(p.Category || '-')} • ${escapeHtml(p.ResponsibleUnit || '-')}</div>
        <div class="print-proj-meta">${printStatusBadge(p.StatusCategory)}
          <span class="print-stage-badge">ขั้นตอน: ${escapeHtml(p.CurrentStage || '-')}</span><strong>${p.Progress}%</strong></div>
        <div class="print-proj-status">📌 ${p.LastLogDate ? 'บันทึกเมื่อ ' + fmtDate(p.LastLogDate) + ': ' : 'ล่าสุด: '}${escapeHtml(p.CurrentStatus || '-')}</div>
        <div class="print-proj-meta">🏁 กำหนดแล้วเสร็จ: <strong>${fmtDate(p.TargetDate) || 'ไม่ระบุ'}</strong> | เริ่ม: ${fmtDate(p.StartDate)}</div>
      </div>
      <div class="print-gantt-track">${barHtml}${pinHtml}</div>
    </div>`;
}

function rpGanttPages(projects){
  const monthHeader = THAI_MONTHS.map(m => `<div>${m}</div>`).join('');
  const chunks = chunkArray(projects, RP_GANTT_PER_PAGE);
  return chunks.map((list, ci) => `
    ${rpHeader(`📊 รายละเอียดความคืบหน้ารายเดือน (ปี พ.ศ. ${state.year + 543})`, `ส่วนที่ ${ci + 1}/${chunks.length}`)}
    <div class="rp-legend">
      <span><i class="dot dot-notstarted"></i> ยังไม่เริ่ม</span><span><i class="dot dot-progress"></i> กำลังดำเนินการ</span>
      <span><i class="dot dot-delay"></i> ล่าช้า</span><span><i class="dot dot-done"></i> เสร็จสมบูรณ์</span>
      <span><i class="dot dot-hold"></i> ระงับ</span><span>📌 = บันทึกล่าสุด</span><span>🏁 = กำหนดแล้วเสร็จ</span>
    </div>
    <div class="print-gantt-wrap">
      <div class="print-gantt-header"><div></div>${monthHeader}</div>
      ${list.map(rpGanttRow).join('')}
    </div>`);
}

/* ---------- โครงการที่ต้องเร่งติดตาม ---------- */
function rpAttentionPages(projects){
  const delayed = getDelayedProjects(projects);
  if (delayed.length === 0) return [];
  const chunks = chunkArray(delayed, RP_ATTENTION_PER_PAGE);
  return chunks.map((list, ci) => `
    ${rpHeader('🚨 โครงการที่ต้องเร่งติดตาม',
      `สถานะล่าช้า ${delayed.length} โครงการ${chunks.length > 1 ? ` • ส่วนที่ ${ci + 1}/${chunks.length}` : ''}`)}
    <div class="attention-card">

/* ---------- สรุปแคมเปญ "ทอดไม่ทิ้ง" ---------- */
const FTF_LITERS_PER_GALLON = 4; // 1 แกลลอน = 4 ลิตร (ตรงกับค่าเริ่มต้นใน EnvironmentalSettings ฝั่งเซิร์ฟเวอร์)
function rpFtfKpiHtml(s){
  const liters = Math.round(s.totalReturned * FTF_LITERS_PER_GALLON);
  return `
    <div class="kpi-card"><div class="kpi-num">${s.totalParticipants}</div><div class="kpi-label">ผู้เข้าร่วมทั้งหมด</div></div>
    <div class="kpi-card"><div class="kpi-num">${s.totalReturned}</div><div class="kpi-label">แกลลอนที่บริจาคแล้ว</div></div>
    <div class="kpi-card"><div class="kpi-num">${liters.toLocaleString()}</div><div class="kpi-label">คิดเป็นลิตร (1 แกลลอน = 4 ลิตร)</div></div>
    <div class="kpi-card kpi-progress"><div class="kpi-num">${s.tierCounts.bronze}</div><div class="kpi-label">🥉 ระดับทองแดง</div></div>
    <div class="kpi-card kpi-progress"><div class="kpi-num">${s.tierCounts.silver}</div><div class="kpi-label">🥈 ระดับเงิน</div></div>
    <div class="kpi-card kpi-done"><div class="kpi-num">${s.tierCounts.gold}</div><div class="kpi-label">🥇 ระดับทอง</div></div>`;
}

function rpFtfTable(list, showPhone){
  const rows = list.map(p => {
    const meta = FTF_TIER_META[p.TierKey] || FTF_TIER_META.member;
    return `<tr>
      <td style="text-align:center;">${p.__rank}</td>
      <td>${meta.icon} ${escapeHtml(p.StaffName)}</td>
      <td>${escapeHtml(p.StaffCode)}</td>
      ${showPhone ? `<td>${escapeHtml(p.Phone || '-')}</td>` : ''}
      <td style="text-align:center;">${p.Returned} (${Math.round(p.Returned * FTF_LITERS_PER_GALLON).toLocaleString()} ล.)</td>
      <td style="text-align:center;">${p.Points}</td>
      <td><span class="print-status-badge" style="background:${FTF_TIER_COLOR[p.TierKey] || '#2e8b57'}">${escapeHtml(p.TierLabel)}</span></td></tr>`;
  }).join('');
  return `<table class="print-table">
    <thead><tr><th style="width:50px;">อันดับ</th><th>ชื่อ-นามสกุล</th><th>รหัส 7 หลัก</th>${showPhone ? '<th>เบอร์โทร</th>' : ''}<th>บริจาค (แกลลอน)</th><th>แต้มสะสม</th><th>ระดับ</th></tr></thead>
    <tbody>${rows}</tbody></table>`;
}

/**
 * opts.limit     : จำกัดจำนวนอันดับแรก (ไม่ใส่ = ทั้งหมด)
 * opts.showPhone : แสดงเบอร์โทรหรือไม่
 */
function rpFtfPages(ftf, opts){
  opts = opts || {};
  if (!ftf || !ftf.participants || ftf.participants.length === 0) return [];
  const s = ftf.summary;
  const list = opts.limit ? ftf.participants.slice(0, opts.limit) : ftf.participants;
  const sub = opts.limit && list.length < s.totalParticipants
    ? `แสดง ${list.length} อันดับแรก จากทั้งหมด ${s.totalParticipants} คน`
    : `ผู้เข้าร่วมทั้งหมด ${s.totalParticipants} คน`;

  const first = list.slice(0, RP_FTF_FIRST_ROWS);
  const restChunks = chunkArray(list.slice(RP_FTF_FIRST_ROWS), RP_FTF_NEXT_ROWS);

  const pages = [`
    ${rpHeader('🛢️ สรุปโครงการ "ทอดไม่ทิ้ง"', sub)}
    <div class="kpi-row print-kpi-row">${rpFtfKpiHtml(s)}</div>
    ${rpFtfTable(first, !!opts.showPhone)}`];
  restChunks.forEach((chunk, i) => {
    pages.push(`
      ${rpHeader('🛢️ สรุปโครงการ "ทอดไม่ทิ้ง" (ต่อ)', `หน้าต่อที่ ${i + 1}/${restChunks.length}`)}
      ${rpFtfTable(chunk, !!opts.showPhone)}`);
  });
  return pages;
}

/* ---------- หน้ารายโครงการ ---------- */
function rpProjectTimelineHtml(p, logs){
  if (!p.StartDate || !p.TargetDate) return '<p class="muted">ไม่ได้ระบุวันกำหนดแล้วเสร็จ</p>';
  const s = new Date(p.StartDate), e = new Date(p.TargetDate), span = e - s;
  if (span <= 0) return '';
  const color = statusColorHex(p.StatusCategory);
  const pos = d => Math.max(0, Math.min(100, ((d - s) / span) * 100));
  const pins = logs.map(l => `<div class="rp-tl-pin" style="left:${pos(new Date(l.LogDate))}%;"></div>`).join('');
  const now = new Date();
  const nowHtml = (now >= s && now <= e) ? `<div class="rp-tl-now" style="left:${pos(now)}%;"></div>` : '';
  return `
    <div class="rp-tl-track" style="background:${color};">${pins}${nowHtml}</div>
    <div class="single-timeline-dates"><span>${fmtDate(p.StartDate)}</span><span>● = วันที่บันทึกความคืบหน้า | เส้นประ = วันนี้</span><span>${fmtDate(p.TargetDate)}</span></div>`;
}

function rpLogTable(list){
  const rows = list.length === 0
    ? '<tr><td colspan="5">ยังไม่มีบันทึกความคืบหน้า</td></tr>'
    : list.map(l => `<tr>
        <td style="white-space:nowrap;">${fmtDate(l.LogDate)}</td>
        <td>${printStatusBadge(l.StatusCategory)}</td>
        <td style="text-align:center;">${l.Progress}%</td>
        <td>${escapeHtml(l.Stage || '-')}</td>
        <td class="rp-log-text">${escapeHtml(l.StatusText || '')}</td></tr>`).join('');
  return `<table class="print-table">
    <thead><tr><th style="width:80px;">วันที่</th><th style="width:100px;">สถานะ</th><th style="width:70px;">ความคืบหน้า</th><th style="width:120px;">ระยะ/ขั้นตอน</th><th>รายละเอียด</th></tr></thead>
    <tbody>${rows}</tbody></table>`;
}

const FTF_TIER_META = {
  gold:   { badge: 'tier-gold',   icon: '🥇' },
  silver: { badge: 'tier-silver', icon: '🥈' },
  bronze: { badge: 'tier-bronze', icon: '🥉' },
  member: { badge: 'tier-member', icon: '🌱' }
};
const FTF_TIER_COLOR = { gold: '#d4af37', silver: '#9aa0a6', bronze: '#cd7f32', member: '#2e8b57' };

function loadFryToFlyData(){
  document.getElementById('ftfLeaderboard').innerHTML = '<div class="loading">กำลังโหลดข้อมูล...</div>';
  google.script.run.withSuccessHandler(data => {
    state.ftfLoaded = true;
    data.participants.forEach((p, i) => p.__rank = i + 1); // เก็บอันดับจริงไว้ก่อนกรองค้นหา
    state.ftfData = data;
    renderFtfKpi(data.summary);
    try { renderVerifyNote('ftf', data.summary.pendingCount, data.summary.pendingReturned); loadVerify('ftf'); } catch (e) {}
    renderFtfLeaderboard(data.participants);
    const searchBox = document.getElementById('ftfSearchName');
    if (searchBox) searchBox.value = '';
  }).withFailureHandler(err => {
    document.getElementById('ftfLeaderboard').innerHTML =
      '<div class="empty">โหลดข้อมูลไม่สำเร็จ: ' + escapeHtml(err.message || err) + '</div>';
  }).getFryToFlyData();
}

function renderFtfKpi(summary){

}

function renderFtfLeaderboard(participants, totalCount){
  totalCount = (totalCount === undefined) ? participants.length : totalCount;
  document.getElementById('ftfLeaderboardSubtitle').textContent = (participants.length === totalCount)
    ? `ผู้เข้าร่วม ${totalCount} คน • เรียงตามแต้มสะสมสูงสุดก่อน`
    : `พบ ${participants.length} คน จากทั้งหมด ${totalCount} คน`;
  const el = document.getElementById('ftfLeaderboard');
  if (participants.length === 0){
    el.innerHTML = totalCount === 0
      ? '<p class="muted">ยังไม่มีผู้เข้าร่วมกิจกรรม เป็นคนแรกได้เลย!</p>'
      : '<p class="muted">ไม่พบผู้เข้าร่วมที่ตรงกับคำค้นหา</p>';
    return;
  }
  el.innerHTML = participants.map(p => {
    const meta = FTF_TIER_META[p.TierKey] || FTF_TIER_META.member;
    const rank = p.__rank;
    return `
      <div class="ftf-lb-row rank-${rank}">
        <div class="ftf-lb-rank">${rank}</div>
        <div class="ftf-lb-name">
          <div class="n">${meta.icon} ${escapeHtml(p.StaffName)}</div>
          <div class="s">รหัส ${escapeHtml(p.StaffCode)}${p.Phone ? ' • ' + escapeHtml(p.Phone) : ''}</div>
        </div>
        <div class="ftf-lb-donated">บริจาค ${p.Returned} แกลลอน (${Math.round(p.Returned * FTF_LITERS_PER_GALLON).toLocaleString()} ลิตร)<br>${p.Points} แต้ม</div>
        <span class="ftf-tier-badge ${meta.badge}">${escapeHtml(p.TierLabel)}</span>
      </div>`;
  }).join('');
}

function applyFtfSearch(){
  const all = (state.ftfData && state.ftfData.participants) || [];
  const q = document.getElementById('ftfSearchName').value.trim().toLowerCase();
  const filtered = q
    ? all.filter(p => String(p.StaffName).toLowerCase().includes(q) || String(p.StaffCode).toLowerCase().includes(q))

}

function submitGallonForm(){
  const staffCode = document.getElementById('gfStaffCode').value.trim();
  const name = document.getElementById('gfName').value.trim();
  const phone = document.getElementById('gfPhone').value.trim();
  const receivedQty = Number(document.getElementById('gfReceivedQty').value) || 0;
  const returnedQty = Number(document.getElementById('gfReturnedQty').value) || 0;
  const note = document.getElementById('gfNote').value.trim();
  const errEl = document.getElementById('gfError');
  errEl.classList.add('hidden');

  if (receivedQty <= 0 && returnedQty <= 0){
    errEl.textContent = 'กรุณาระบุจำนวนแกลลอนที่รับ หรือจำนวนที่คืน อย่างน้อย 1 ช่อง';
    errEl.classList.remove('hidden');
    return;
  }

  google.script.run.withSuccessHandler(res => {
    closeModals();
    const parts = [];
    if (receivedQty > 0) parts.push(`รับแกลลอน ${receivedQty} ใบ`);
    if (returnedQty > 0) parts.push(`ส่งคืน/บริจาคน้ำมัน ${returnedQty} แกลลอน`);
    const title = returnedQty > 0 && receivedQty > 0 ? 'ท่านบันทึกรับ–ส่งคืนเรียบร้อยแล้ว' : (returnedQty > 0 ? 'ท่านบันทึกส่งคืนเรียบร้อยแล้ว' : 'ท่านบันทึกรับแกลลอนเรียบร้อยแล้ว');
    showThanks({
      title: title,
      detail: `${escapeHtml(name)} (รหัส ${escapeHtml(staffCode)}) • ${parts.join(' และ ')}`,
      wait: 'รอผู้ดูแลระบบยืนยันอีกครั้ง' + (returnedQty > 0 ? ` — แต้มสะสม +${res.pointsEarned} แต้ม จะแสดงหลังผู้ดูแลระบบยืนยัน` : ' — รายการจะแสดงหลังผู้ดูแลระบบยืนยัน'),
      proj: 'โครงการ "ทอดไม่ทิ้ง" 💚',
      more: openGallonFormModal
    });
    showFtfConfirm(`✅ ${title} (${parts.join(' และ ')}) — รอผู้ดูแลระบบยืนยันอีกครั้ง ขอบคุณที่ร่วมเป็นผู้ร่วมรักษาสิ่งแวดล้อมไปด้วยกัน 💚`);
    loadFryToFlyDataForce();
  }).withFailureHandler(err => {
    errEl.textContent = err.message || String(err);
    errEl.classList.remove('hidden');
  }).submitFryToFlyCombined(staffCode, name, phone, receivedQty, returnedQty, note);
}

  card.classList.toggle('hidden');
  if (wasHidden) renderShareLink();
}

function renderShareLink(){
  const link = getGallonFormLink();
  document.getElementById('ftfShareLinkInput').value = link;

  const qrUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=' + encodeURIComponent(link);
  document.getElementById('ftfQrImg').src = qrUrl;
  document.getElementById('ftfQrDownload').href = qrUrl;
  document.getElementById('ftfCopyConfirm').classList.add('hidden');
}

function copyShareLink(){
  const input = document.getElementById('ftfShareLinkInput');
  const confirmEl = document.getElementById('ftfCopyConfirm');
  const showConfirm = () => {
    confirmEl.classList.remove('hidden');
    setTimeout(() => confirmEl.classList.add('hidden'), 2500);
  };

  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(input.value).then(showConfirm).catch(() => fallbackCopy(input, showConfirm));
  } else {
    fallbackCopy(input, showConfirm);
  }
}

function fallbackCopy(input, onDone){
  input.removeAttribute('readonly');
  input.select();
  input.setSelectionRange(0, 99999);
  try { document.execCommand('copy'); onDone(); }
  catch (e) { alert('คัดลอกไม่สำเร็จ กรุณาคัดลอกด้วยตนเอง: ' + input.value); }
  input.setAttribute('readonly', 'readonly');
}

/** เปิดแท็บ/ฟอร์มอัตโนมัติถ้ามาจากลิงก์ตรง เช่น .../exec?page=frytofly&action=form */
function applyInitialRouteFromLink(){
  if (typeof INITIAL_PAGE === 'undefined') return;
  if (INITIAL_PAGE === 'frytofly'){
    switchTab('frytofly');
    if (INITIAL_ACTION === 'form'){
      setTimeout(openGallonFormModal, 300);
    }
  }
  if (INITIAL_PAGE === 'cartridge'){
    switchTab('cartridge');
    if (INITIAL_ACTION === 'form'){
      setTimeout(openCtgContributeModal, 300);
    }
  }
  if (INITIAL_PAGE === 'kitchen') switchTab('kitchen');
  if (['paperless', 'envreport', 'archive', 'projects'].indexOf(INITIAL_PAGE) !== -1) switchTab(INITIAL_PAGE);
  if ((INITIAL_PAGE === 'em' || INITIAL_PAGE === 'compost') && (INITIAL_ACTION === 'request' || INITIAL_ACTION === 'receive')){
    const pk = INITIAL_PAGE; switchTab(pk);
    if (INITIAL_ACTION === 'request') setTimeout(() => openRqForm(pk), 600);
    else setTimeout(() => openRqReceive(pk, typeof INITIAL_RID !== 'undefined' ? INITIAL_RID : '', typeof INITIAL_TOKEN !== 'undefined' ? INITIAL_TOKEN : ''), 400);
    return;
  }
  if (INITIAL_PAGE === 'compost'){ switchTab('compost'); if (INITIAL_ACTION === 'use') setTimeout(openCpUseForm, 400); if (INITIAL_ACTION === 'log') setTimeout(openCpLogForm, 400); }
  if (INITIAL_PAGE === 'em'){ switchTab('em'); if (INITIAL_ACTION === 'use') setTimeout(openEmUseForm, 400); if (INITIAL_ACTION === 'log') setTimeout(openEmLogForm, 400); }
  if (INITIAL_PAGE === 'calendar'){
    switchTab('calendar');
    if (INITIAL_ACTION === 'form') setTimeout(openCalSubmit, 300);
  }
  if (INITIAL_PAGE === 'share'){
    // action=form → เปิดฟอร์มส่งรายการเข้าโครงการ, action=stock → เปิดหน้าตรวจสอบรายการคงเหลือ
    if (INITIAL_ACTION === 'form' || INITIAL_ACTION === 'stock') state.shr.pendingAction = INITIAL_ACTION;
    if (INITIAL_ACTION === 'stock') state.shr.sub = 'stock';
    switchTab('share');
    if (INITIAL_ACTION === 'form') openShrSubmitModal();
  }
}

function fmtDate(iso){
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()+543}`;
}
function escapeHtml(str){
  return String(str ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------- KPI ---------- */
function renderPaperlessKpi(data){
  const deptCount = data.departments.length;
  const html = `
    <div class="kpi-card kpi-paper"><div class="kpi-num">${deptCount}</div><div class="kpi-label">หน่วยงานที่เข้าร่วม</div></div>
    <div class="kpi-card kpi-paper"><div class="kpi-num">${data.grandTotalItemCount.toLocaleString()}</div><div class="kpi-label">จำนวนเรื่องรวม (ปีนี้)</div></div>
    <div class="kpi-card kpi-paper"><div class="kpi-num">📄 ${data.grandTotalSheetsReduced.toLocaleString()}</div><div class="kpi-label">กระดาษที่ลดลงรวม (แผ่น)</div></div>`;
  document.getElementById('plKpiRow').innerHTML = html;
}

/* ---------- กราฟแนวโน้มรายเดือน (แท่ง) ---------- */
function renderPaperlessTrendChart(data){
  const monthNames = data.monthNames || PL_MONTH_NAMES_FALLBACK;
  const values = data.monthlyTotals.map(m => m.sheetsReduced);
  const max = Math.max(1, ...values);
  const peakIndex = values.indexOf(max);
  document.getElementById('plTrendSubtitle').textContent =
    `ปี พ.ศ. ${data.year + 543} • รวมทั้งปี ${data.grandTotalSheetsReduced.toLocaleString()} แผ่น`;

  const bars = values.map((v, i) => {
    const pct = Math.max(2, Math.round((v / max) * 100));
    const isPeak = v > 0 && i === peakIndex;
    return `
      <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;">
        <div style="font-size:11px; color:${isPeak ? 'var(--paper-blue-700)' : 'var(--gray-500)'}; font-weight:${isPeak ? '700' : '400'};">
          ${isPeak ? '📄 ' : ''}${v ? v.toLocaleString() : ''}
        </div>
        <div style="width:100%; height:120px; display:flex; align-items:flex-end; background-image:linear-gradient(to top, var(--gray-200) 1px, transparent 1px); background-size:100% 40px;">
          <div style="width:100%; background:linear-gradient(180deg,var(--paper-blue-500),var(--paper-blue-700)); border-radius:6px 6px 2px 2px;
                      height:${v > 0 ? pct : 0}%; min-height:${v > 0 ? '4px' : '0'};
                      box-shadow:${isPeak ? '0 0 0 2px var(--paper-blue-100)' : 'none'};"></div>
        </div>
        <div style="font-size:11px; color:var(--gray-500);">${monthNames[i].slice(0,3)}</div>
      </div>`;
  }).join('');

  document.getElementById('plTrendChart').innerHTML =
    `<div style="display:flex; gap:6px; align-items:flex-end; border-bottom:1px solid var(--gray-200); padding-bottom:2px;">${bars}</div>`;
}

/* ---------- อันดับหน่วยงาน ---------- */
function renderPaperlessRank(data){
  const el = document.getElementById('plRankList');
  document.getElementById('plRankSubtitle').textContent =
    `เรียงลำดับจากปริมาณกระดาษที่ลดลงรวมสูงสุด • ปี พ.ศ. ${data.year + 543} • ${data.departments.length} หน่วยงาน`;

  if (data.departments.length === 0){
    el.innerHTML = '<div class="empty">ยังไม่มีข้อมูลหน่วยงาน Paperless</div>';
    return;
  }

  const isAdmin = !!state.paperlessSession;
  const curMonth = new Date().getMonth() + 1;
  const max = Math.max(1, ...data.departments.map(d => d.totalSheetsReduced));
  el.innerHTML = data.departments.map(d => {
    const pct = Math.round((d.totalSheetsReduced / max) * 100);
    const editBtn = isAdmin
      ? `<button class="row-edit-btn" style="margin-left:10px; background:none; border:none; cursor:pointer;"
            onclick="event.stopPropagation(); openPaperlessLogModal('${d.DepartmentID}', ${data.year}, ${curMonth})">✏️ บันทึกข้อมูล</button>`
      : '';
    return `
      <div class="pl-rank-row rank-${d.rank}" onclick="openPaperlessDetail('${d.DepartmentID}')">
        <div class="pl-rank-num">${d.rank}</div>
        <div class="pl-rank-name" title="${escapeHtml(d.DepartmentName)}">${escapeHtml(d.DepartmentName)}</div>
        <div class="pl-rank-bar-track"><span class="pl-rank-bar-fill" style="width:${pct}%;"></span></div>
        <div class="pl-rank-val"><b>${d.totalSheetsReduced.toLocaleString()}</b> แผ่น • ${d.totalItemCount.toLocaleString()} เรื่อง</div>
        ${editBtn}
      </div>`;
  }).join('');
}

/* ---------- รายงานสรุปประจำเดือน (สะสม) ---------- */
function loadPaperlessMonthlyReport(){
  const el = document.getElementById('plMonthlyReportList');
  el.innerHTML = '<div class="loading">กำลังโหลดข้อมูล...</div>';
  google.script.run.withSuccessHandler(data => {
    state.paperlessMonthlyData = data;
    renderPaperlessMonthlyReport(data);
  }).withFailureHandler(err => {
    el.innerHTML = '<div class="empty">โหลดข้อมูลไม่สำเร็จ: ' + escapeHtml(err.message || err) + '</div>';
  }).getPaperlessMonthlyReportData(state.paperlessYear, state.paperlessMonthlyMonth);
}

function renderPaperlessMonthlyReport(data){
  const el = document.getElementById('plMonthlyReportList');
  if (data.rows.length === 0){
    el.innerHTML = '<div class="empty">ยังไม่มีข้อมูล</div>';
    return;
  }
  const isAdmin = !!state.paperlessSession;
  const max = Math.max(1, ...data.rows.map(r => r.cumulativeSheetsReduced));
  el.innerHTML = `
    <p class="muted" style="margin:0 0 10px;">สะสมเดือนมกราคม – ${escapeHtml(data.monthName)} • รวม ${data.grandTotalSheetsReduced.toLocaleString()} แผ่น (${data.grandTotalItemCount.toLocaleString()} เรื่อง)</p>` +
    data.rows.map(r => {
      const pct = Math.round((r.cumulativeSheetsReduced / max) * 100);
      const editBtn = isAdmin
        ? `<button class="row-edit-btn" style="margin-left:10px; background:none; border:none; cursor:pointer;"
              onclick="event.stopPropagation(); openPaperlessLogModal('${r.DepartmentID}', ${data.year}, ${data.month})">✏️ บันทึกข้อมูล</button>`
        : '';
      return `
        <div class="pl-rank-row rank-${r.rank}" onclick="openPaperlessDetail('${r.DepartmentID}')">
          <div class="pl-rank-num">${r.rank}</div>
          <div class="pl-rank-name" title="${escapeHtml(r.DepartmentName)}">${escapeHtml(r.DepartmentName)}</div>
          <div class="pl-rank-bar-track"><span class="pl-rank-bar-fill" style="width:${pct}%;"></span></div>
          <div class="pl-rank-val"><b>${r.cumulativeSheetsReduced.toLocaleString()}</b> แผ่น • ${r.cumulativeItemCount.toLocaleString()} เรื่อง</div>
          ${editBtn}
        </div>`;
    }).join('');
}

/* ---------- หน้ารายงานสรุปแต่ละหน่วยงาน (รายละเอียด) ---------- */
function openPaperlessDetail(departmentId){
  state.paperlessCurrentDeptId = departmentId;

  }).getPaperlessDepartmentDetail(departmentId, state.paperlessYear);
}

function renderPaperlessDetail(detail){
  document.getElementById('plDName').textContent = detail.departmentName;
  document.getElementById('plDTotalItems').textContent = detail.totalItemCount.toLocaleString();
  document.getElementById('plDTotalSheets').textContent = detail.totalSheetsReduced.toLocaleString();

  const rankRow = (state.paperlessBootstrap?.departments || []).find(d => d.DepartmentID === detail.departmentId);
  document.getElementById('plDRank').textContent = rankRow ? ('#' + rankRow.rank) : '-';

  // สิทธิ์แก้ไขเหมือนโครงการอื่นๆ: ล็อกอินด้วย PIN ของหน่วยงานใดก็ได้ (เช่น ฝ่ายบริหารงานทั่วไป)
  // แล้วบันทึก/แก้ไขข้อมูลของหน่วยงานใดก็ได้ ไม่จำกัดเฉพาะหน่วยงานของตัวเอง
  const isAdmin = !!state.paperlessSession;
  const ownerChip = document.getElementById('plDetailOwnerChip');
  ownerChip.classList.toggle('hidden', !isAdmin);
  if (isAdmin) ownerChip.textContent = '👤 ' + state.paperlessSession.departmentName + ' (ผู้บันทึกข้อมูล)';

  document.getElementById('plDMonthRows').innerHTML = detail.months.map(m => {
    const hasData = m.itemCount > 0 || m.sheetsReduced > 0 || m.updatedAt;
    const editBtn = isAdmin
      ? `<button class="pl-month-edit-btn" onclick="openPaperlessLogModal('${detail.departmentId}', ${detail.year}, ${m.month})">✏️ แก้ไข</button>`
      : '';
    return `
      <tr class="${hasData ? '' : 'pl-month-empty'}">
        <td>${escapeHtml(m.monthName)}</td>
        <td>${hasData ? m.itemCount.toLocaleString() : '-'}</td>
        <td>${hasData ? m.sheetsReduced.toLocaleString() : '-'}</td>
        <td>${escapeHtml(m.recordedByName || '')}</td>
        <td>${editBtn}</td>
      </tr>`;
  }).join('');
}

  document.getElementById('tabPaperless').classList.add('hidden');
  document.getElementById('tabPaperlessDetail').classList.remove('hidden');
}

/* ---------- เข้าสู่ระบบ / ออกจากระบบหน่วยงาน ---------- */
function openPaperlessLoginModal(){
  if (!state.paperlessBootstrap){ alert('กำลังโหลดข้อมูล กรุณารอสักครู่แล้วลองใหม่'); return; }
  document.getElementById('plLoginPin').value = '';
  document.getElementById('plLoginError').classList.add('hidden');
  openModal('modalPlLogin');
}

function doPaperlessLogin(){
  const departmentId = document.getElementById('plLoginDept').value;
  const pin = document.getElementById('plLoginPin').value;
  const errEl = document.getElementById('plLoginError');
  errEl.classList.add('hidden');

  if (!departmentId){
    errEl.textContent = 'ไม่พบรายชื่อหน่วยงานให้เลือก';
    errEl.classList.remove('hidden');
    return;
  }

  google.script.run.withSuccessHandler(res => {
    if (!res.ok){
      errEl.textContent = res.message || 'PIN ไม่ถูกต้อง';
      errEl.classList.remove('hidden');
      return;
    }
    state.paperlessSession = { departmentId: res.departmentId, departmentName: res.departmentName, pin: pin };
    document.getElementById('plLoginPin').value = '';
    closeModals();
    updatePaperlessAuthUI();
    if (state.paperlessCurrentDetail) renderPaperlessDetail(state.paperlessCurrentDetail);
    alert('เข้าสู่ระบบสำเร็จ: ' + res.departmentName + '\nตอนนี้สามารถบันทึก/แก้ไขข้อมูลประจำเดือนของหน่วยงานใดก็ได้ (เหมือนระบบติดตามโครงการอื่นๆ)');
  }).withFailureHandler(err => {
    errEl.textContent = err.message || String(err);
    errEl.classList.remove('hidden');
  }).verifyPaperlessPin(departmentId, pin);
}

function paperlessLogout(){
  state.paperlessSession = null;
  updatePaperlessAuthUI();
  if (state.paperlessCurrentDetail) renderPaperlessDetail(state.paperlessCurrentDetail);
}

function updatePaperlessAuthUI(){
  const isLoggedIn = !!state.paperlessSession;
  document.getElementById('btnPlOpenLogin').classList.toggle('hidden', isLoggedIn);
  document.getElementById('btnPlLogout').classList.toggle('hidden', !isLoggedIn);
  const chip = document.getElementById('plLoggedInChip');
  chip.classList.toggle('hidden', !isLoggedIn);
  if (isLoggedIn) chip.textContent = '👤 ' + state.paperlessSession.departmentName;
  // แสดง/ซ่อนปุ่มแก้ไขข้อมูลในอันดับและรายงานสะสม ทันทีที่สถานะล็อกอินเปลี่ยน
  if (state.paperlessBootstrap) renderPaperlessRank(state.paperlessBootstrap);
  if (state.paperlessMonthlyData) renderPaperlessMonthlyReport(state.paperlessMonthlyData);
}

/* ---------- บันทึก/แก้ไขข้อมูลประจำเดือน ----------
   รูปแบบสิทธิ์เหมือนโครงการอื่นๆ: ล็อกอินด้วย PIN ของหน่วยงานใดก็ได้ (เช่น ฝ่ายบริหารงานทั่วไป ทำหน้าที่
   เป็นผู้ดูแลระบบ/ผู้บันทึกข้อมูลกลาง) แล้วสามารถบันทึก/แก้ไขข้อมูลของหน่วยงานปลายทาง (departmentId
   ที่ส่งเข้ามา) ได้ทุกหน่วยงาน ไม่จำกัดเฉพาะหน่วยงานของผู้ที่ล็อกอิน */
function openPaperlessLogModal(departmentId, year, month){
  if (!state.paperlessSession){ alert('กรุณาเข้าสู่ระบบก่อนบันทึกข้อมูล'); return; }

  const monthNames = (state.paperlessBootstrap && state.paperlessBootstrap.monthNames) || PL_MONTH_NAMES_FALLBACK;
  document.getElementById('plfMonth').innerHTML = monthNames.map((name, i) =>
    `<option value="${i + 1}">${name}</option>`).join('');

  // หาชื่อหน่วยงานปลายทางที่กำลังจะบันทึกข้อมูลให้ (อาจไม่ใช่หน่วยงานของผู้ล็อกอิน)
  const targetFromBootstrap = (state.paperlessBootstrap && state.paperlessBootstrap.departments || [])
    .find(d => d.DepartmentID === departmentId);
  const targetDeptName = (state.paperlessCurrentDetail && state.paperlessCurrentDetail.departmentId === departmentId)
    ? state.paperlessCurrentDetail.departmentName
    : (targetFromBootstrap ? targetFromBootstrap.DepartmentName : departmentId);

  document.getElementById('plfDepartmentId').value = departmentId;
  document.getElementById('plfDepartmentName').value = targetDeptName;
  document.getElementById('plfYear').value = year || state.paperlessYear;
  document.getElementById('plfMonth').value = month || (new Date().getMonth() + 1);

  // ถ้ามีข้อมูลเดือนนี้อยู่แล้ว (จากหน้ารายละเอียดที่เปิดอยู่) ให้เติมค่าเดิมมาแก้ไข
  const existing = (state.paperlessCurrentDetail && state.paperlessCurrentDetail.departmentId === departmentId)
    ? state.paperlessCurrentDetail.months.find(m => m.month === month)
    : null;
  document.getElementById('plfItemCount').value = (existing && existing.itemCount) || 0;
  document.getElementById('plfSheetsReduced').value = (existing && existing.sheetsReduced) || 0;
  document.getElementById('plfRecordedByName').value = (existing && existing.recordedByName) || state.paperlessSession.departmentName;
  document.getElementById('plfNote').value = (existing && existing.note) || '';

  document.getElementById('plLogError').classList.add('hidden');
  openModal('modalPlLog');
}

function savePaperlessLog(){
  const errEl = document.getElementById('plLogError');
  errEl.classList.add('hidden');
  if (!state.paperlessSession){ alert('กรุณาเข้าสู่ระบบก่อนบันทึกข้อมูล'); return; }

  const targetDepartmentId = document.getElementById('plfDepartmentId').value;
  const year = Number(document.getElementById('plfYear').value);
  const month = Number(document.getElementById('plfMonth').value);
  const itemCount = Number(document.getElementById('plfItemCount').value) || 0;
  const sheetsReduced = Number(document.getElementById('plfSheetsReduced').value) || 0;
  const note = document.getElementById('plfNote').value.trim();
  const recordedByName = document.getElementById('plfRecordedByName').value.trim();

  const { departmentId: authDepartmentId, pin } = state.paperlessSession;
  google.script.run.withSuccessHandler(() => {
    closeModals();
    loadPaperlessData();
    if (state.paperlessCurrentDeptId === targetDepartmentId) openPaperlessDetail(targetDepartmentId);
  }).withFailureHandler(err => {
    errEl.textContent = err.message || String(err);
    errEl.classList.remove('hidden');
  }).submitPaperlessLog(authDepartmentId, pin, targetDepartmentId, year, month, itemCount, sheetsReduced, note, recordedByName);
}

/* ---------- ส่งออก Excel ---------- */
function exportPaperlessExcel(){
  const data = state.paperlessBootstrap;
  if (!data || data.departments.length === 0){ alert('ไม่มีข้อมูลให้ส่งออก'); return; }
  const monthNames = data.monthNames || PL_MONTH_NAMES_FALLBACK;

  const rows = data.departments.map(d => {
    const row = { 'อันดับ': d.rank, 'หน่วยงาน': d.DepartmentName };
    d.months.forEach((m, i) => {
      row[`${monthNames[i]} (เรื่อง)`] = m.itemCount;
      row[`${monthNames[i]} (แผ่น)`] = m.sheetsReduced;
    });
    row['รวมจำนวนเรื่อง'] = d.totalItemCount;
    row['รวมกระดาษที่ลดลง (แผ่น)'] = d.totalSheetsReduced;
    return row;
  });

  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, `Paperless ${data.year + 543}`);
  XLSX.writeFile(wb, `โครงการ_Paperless_${data.year}_${todayStr()}.xlsx`);
}

/* ---------- ส่งออก PDF (A4 แนวนอน) ---------- */
async function exportPaperlessPDF(){
  const data = state.paperlessBootstrap;
  if (!data || data.departments.length === 0){ alert('ไม่มีข้อมูลให้ส่งออก'); return; }

  const btn = document.getElementById('btnPlExportPdf');
  const oldText = btn.textContent;
  btn.disabled = true; btn.textContent = '⏳ กำลังสร้างรายงาน...';

  try {
    let monthlyData = state.paperlessMonthlyData;
    if (!monthlyData) monthlyData = await gsRun('getPaperlessMonthlyReportData', state.paperlessYear, state.paperlessMonthlyMonth);

    const pages = [];
    pages.push(rpPaperlessSummaryPage(data));
    pages.push(...chunkArray(data.departments, 14).map((chunk, ci, all) =>
      rpPaperlessRankPage(chunk, data, ci, all.length)));
    pages.push(...chunkArray(monthlyData.rows, 16).map((chunk, ci, all) =>
      rpPaperlessMonthlyPage(chunk, monthlyData, ci, all.length)));

    await printPages(pages);
  } catch (err) {
    alertErr(err);
  } finally {
    btn.disabled = false; btn.textContent = oldText;
  }
}

function rpPaperlessSummaryPage(data){
  const kpiHtml = `
    <div class="kpi-card"><div class="kpi-num">${data.departments.length}</div><div class="kpi-label">หน่วยงานที่เข้าร่วม</div></div>
    <div class="kpi-card"><div class="kpi-num">${data.grandTotalItemCount.toLocaleString()}</div><div class="kpi-label">จำนวนเรื่องรวม</div></div>
    <div class="kpi-card kpi-done"><div class="kpi-num">${data.grandTotalSheetsReduced.toLocaleString()}</div><div class="kpi-label">กระดาษที่ลดลงรวม (แผ่น)</div></div>`;
  const monthNames = data.monthNames || PL_MONTH_NAMES_FALLBACK;
  const tableRows = monthNames.map((name, i) => `
    <tr><td>${name}</td><td style="text-align:right;">${data.monthlyTotals[i].itemCount.toLocaleString()}</td><td style="text-align:right;">${data.monthlyTotals[i].sheetsReduced.toLocaleString()}</td></tr>`).join('');
  return `
    ${rpHeader('📄 โครงการ Paperless — ภาพรวม', `ปี พ.ศ. ${data.year + 543} • พิมพ์เมื่อ ${todayStrThai()}`)}
    <div class="kpi-row print-kpi-row">${kpiHtml}</div>
    <table class="print-table" style="margin-top:10px;">
      <thead><tr><th>เดือน</th><th style="text-align:right;">จำนวนเรื่อง</th><th style="text-align:right;">กระดาษที่ลดลง (แผ่น)</th></tr></thead>
      <tbody>${tableRows}</tbody>
    </table>`;
}

function rpPaperlessRankRowHtml(d, rank, name, total, sub, max){
  const pct = Math.round((total / max) * 100);
  return `
    <div class="rp-pl-rank-row">
      <div class="rp-pl-rank-num">${rank}</div>
      <div class="rp-pl-rank-name">${escapeHtml(name)}</div>
      <div class="rp-pl-rank-bar-track"><span class="rp-pl-rank-bar-fill" style="width:${pct}%;"></span></div>
      <div class="rp-pl-rank-val"><b>${total.toLocaleString()}</b> แผ่น${sub ? ' • ' + sub : ''}</div>
    </div>`;
}

function rpPaperlessRankPage(chunk, data, pageIndex, totalPages){
  const max = Math.max(1, ...data.departments.map(d => d.totalSheetsReduced));
  const rows = chunk.map(d => rpPaperlessRankRowHtml(d, d.rank, d.DepartmentName, d.totalSheetsReduced, d.totalItemCount.toLocaleString() + ' เรื่อง', max)).join('');
  return `
    ${rpHeader('🏆 ภาพรวมโครงการ — เรียงลำดับหน่วยงาน', `ปี พ.ศ. ${data.year + 543} • ส่วนที่ ${pageIndex + 1}/${totalPages}`)}
    ${rows}`;
}

function rpPaperlessMonthlyPage(chunk, monthlyData, pageIndex, totalPages){
  const max = Math.max(1, ...monthlyData.rows.map(r => r.cumulativeSheetsReduced));
  const rows = chunk.map(r => rpPaperlessRankRowHtml(r, r.rank, r.DepartmentName, r.cumulativeSheetsReduced, r.cumulativeItemCount.toLocaleString() + ' เรื่อง', max)).join('');
  return `
    ${rpHeader('🗓️ รายการสรุปประจำเดือน (สะสม)', `สะสม ม.ค. – ${escapeHtml(monthlyData.monthName)} ${monthlyData.year + 543} • ส่วนที่ ${pageIndex + 1}/${totalPages}`)}
    ${rows}`;
}

/* ---------- กราฟแนวโน้มรายเดือน (แท่ง) ---------- */
function renderCartridgeTrendChart(data){
  const monthNames = data.monthNames || PL_MONTH_NAMES_FALLBACK;
  const values = data.monthlyTotals.map(m => m.amount);
  const max = Math.max(1, ...values);
  const peakIndex = values.indexOf(max);
  const yearTotal = data.monthlyTotals.reduce((s, m) => s + m.amount, 0);
  document.getElementById('ctgTrendSubtitle').textContent =
    `ปี พ.ศ. ${data.year + 543} • รวมทั้งปี ${yearTotal.toLocaleString()} บาท`;

  const bars = values.map((v, i) => {
    const pct = Math.max(2, Math.round((v / max) * 100));
    const isPeak = v > 0 && i === peakIndex;
    return `
      <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;">
        <div style="font-size:11px; color:${isPeak ? 'var(--ink-700)' : 'var(--gray-500)'}; font-weight:${isPeak ? '700' : '400'};">
          ${isPeak ? '🖨️ ' : ''}${v ? v.toLocaleString() : ''}
        </div>
        <div style="width:100%; height:120px; display:flex; align-items:flex-end; background-image:linear-gradient(to top, var(--gray-200) 1px, transparent 1px); background-size:100% 40px;">
          <div style="width:100%; background:linear-gradient(180deg,var(--ink-500),var(--ink-700)); border-radius:6px 6px 2px 2px;
                      height:${v > 0 ? pct : 0}%; min-height:${v > 0 ? '4px' : '0'};
                      box-shadow:${isPeak ? '0 0 0 2px var(--ink-100)' : 'none'};"></div>
        </div>
        <div style="font-size:11px; color:var(--gray-500);">${monthNames[i].slice(0,3)}</div>
      </div>`;
  }).join('');

  document.getElementById('ctgTrendChart').innerHTML =
    `<div style="display:flex; gap:6px; align-items:flex-end; border-bottom:1px solid var(--gray-200); padding-bottom:2px;">${bars}</div>`;
}

function openCtgContributeModal(){

  document.getElementById('ctgCfDate').value = new Date().toISOString().slice(0,10);

  openModal('modalCtgContribute');

function submitCtgContribution(){
  const departmentName = document.getElementById('ctgCfDepartment').value;
  const date = document.getElementById('ctgCfDate').value;
  const quantity = Number(document.getElementById('ctgCfQuantity').value) || 0;
  const note = document.getElementById('ctgCfNote').value.trim();
  const errEl = document.getElementById('ctgCfError');
  errEl.classList.add('hidden');

  if (!departmentName && deptOn('cartridge')){ errEl.textContent = 'กรุณาเลือกหน่วยงาน'; errEl.classList.remove('hidden'); return; }
  if (quantity <= 0){ errEl.textContent = 'กรุณาระบุจำนวนตลับหมึกให้ถูกต้อง'; errEl.classList.remove('hidden'); return; }

  google.script.run.withSuccessHandler(() => {
    closeModals();
    const who = departmentName ? escapeHtml(departmentName) + ' • ' : '';
    showThanks({
      title: 'ท่านบันทึกส่งตลับหมึกเรียบร้อยแล้ว',
      detail: `${who}ส่งตลับหมึกใช้แล้ว ${quantity} ตลับ`,
      wait: 'รอผู้ดูแลระบบยืนยันอีกครั้ง — ยอดและอันดับหน่วยงานจะแสดงหลังผู้ดูแลระบบยืนยัน',
      proj: 'โครงการ "ตลับหมึกเก่าเราขอ" 💜',
      more: openCtgContributeModal
    });
    showCtgConfirm(`✅ ท่านบันทึกส่งตลับหมึก ${quantity} ตลับเรียบร้อยแล้ว — รอผู้ดูแลระบบยืนยันอีกครั้ง ขอบคุณที่ร่วมเป็นผู้ร่วมรักษาสิ่งแวดล้อมไปด้วยกัน 💜`);
    state.cartridgeLoaded = false;
    loadCartridgeData();
  }).withFailureHandler(err => {
    errEl.textContent = err.message || String(err);
    errEl.classList.remove('hidden');
  }).submitCartridgeContribution(departmentName, quantity, date, note);
}

  const input = document.getElementById('ctgShareLinkInput');
  const confirmEl = document.getElementById('ctgCopyConfirm');
  const showConfirm = () => {
    confirmEl.classList.remove('hidden');
    setTimeout(() => confirmEl.classList.add('hidden'), 2500);
  };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(input.value).then(showConfirm).catch(() => fallbackCopy(input, showConfirm));
  } else {
    fallbackCopy(input, showConfirm);
  }
}

/* ---------- ส่งออก Excel ---------- */
function exportCartridgeExcel(){
  const data = state.cartridgeOverview;
  if (!data || data.salesThisYear.length === 0){ alert('ไม่มีข้อมูลรายการจำหน่ายในปีนี้ให้ส่งออก'); return; }

  const rows = data.salesThisYear.map(s => ({
    'วันที่จำหน่าย': fmtDate(s.SaleDate),
    'ผู้ซื้อ/ร้านรับซื้อ': s.BuyerName,
    'จำนวน (ตลับ)': s.Quantity,
    'ราคาต่อตลับ (บาท)': s.UnitPrice,
    'จำนวนเงิน (บาท)': s.Amount,
    'หมายเหตุ': s.Note || ''
  }));

  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, `ตลับหมึก ${data.year + 543}`);
  XLSX.writeFile(wb, `โครงการ_ตลับหมึกเก่าเราขอ_${data.year}_${todayStr()}.xlsx`);
}

/* ---------- ส่งออก PDF (A4 แนวนอน หลายหน้า) ---------- */
async function exportCartridgePDF(){
  const data = state.cartridgeOverview;
  if (!data){ alert('ไม่มีข้อมูลให้ส่งออก กรุณารอให้โหลดข้อมูลเสร็จแล้วลองใหม่'); return; }

  const btn = document.getElementById('btnCtgExportPdf');
  const oldText = btn.textContent;
  btn.disabled = true; btn.textContent = '⏳ กำลังสร้างรายงาน...';

  try {
    const pages = [];
    pages.push(rpCartridgeSummaryPage(data));

    const rank = data.contributionLeaderboard || [];
    if (rank.length){
      pages.push(...chunkArray(rank, 14).map((chunk, ci, all) =>
        rpCartridgeRankPage(chunk, data, ci, all.length)));
    }

    const sales = data.salesThisYear || [];
    if (sales.length){
      pages.push(...chunkArray(sales, 16).map((chunk, ci, all) =>
        rpCartridgeSalesPage(chunk, data, ci, all.length)));
    }

    const pending = data.pendingContributions || [];
    if (pending.length){
      pages.push(...chunkArray(pending, 16).map((chunk, ci, all) =>
        rpCartridgeContribStatusPage('⏳ ตลับหมึกส่งเข้าโครงการ รอจำหน่าย', chunk, ci, all.length)));
    }

    const unsellable = data.unsellableContributions || [];
    if (unsellable.length){
      pages.push(...chunkArray(unsellable, 16).map((chunk, ci, all) =>
        rpCartridgeContribStatusPage('🚫 ตลับหมึกส่งเข้าโครงการ จำหน่ายไม่ได้', chunk, ci, all.length)));
    }

    await printPages(pages);
  } catch (err) {
    alertErr(err);
  } finally {
    btn.disabled = false; btn.textContent = oldText;
  }
}

      `น้ำหนัก/ตลับ ${at.weightPerUnitKg} กก. • ค่าทำลาย ${at.disposalCostPerKg} บาท/กก. • พิมพ์เมื่อ ${todayStrThai()}`)}

      <tbody>${tableRows || '<tr><td colspan="5">ยังไม่มีข้อมูล</td></tr>'}</tbody>
    </table>`;

function rpCartridgeRankPage(chunk, data, pageIndex, totalPages){
  const all = data.contributionLeaderboard || [];
  const max = Math.max(1, ...all.map(d => d.totalQuantity));
  const rows = chunk.map(d => {
    const pct = Math.round((d.totalQuantity / max) * 100);
    return `
      <div class="rp-pl-rank-row">
        <div class="rp-pl-rank-num">${d.rank}</div>
        <div class="rp-pl-rank-name">${escapeHtml(d.DepartmentName)}</div>
        <div class="rp-pl-rank-bar-track"><span class="rp-ctg-rank-bar-fill" style="width:${pct}%;"></span></div>
        <div class="rp-pl-rank-val"><b>${d.totalQuantity.toLocaleString()}</b> ตลับ</div>
      </div>`;
  }).join('');
  return `
    ${rpHeader('🏆 อันดับหน่วยงานที่ส่งตลับหมึกเข้าโครงการมากที่สุด', `สะสมตั้งแต่เริ่มโครงการ • ส่วนที่ ${pageIndex + 1}/${totalPages}`)}
    ${rows}`;
}

      <td style="text-align:right;">${s.Quantity.toLocaleString()}</td>

    <table class="print-table">
      <thead><tr><th>วันที่</th><th>ผู้ซื้อ/ร้านรับซื้อ</th><th style="text-align:right;">จำนวน (ตลับ)</th><th style="text-align:right;">ราคาต่อตลับ (บาท)</th><th style="text-align:right;">จำนวนเงิน (บาท)</th><th>หมายเหตุ</th></tr></thead>

function rpCartridgeContribStatusPage(title, chunk, pageIndex, totalPages){

  document.getElementById('envPaperlessStats').innerHTML = loadingHtml;

  document.getElementById('envCartridgeStats').innerHTML = loadingHtml;
  document.getElementById('envKitchenStats').innerHTML = loadingHtml;
  document.getElementById('envCalendarStats').innerHTML = loadingHtml;
  document.getElementById('envShareStats').innerHTML = loadingHtml;
  google.script.run.withSuccessHandler(data => {
    state.envReportLoaded = true;
    state.envReportData = data;

    renderEnvCartridgeCard(data);

function envDonutSvg(sorted, total, centerTop, centerNum, centerUnit){
  const R = 66, C = 2 * Math.PI * R;
  let off = 0, segs = '', labels = '';
  sorted.filter(r => r.v > 0).forEach(r => {
    const frac = r.v / total, len = frac * C;
    segs += `<circle cx="100" cy="100" r="${R}" fill="none" stroke="${r.it.color}" stroke-width="34" stroke-dasharray="${len.toFixed(3)} ${(C - len).toFixed(3)}" stroke-dashoffset="${(-off).toFixed(3)}" transform="rotate(-90 100 100)"/>`;
    if (frac >= 0.05){
      const ang = (off + len / 2) / C * 2 * Math.PI - Math.PI / 2;
      labels += `<text x="${(100 + R * Math.cos(ang)).toFixed(1)}" y="${(100 + R * Math.sin(ang) + 3.5).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="800" fill="#fff">${shipNum(frac * 100, 1)}%</text>`;
    }
    off += len;
  });
  return `<svg class="env-donut" viewBox="0 0 200 200" role="img" aria-label="สัดส่วน CO₂ ที่ลดได้แยกตามโครงการ">
    <circle cx="100" cy="100" r="${R}" fill="none" stroke="#e8efe9" stroke-width="34"/>${segs}${labels}
    <circle cx="100" cy="100" r="48" fill="#fff"/>
    <text x="100" y="86" text-anchor="middle" font-size="9.5" fill="#6b7570">${centerTop}</text>
    <text x="100" y="112" text-anchor="middle" font-size="27" font-weight="800" fill="#1f6f3c">${centerNum}</text>
    <text x="100" y="128" text-anchor="middle" font-size="10" fill="#6b7570">${centerUnit}</text></svg>`;
}

function renderEnvCo2Split(data){
  const rows = ENV_SPLIT_ITEMS.map(it => ({ it, v: Number(it.get(data)) || 0 }));
  const total = rows.reduce((a, r) => a + r.v, 0);
  const el = document.getElementById('envCo2Split');
  const head = `<div class="env-pill"><span>📊</span> สัดส่วน CO₂ ที่ลดได้ แยกตามโครงการ</div>`;
  if (!(total > 0)){
    el.innerHTML = head + '<p class="muted">ยังไม่มีข้อมูลให้คำนวณ</p>';
    return;
  }
  const sorted = rows.slice().sort((a, b) => b.v - a.v);
  const top = sorted[0];
  el.innerHTML = head + `
    <div class="env-donut-wrap">
      ${envDonutSvg(sorted, total, 'รวมทุกโครงการ', shipNum(total / 1000, 2), 'ตัน CO₂')}
      <div class="env-split-list">${sorted.map(r => `
        <div class="env-split-item"><span class="env-split-dot" style="background:${r.it.color};"></span>
          <span class="nm">${r.it.label}</span><span class="vl">${shipNum(r.v)} กก.</span><span class="pc">${shipNum(r.v / total * 100, 1)}%</span></div>`).join('')}</div>
    </div>
    <p class="env-split-note">มากสุดคือ <b>${top.it.label}</b> (${shipNum(top.v / total * 100, 1)}% จากทั้งหมด ${shipNum(total)} กก.) • โครงการที่ตัวเลขน้อย ไม่ได้แปลว่าไม่สำคัญ — บางโครงการมีคุณค่าด้านอื่น เช่น ลดขยะอันตราย ช่วยผู้พิการทางสายตา หรือประหยัดงบประมาณ</p>`;
}

  const cards = ['envPaperlessCard', 'envFtfCard', 'envCartridgeCard', 'envKitchenCard', 'envCalendarCard', 'envShareCard'].map(clean);

  return [
    `<div class="rp-env rp-env-poster">${poster}

      <div class="env-main-grid"><section class="env-panel env-donut-card">${document.getElementById('envCo2Split').innerHTML}</section>

      <div class="env-kpi-row">${document.getElementById('envKpiRow').innerHTML}</div></div>`,
    `<div class="rp-env">${hdr('📂 ผลลัพธ์แยกรายโครงการ (1/2)')}${grid(cards.slice(0, 3))}</div>`,
